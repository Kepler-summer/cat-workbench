<script>
const SUPABASE_URL = "https://ksljnxlgoajbhxshqvaf.supabase.co";
const SUPABASE_KEY = "sb_publishable_BxKV01FyPcYliI3jwSedqg_ukfbMhgk";

let sb = null;
let tablesReady = false;
let adminUserId = null;

const SQL_USERS = `-- ============================================================
--  猫咪时间报 · 用户管理表
--  在 Supabase Dashboard → SQL Editor 中执行
-- ============================================================

-- 用户表：最多 2 个账号（管理员 + 家属）
CREATE TABLE IF NOT EXISTS workbench_users (
  id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  username TEXT NOT NULL UNIQUE,
  password_hash TEXT NOT NULL,
  role TEXT NOT NULL DEFAULT 'family' CHECK (role IN ('admin', 'family')),
  created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);

-- 启用 RLS
ALTER TABLE workbench_users ENABLE ROW LEVEL SECURITY;

-- 允许匿名访问
CREATE POLICY "allow_all_users" ON workbench_users
  FOR ALL USING (true) WITH CHECK (true);

-- 启用 Realtime（可选）
ALTER PUBLICATION supabase_realtime ADD TABLE workbench_users;`;

async function init() {
  // 加载 Supabase
  const script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  script.onload = () => {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    checkTables();
  };
  document.head.appendChild(script);
}

function log(msg, type = "info") {
  const box = document.getElementById("logBox");
  box.style.display = "block";
  const line = document.createElement("div");
  line.className = "log-line " + type;
  const time = new Date().toLocaleTimeString('zh-CN');
  line.textContent = `[${time}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

async function checkTables() {
  document.getElementById("checkStatus").textContent = "检查中...";
  document.getElementById("checkStatus").className = "status pending";

  let dataOk = false, usersOk = false;

  try {
    const { error } = await sb.from("workbench_data").select("storage_key").limit(1);
    dataOk = !error;
  } catch(e) {}

  try {
    const { error } = await sb.from("workbench_users").select("id").limit(1);
    usersOk = !error;
  } catch(e) {}

  if (dataOk && usersOk) {
    tablesReady = true;
    document.getElementById("checkStatus").textContent = "✅ 表已就绪";
    document.getElementById("checkStatus").className = "status ok";
    document.getElementById("checkDesc").textContent = "workbench_data 和 workbench_users 表均已创建。";
    document.getElementById("sqlSection").style.display = "none";
    // 进入下一步
    document.getElementById("userForm").style.display = "block";
    document.getElementById("userStatus").textContent = "可以创建";
    document.getElementById("userStatus").className = "status ok";
    // 检查是否已有用户
    checkExistingUsers();
  } else {
    document.getElementById("checkStatus").textContent = "❌ 缺少表";
    document.getElementById("checkStatus").className = "status fail";
    document.getElementById("checkDesc").textContent = `缺少数据表：${!dataOk ? 'workbench_data ' : ''}${!usersOk ? 'workbench_users' : ''}`;
    document.getElementById("sqlSection").style.display = "block";
    document.getElementById("sqlCode").textContent = SQL_USERS;
  }
}

async function checkExistingUsers() {
  try {
    const { data } = await sb.from("workbench_users").select("id, username, role").order("created_at");
    if (data && data.length > 0) {
      const admin = data.find(u => u.role === "admin");
      if (admin) {
        document.getElementById("userStatus").textContent = `已有 ${data.length} 个用户`;
        document.getElementById("adminUser").value = admin.username;
        document.getElementById("adminUser").disabled = true;
        document.getElementById("adminPass").placeholder = "留空则不修改";
        document.getElementById("createUserBtn").textContent = "使用此账号继续";
        adminUserId = admin.id;
        document.getElementById("seedStatus").textContent = "可以生成";
        document.getElementById("seedStatus").className = "status ok";
        document.getElementById("seedBtn").disabled = false;
      }
    }
  } catch(e) {}
}

function copySql() {
  navigator.clipboard.writeText(document.getElementById("sqlCode").textContent);
  const btn = document.querySelector(".copy-btn");
  btn.textContent = "✅ 已复制";
  btn.classList.add("copied");
  setTimeout(() => {
    btn.textContent = "📋 复制 SQL";
    btn.classList.remove("copied");
  }, 2000);
}

async function hash(password) {
  const enc = new TextEncoder().encode(password + "__cat_salt_2026__");
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function createUser() {
  const username = document.getElementById("adminUser").value.trim();
  const password = document.getElementById("adminPass").value;
  const btn = document.getElementById("createUserBtn");

  if (!username || !password) {
    alert("请填写用户名和密码");
    return;
  }

  btn.disabled = true;
  btn.textContent = "创建中...";

  try {
    // 检查是否已有管理员
    const { data: users } = await sb.from("workbench_users").select("id, role");
    const hasAdmin = users?.some(u => u.role === "admin");
    const role = hasAdmin ? "family" : "admin";

    const pwHash = await hash(password);
    const { data, error } = await sb
      .from("workbench_users")
      .insert({ username, password_hash: pwHash, role })
      .select();

    if (error) {
      if (error.code === "23505") {
        // 用户已存在，尝试登录
        const { data: rows } = await sb
          .from("workbench_users")
          .select("id, username, role, password_hash")
          .eq("username", username)
          .limit(1);
        if (rows && rows.length > 0 && rows[0].password_hash === pwHash) {
          adminUserId = rows[0].id;
          document.getElementById("userStatus").textContent = "登录成功";
          document.getElementById("userStatus").className = "status ok";
          document.getElementById("seedStatus").textContent = "可以生成";
          document.getElementById("seedStatus").className = "status ok";
          document.getElementById("seedBtn").disabled = false;
          btn.textContent = "✅ 登录成功";
          return;
        }
      }
      throw error;
    }

    adminUserId = data[0].id;
    document.getElementById("userStatus").textContent = "创建成功";
    document.getElementById("userStatus").className = "status ok";
    document.getElementById("seedStatus").textContent = "可以生成";
    document.getElementById("seedStatus").className = "status ok";
    document.getElementById("seedBtn").disabled = false;
    btn.textContent = "✅ 创建成功";
  } catch (e) {
    alert("创建失败：" + e.message);
    btn.disabled = false;
    btn.textContent = "创建账号";
  }
}

async function seedData() {
  if (!adminUserId) return;
  const btn = document.getElementById("seedBtn");
  btn.disabled = true;
  btn.textContent = "生成中...";

  const storageKey = "cat-time-bureau-v1-u" + adminUserId;

  log("Storage Key: " + storageKey, "info");

  const now = new Date();
  const today = now.toISOString().split("T")[0];
  const yesterday = new Date(now.getTime() - 86400000).toISOString().split("T")[0];
  const dayBefore = new Date(now.getTime() - 2 * 86400000).toISOString().split("T")[0];

  const seedData = {
    todo: [
      { id: 1001, title: "晨跑 30 分钟", priority: "P1", done: true, note: "小区跑一圈", time: "07:00", date: today, _ptsAwarded: true },
      { id: 1002, title: "读完《深度工作》第 3 章", priority: "P0", done: false, note: "做读书笔记", time: "20:00", date: today },
      { id: 1003, title: "给小猫梳毛", priority: "P2", done: true, note: "布偶容易打结", time: "21:00", date: today, _ptsAwarded: true },
      { id: 1004, title: "整理本周记账", priority: "P1", done: false, time: "19:30", date: today },
      { id: 1005, title: "写一篇小红书", priority: "P2", done: false, time: "", date: today },
    ],
    money: [
      { id: 2001, title: "抹茶拿铁", type: "expense", amount: 28, category: "饮品", date: today },
      { id: 2002, title: "猫粮补货", type: "expense", amount: 168, category: "宠物", date: yesterday },
      { id: 2003, title: "稿费收入", type: "income", amount: 500, category: "副业", date: yesterday },
      { id: 2004, title: "超市购物", type: "expense", amount: 156.5, category: "日常", date: dayBefore },
      { id: 2005, title: "电影票", type: "expense", amount: 80, category: "娱乐", date: dayBefore },
    ],
    note: [
      { id: 3001, title: "周末烘焙灵感", content: "想试试做巴斯克芝士蛋糕，需要：奶油奶酪、淡奶油、鸡蛋、白砂糖、低筋面粉。温度 220 度烤 25 分钟。", mood: "灵感", category: "美食记录", date: today, layout: "default" },
      { id: 3002, title: "小猫今日睡姿", content: "今天布偶弟弟在阳台晒太阳，四脚朝天睡得特别香，尾巴还在轻轻晃，做梦了吧～", mood: "治愈", category: "生活随笔", date: yesterday, layout: "feature" },
    ],
    checkin: [
      { id: 4001, title: "喝够 8 杯水", log: { [today]: true, [yesterday]: true, [dayBefore]: true } },
      { id: 4002, title: "早睡（11 点前）", log: { [yesterday]: true, [dayBefore]: true } },
    ],
    progress: [
      { id: 5001, title: "《深度工作》", current: 45, target: 280, unit: "页", note: "读到第 3 章了" },
      { id: 5002, title: "日语学习", current: 3, target: 30, unit: "课", note: "标准日本语初级" },
    ],
    __rewards: [
      { id: 6001, name: "喝一杯奶茶", cost: 50 },
      { id: 6002, name: "看一场电影", cost: 100 },
      { id: 6003, name: "买一本新书", cost: 150 },
      { id: 6004, name: "周末睡到自然醒", cost: 30 },
    ],
    __pointsLog: [
      { id: 7001, type: "task", amount: 10, description: "完成任务: 晨跑 30 分钟", time: new Date(now.getTime() - 3600000).toISOString() },
      { id: 7002, type: "task", amount: 10, description: "完成任务: 给小猫梳毛", time: new Date(now.getTime() - 7200000).toISOString() },
      { id: 7003, type: "finance", amount: 5, description: "记账: 抹茶拿铁", time: new Date(now.getTime() - 1800000).toISOString() },
    ],
    __avatar: "",
  };

  try {
    // 先检查是否已有数据
    const { data: existing } = await sb
      .from("workbench_data")
      .select("id")
      .eq("storage_key", storageKey)
      .limit(1);

    let result;
    if (existing && existing.length > 0) {
      // 更新
      log("检测到已有数据，正在更新...", "info");
      result = await sb
        .from("workbench_data")
        .update({ data: seedData, updated_at: new Date().toISOString() })
        .eq("storage_key", storageKey);
    } else {
      // 插入
      log("正在写入新数据...", "info");
      result = await sb
        .from("workbench_data")
        .insert({ storage_key: storageKey, data: seedData, device_id: "init-script" });
    }

    if (result.error) throw result.error;

    log("✅ 数据写入成功！", "success");
    log(`任务：${seedData.todo.length} 条`, "success");
    log(`记账：${seedData.money.length} 条`, "success");
    log(`灵感：${seedData.note.length} 条`, "success");
    log(`奖励：${seedData.__rewards.length} 个`, "success");
    log(`积分：${seedData.__pointsLog.reduce((s,x)=>s+x.amount,0)} 分`, "success");

    const { data: userData } = await sb
      .from("workbench_users")
      .select("id, username, role")
      .eq("id", adminUserId)

      const u = userData[0];
      localStorage.setItem("__cat_session", JSON.stringify({
        userId: u.id, username: u.username, role: u.role
      }));
      log("已自动登录，3 秒后跳转到工作台...", "info");

}

// role picker
document.querySelectorAll(".role-opt").forEach(opt => {

    document.querySelectorAll(".role-opt").forEach(o => o.classList.remove("on"));
