<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二猫 · 重置登录密码（本地工具）</title>
<style>
  :root{
    --page-bg:#eceef2; --card:#fafbfc; --nested:#f0f2f5;
    --border:#dfe3e8; --border-input:#c8ccd2;
    --text:#1a1d23; --text-2:#555b66; --text-3:#8b919c;
    --accent:#2d7a5e; --accent-light:#7eb89a; --accent-muted:#d5ebe0;
    --danger:#c05a4e; --danger-muted:#f7e6e3;
    --warn:#c08a3e; --warn-muted:#f9f0dd;
    --ok:#2d7a5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--page-bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.6;
  }
  .wrap{width:100%;max-width:480px}
  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:28px; box-shadow:0 4px 20px rgba(26,29,35,.06);
  }
  h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .sub{font-size:13px;color:var(--text-3);margin-bottom:20px}
  .notice{
    background:var(--warn-muted); border:1px solid #ecd9ae; color:#7a5a1e;
    border-radius:12px; padding:12px 14px; font-size:12.5px; margin-bottom:20px;
  }
  .notice b{display:block;margin-bottom:4px;font-size:13px}
  .notice ul{margin:6px 0 0 16px}
  .notice li{margin:2px 0}
  label{display:block;font-size:13px;color:var(--text-2);font-weight:600;margin:16px 0 6px}
  select,input{
    width:100%; padding:11px 13px; font-size:15px; font-family:inherit;
    border:1px solid var(--border-input); border-radius:11px;
    background:var(--card); color:var(--text); outline:none;
  }
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-muted)}
  .acct{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--nested); border:1px solid var(--border);
    border-radius:11px; padding:11px 13px; margin-bottom:4px; font-size:14px;
  }
  .acct .tag{
    font-size:11px; padding:2px 8px; border-radius:20px;
    background:var(--accent-muted); color:var(--accent); font-weight:600;
  }
  .acct .tag.family{background:#e8eef7;color:#5a82b0}
  button{
    width:100%; margin-top:22px; padding:13px; font-size:15px; font-weight:600;
    font-family:inherit; border:none; border-radius:12px; cursor:pointer;
    background:var(--accent); color:#fff;
  }
  button:hover:not(:disabled){background:#24634c}
  button:disabled{background:var(--border-input);cursor:not-allowed}
  .msg{
    margin-top:16px; padding:12px 14px; border-radius:11px;
    font-size:13.5px; display:none;
  }
  .msg.show{display:block}
  .msg.ok{background:var(--accent-muted);color:var(--ok)}
  .msg.err{background:var(--danger-muted);color:var(--danger)}
  .msg.info{background:var(--nested);color:var(--text-2)}
  .hint{font-size:12px;color:var(--text-3);margin-top:6px}
  .foot{margin-top:18px;font-size:12px;color:var(--text-3);text-align:center;line-height:1.7}
  code{background:var(--nested);padding:1px 5px;border-radius:4px;font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🔑 重置登录密码</h1>
    <div class="sub">二猫 · 本地维护工具</div>

    <div class="notice">
      <b>⚠️ 使用前请先看</b>
      <ul>
        <li>密码只在你自己的浏览器里计算，<b>不会上传到任何第三方</b>，也不会经过旁人</li>
        <li>本工具<b>只改登录密码</b>，记账数据、打卡记录、糖币、藏品<b>全部不动</b></li>
        <li>打开页面<b>不会自动改动任何账号</b>，必须你选账号 + 填新密码 + 点按钮才生效</li>
        <li>用完建议把这个文件删掉，别推到 GitHub</li>
      </ul>
    </div>

    <label>1. 选择要重置的账号</label>
    <div id="acctBox">
      <div class="acct"><span>正在读取账号…</span></div>
    </div>

    <label for="p1">2. 输入新密码</label>
    <input id="p1" type="password" placeholder="新密码（至少 4 位）" autocomplete="new-password">

    <label for="p2">3. 再输入一次确认</label>
    <input id="p2" type="password" placeholder="再次输入新密码" autocomplete="new-password">

    <button id="go" disabled>重置密码</button>
    <div class="msg" id="msg"></div>

    <div class="foot">
      重置成功后，回到 <code>index.html</code> 用新密码登录即可。<br>
      这个工具页用完请删除，并确认已加入 <code>.gitignore</code>。
    </div>
  </div>
</div>

<script>
/* ============================================================
   配置：与主站 index.html 保持一致
   ============================================================ */
const SB_URL  = "https://ksljnxlgoajbhxshqvaf.supabase.co";
const SB_KEY  = "sb_publishable_BxKV01FyPcYliI3jwSedqg_ukfbMhgk";
const SALT    = "__cat_salt_2026__";   // 必须与 index.html 的 hash() 完全一致

const $  = s => document.querySelector(s);
const msgEl = $("#msg"), goBtn = $("#go");

let accounts = [];
let selectedId = null;

function show(text, type="info"){
  msgEl.textContent = text;
  msgEl.className = "msg show " + type;
}

/* 与主站完全相同的哈希算法 */
async function hash(password){
  const enc = new TextEncoder().encode(password + SALT);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ---------- 1. 读取账号列表（只读，不改任何数据） ---------- */
async function loadAccounts(){
  // crypto.subtle 需要安全上下文（https / localhost / 127.0.0.1）
  if(!window.crypto || !window.crypto.subtle){
    show("当前环境不支持加密计算（需要 https 或 localhost 打开）。\n请通过 http://localhost:8765/reset-password.html 访问，不要直接双击打开文件。", "err");
    return;
  }
  try{
    const res = await fetch(
      `${SB_URL}/rest/v1/workbench_users?select=id,username,role,apply_status`,
      { headers:{ apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } }
    );
    if(!res.ok){
      show("读取账号失败（HTTP " + res.status + "）。请检查网络或 Supabase 密钥是否仍有效。", "err");
      return;
    }
    accounts = await res.json();
    if(!accounts.length){
      show("账号表里没有数据，可能连错了数据库。", "err");
      return;
    }
    renderAccounts();
  }catch(e){
    show("无法连接数据库：" + e.message, "err");
  }
}

function renderAccounts(){
  const box = $("#acctBox");
  box.innerHTML = "";
  accounts.forEach(a => {
    const row = document.createElement("label");
    row.className = "acct";
    row.style.cursor = "pointer";
    row.innerHTML = `
      <span><input type="radio" name="acct" value="${a.id}" style="width:auto;margin-right:8px">
        ${escapeHtml(a.username)}</span>
      <span class="tag ${a.role === "family" ? "family" : ""}">${a.role === "admin" ? "管理员" : "家属"}</span>`;
    row.querySelector("input").onchange = () => {
      selectedId = a.id;
      validate();
    };
    box.appendChild(row);
  });
  validate();
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

/* ---------- 2. 校验输入 ---------- */
function validate(){
  const p1 = $("#p1").value, p2 = $("#p2").value;
  const ok = selectedId !== null && p1.length >= 4 && p1 === p2;
  goBtn.disabled = !ok;
  return ok;
}

$("#p1").oninput = validate;
$("#p2").oninput = validate;

/* ---------- 3. 执行重置（唯一会写入数据库的地方） ---------- */
goBtn.onclick = async () => {
  if(!validate()){
    if(selectedId === null)            show("请先选择一个账号。", "err");
    else if($("#p1").value.length < 4) show("新密码至少 4 位。", "err");
    else                               show("两次输入的密码不一致。", "err");
    return;
  }

  const acct = accounts.find(a => a.id === selectedId);
  if(!confirm(`确认重置账号「${acct.username}」的登录密码吗？\n\n只会改密码，其他数据不受影响。`)) return;

  goBtn.disabled = true;
  goBtn.textContent = "处理中…";

  try{
    const newHash = await hash($("#p1").value);

    // 只更新 password_hash 这一个字段
    const res = await fetch(
      `${SB_URL}/rest/v1/workbench_users?id=eq.${selectedId}`,
      {
        method: "PATCH",
        headers:{
          apikey: SB_KEY,
          Authorization: "Bearer " + SB_KEY,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify({ password_hash: newHash })
      }
    );

    if(!res.ok){
      const t = await res.text();
      show("重置失败（HTTP " + res.status + "）：" + t, "err");
      goBtn.disabled = false;
      goBtn.textContent = "重置密码";
      return;
    }

    const updated = await res.json();
    if(!updated || !updated.length){
      show("重置未生效：没有匹配到账号，数据未改动。", "err");
      goBtn.disabled = false;
      goBtn.textContent = "重置密码";
      return;
    }

    show("✅ 账号「" + acct.username + "」的密码已重置。\n现在可以回 index.html 用新密码登录了。", "ok");
    $("#p1").value = "";
    $("#p2").value = "";
    goBtn.disabled = true;
    goBtn.textContent = "重置密码";
  }catch(e){
    show("出错：" + e.message, "err");
    goBtn.disabled = false;
    goBtn.textContent = "重置密码";
  }
};

loadAccounts();
</script>
</body>
</html>
