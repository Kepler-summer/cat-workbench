<!DOCTYPE html>
<html lang="zh" data-theme="light"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>二猫 · 我们一起记账和规划时间</title>
<!-- 日系手账手写字体（国内镜像，离线时回退本机楷体） -->
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     THEME TOKENS — 二猫 · 情侣共同记账与时间规划
     蓝色科技底纹 · 绿色主色调 · 活泼趣味
     ============================================================ */
  :root {
    /* ---- 页面与表面 — 韩系低饱和温调 ---- */
    --page-bg: #eceef2;              /* 柔和温灰底色 */
    --surface-card: #fafbfc;         /* 卡片/面板/输入框/按钮的主背景 */
    --surface-nested: #f0f2f5;       /* 嵌套区域：图标瓦底、ghost 按钮、hero 底、日历格底 */
    --bg-secondary: #f4f6f8;         /* 次级背景：列表项、tab 底 */
    --bg-tertiary: #eceef2;          /* 三级背景：hover 态 */

    /* ---- 边框 ---- */
    --border: #dfe3e8;               /* 常规边框：卡片、分隔线 */
    --border-input: #c8ccd2;         /* 强边框：输入框、按钮、chip、勾选框、grab */
    --border-soft: #eaecef;          /* 软边框：虚线、分隔 */

    /* ---- 文本层级 ---- */
    --text: #1a1d23;                 /* 主文本：标题、正文、数值 */
    --text-secondary: #555b66;       /* 次文本：标签、副标题、描述、字段 label */
    --text-tertiary: #8b919c;        /* 弱文本：图标色、导航字、占位、星期行、空态 */

    /* ---- 主色（按钮/选中/强调）— 韩系沉稳绿 ---- */
    --accent: #2d7a5e;               /* 主色：沉稳森林绿 */
    --accent-light: #7eb89a;         /* 主色浅：渐变、进度条 */
    --accent-muted: #d5ebe0;         /* 主色浅底：focus ring 光晕、step 按钮 active 底 */
    --on-accent: #fafbfc;            /* 主色上的前景文字 */

    /* ---- 糖果/暖色系 — 降饱和 ---- */
    --candy: #d4a05c;                /* 糖果暖橙：buff、奖品、糖币强调 */
    --candy-light: #e8c89a;          /* 糖果浅橙 */
    --candy-muted: #f7eede;          /* 糖果浅底 */
    --berry: #9a7cb8;                /* 莓果紫：藏品、纪念 */
    --berry-muted: #eee8f4;          /* 莓果浅底 */

    /* ---- 模块色（5 色轮转）— 低饱和高级灰调 ---- */
    --module-1: #3a9d72;             /* 活力绿 — 打卡/完成/预算 */
    --module-2: #5a82b0;             /* 科技蓝 — 阅读/focus/趋势线 */
    --module-3: #c0a048;             /* 时光金 — 运动/连续天数/星标 */
    --module-4: #3a8a8a;             /* 青蓝 — 记账/占比图 */
    --module-5: #7c6ca0;             /* 星空紫 — 笔记/日记 */

    /* ---- 危险色 ---- */
    --danger: #d4574a;               /* 删除/危险操作 */
    --danger-muted: #f8eae8;         /* 危险浅底：删除 hover、P0 标签 */
    --success: #2f9e6b;              /* 收入/进账 — 沉稳绿 */
    --success-muted: #e6f3ec;        /* 收入浅底 */

    /* ---- 抽屉（日系手账奶油白面板） ---- */
    --drawer-bg: #fffdf7;            /* 抽屉底色 */
    --drawer-bg-top: #fffdf7;        /* 抽屉渐变上色 */
    --drawer-text: #5C4A3A;          /* 抽屉前景文字 */
    --drawer-text-mute: #a89b88;     /* 抽屉次要文字/图标 */
    --drawer-hover: #f8f2e4;         /* 抽屉悬停底 */
    --drawer-active: #f7f0e6;        /* 抽屉选中底 — 焦糖色淡底 */

    /* ---- 背景图 ---- */
    --greet-image: url("assets/banner-cats-new.jpg");  /* 首页 hero 背景图 */
    --page-texture: none;                            /* 页面纹理叠加（none 或 url(...)），不影响内容层 */

    /* ---- 圆角（按组件角色，不要裸写数字） ---- */
    --radius-control: 8px;           /* 勾选框、步进按钮、日历格 */
    --radius-tile: 12px;             /* 图标瓦、输入框、按钮、chip、cal-nav */
    --radius-card: 16px;             /* 卡片、面板、hero、空态图标 */
    --radius-sheet: 22px;            /* 底部弹窗顶部圆角 */

    /* ---- 阴影 — tinytype 风格分层阴影 ---- */
    --shadow-card: 0 1px 3px rgba(26,41,56,.04), 0 4px 12px rgba(26,41,56,.03);
    --shadow-card-hover: 0 2px 8px rgba(26,41,56,.06), 0 8px 24px rgba(26,41,56,.05);
    --shadow-overlay: 0 -4px 30px rgba(26,41,56,.08), 0 -1px 8px rgba(26,41,56,.04);

    /* ---- 情侣色对 ---- */
    --accent-pair-1: #e8a0a0;   /* 浅珊瑚（猫一·管理员） */
    --accent-pair-2: #a0c4e8;   /* 浅天蓝（猫二·家属） */

    /* ---- 恋爱色（「在一起」气泡专用）---- */
    --love-soft: #fdf7f8;       /* 极淡暖粉底：气泡渐变起止 */
    --love-tint: #f8ecef;       /* 暖粉中段：渐变 55% */
    --love-ink:  #a84965;       /* 正文级深玫瑰：天数数字（4.79:1，满足 WCAG AA） */

    /* ---- 字体与布局 ---- */
    --font: "Times New Roman", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --nav-h: 72px;                   /* 底部导航栏高度 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--module-2); outline-offset: 2px; border-radius: 4px; }
  button { -webkit-focus-ring-color: var(--module-2); }
  html, body { height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; letter-spacing: .01em;
    max-width: 520px; margin: 0 auto; position: relative;
    min-height: 100vh; overflow-x: hidden;
    padding-top: env(safe-area-inset-top);
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(rgba(180,186,196,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,186,196,.03) 1px, transparent 1px),
      radial-gradient(circle at 50% 0%, rgba(45,122,94,.02), transparent 55%);
    background-size: 28px 28px, 28px 28px, 100% 100%;
    background-position: 0 0, 0 0, center top;
    opacity: 1; }
  .app { padding: 0 20px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom)); }
  svg { display: block; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 14px 0 12px; backdrop-filter: blur(10px);
    background: linear-gradient(180deg, color-mix(in srgb, var(--page-bg) 94%, transparent), color-mix(in srgb, var(--page-bg) 50%, transparent)); }
  .topbar .menu-btn { width: 38px; height: 38px; border: none; border-radius: var(--radius-tile); background: var(--surface-card);
    box-shadow: var(--shadow-card); display: grid; place-items: center; cursor: pointer; color: var(--text); }
  .topbar .title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; flex: 1; line-height: 1.2; }
  .topbar .title small { display:block; font-size: 11px; font-weight: 500; color: var(--text-secondary); letter-spacing:.02em; margin-top: 2px; }
  /* sync-badge removed */
  .date-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* 首页 topbar 融入白色欢迎卡片 */
  .app.home-view .topbar { position: relative; top: auto; background: transparent; backdrop-filter: none;
    padding: 14px 2px 10px; }
  .app.home-view .topbar .menu-btn { background: transparent; box-shadow: none; }
  .app.home-view .date-chip { background: transparent; border: none; box-shadow: none; padding: 0; }

  /* ---------- generic card / section ---------- */
  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    transition: box-shadow .25s ease; }
  .card:hover { box-shadow: var(--shadow-card-hover); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size: 14px; font-weight: 700; margin: 24px 2px 12px; letter-spacing: .02em; }
  .sec-title::before { content:""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .sec-title .more { margin-left:auto; font-size: 12px; color: var(--text-secondary); font-weight: 500; cursor: pointer; display:inline-flex; align-items:center; gap:2px; }

  /* 筛选标签 */
  .filter-bar { display:flex; gap:8px; margin:14px 2px 4px; }
  .filter-tab { border:1px solid var(--border); background:var(--surface-card); color:var(--text-secondary);
    font-size:12px; font-weight:600; padding:6px 14px; border-radius:999px; cursor:pointer; transition:all .2s; }
  .filter-tab:hover { border-color:var(--accent); color:var(--accent); }
  .filter-tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .filter-tab.on[data-filter="admin"] { background:#4a7ab5; border-color:#4a7ab5; }
  .filter-tab.on[data-filter="family"] { background:#c97878; border-color:#c97878; }
  .sec-title .more svg { color: var(--text-tertiary); }

  /* ---------- timeline ---------- */
  .timeline { margin: 16px 0 0; background: var(--card); border-radius: 14px; padding: 14px 14px 10px; border: 1px solid var(--border); }
  .tl-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .tl-title::before { content:""; width:3px; height:12px; border-radius:2px; background: var(--accent); }
  .tl-date-group { margin-bottom: 16px; }
  .tl-date-label { font-size: 13px; font-weight: 700; color: var(--module-1); margin-bottom: 8px; padding: 4px 10px; background: rgba(45,157,106,.08); border-radius: var(--radius-tile); display:inline-block; }
  /* 记账/灵感：日期时间轴（竖线 + 圆点）—— 主色由 group 上的 --tl-color 注入，今日计划保持原样 */
  .tl-date-group.tl-rail { position:relative; padding-left:13px; margin-bottom:14px; }
  .tl-date-group.tl-rail::before { content:""; position:absolute; left:0; top:17px; bottom:-4px; width:2px;
    border-radius:1px; opacity:.5;
    background:linear-gradient(180deg, var(--tl-color,var(--border)) 0%, var(--border) 55%, transparent 100%); }
  .tl-date-group.tl-rail::after { content:""; position:absolute; left:-3px; top:9px; width:8px; height:8px;
    border-radius:50%; background:var(--tl-color,var(--accent));
    box-shadow:0 0 0 2.5px var(--page-bg); }
  .tl-date-group.tl-rail .tl-date-label { color:var(--tl-color,var(--module-1));
    background:color-mix(in srgb, var(--tl-color,var(--module-1)) 10%, transparent); }
  .tl-date-group.tl-rail:last-child::before { bottom:6px; }
  .tl-group { display:flex; gap:10px; margin-bottom:8px; align-items:flex-start; }
  .tl-time { flex:0 0 48px; text-align:right; padding-top:2px; }
  .tl-time .tl-h { display:block; font-size:13px; font-weight:700; color:var(--text-primary); }
  .tl-time .tl-l { display:block; font-size:10px; color:var(--text-tertiary); }
  .tl-tasks { flex:1; border-left:2px solid var(--border); padding-left:10px; }
  .tl-task { display:flex; align-items:center; gap:6px; padding:4px 0; font-size:12px; }
  .tl-task .tl-dot { width:8px; height:8px; border-radius:50%; background: var(--accent); flex:0 0 8px; }
  .tl-task.prio-P0 .tl-dot { background: #d4574a; }
  .tl-task.prio-P1 .tl-dot { background: #c9a23f; }
  .tl-task.prio-P2 .tl-dot { background: #247a50; }
  .tl-task.done .tl-dot { opacity:.3; }
  .tl-task.done .tl-name { text-decoration:line-through; color:var(--text-tertiary); }
  .tl-task .tl-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-primary); }
  .tl-task .tl-t { font-size:11px; color:var(--text-tertiary); font-weight:600; }

  /* ---------- greeting ---------- */
  .greet { position: relative; overflow: hidden; margin-top: 10px; padding: 22px 20px 24px; border-radius: var(--radius-card);
    border: 1px solid var(--border); box-shadow: var(--shadow-card); min-height: 132px;
    background: var(--surface-nested) var(--greet-image) right center / cover no-repeat;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .greet > div:first-child { flex: 1; min-width: 0; }
  .greet-cat { position: relative; z-index: 1; color: var(--accent); opacity: .65; flex: 0 0 auto; }
  .greet-cat-img { position: absolute; right: -5px; bottom: -10px; width: 130px; height: 100px; object-fit: cover; object-position: top center; pointer-events: none; z-index: 1; }
  .greet::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, var(--surface-nested) 30%, color-mix(in srgb, var(--surface-nested) 70%, transparent) 48%, transparent 70%); }
  .greet > * { position: relative; z-index: 1; }
  .greet h1 { padding-right: 96px; overflow-wrap:anywhere; word-break:break-word; font-size: 22px; font-weight: 700; letter-spacing: 0; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #2c3e50; }
  .greet h1::after { content: " ~"; color: var(--accent); font-weight: 600; }
  .greet p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .greet-together { display:inline-flex; align-items:center; gap:3px; margin-top:8px;
    padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700;
    background:rgba(255,255,255,.55); color:var(--accent); }
  .greet .add { position: absolute; top: 16px; right: 16px; z-index: 2; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; background: var(--accent); color:var(--on-accent);
    font-size: 13px; font-weight: 700; padding: 9px 15px 9px 12px; border-radius: 999px; box-shadow: var(--shadow-overlay);
    transition: transform .12s, filter .15s; }
  .greet .add:active { transform: scale(.95); filter: brightness(1.15); }
  .greet .add svg { margin-top: -1px; }

  /* ---------- quote card ---------- */
  .quote { margin-top: 16px; padding: 16px 18px; border-radius: var(--radius-card);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position: relative; }
  .quote::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size: 11px; font-weight: 700; color: var(--text-secondary);
    letter-spacing: .04em; margin-bottom: 9px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size: 16px; font-weight: 600; line-height: 1.55; color: var(--text); }

  /* ---------- overview rings ---------- */
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 20px 6px; margin-top: 14px; }
  .ring { display:flex; flex-direction:column; align-items:center; gap: 8px; cursor:pointer; transition:transform .2s ease-out; }
  .ring:hover { transform:translateY(-2px) scale(1.03); }
  .ring .dial { position: relative; width: 68px; height: 68px; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width: 68px; height: 68px; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .ring .lbl { font-size: 12px; color: var(--text); font-weight: 600; }
  .ring .sub { font-size: 11px; color: var(--text-secondary); }

  /* ---------- trend + quick record ---------- */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 16px;
    transition: box-shadow .25s ease; }
  .panel:hover { box-shadow: var(--shadow-card-hover); }
  .panel.trend-panel { margin-top: 12px; }
  .panel .ph { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:11px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height: auto; margin-top: 12px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:10px; color:var(--text-secondary); margin-top:4px; padding: 0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height: 120px;
    color: var(--text-tertiary); font-size: 12px; margin-top: 8px; }

  /* ---------- AUTH ---------- */
  .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(160deg,#fef6f0 0%,#f0f7ff 50%,#f5f0fa 100%); position:relative; overflow:hidden; }
  .auth-wrap::before { content:''; position:absolute; inset:0; background-image:radial-gradient(circle at 20% 30%,rgba(255,200,180,.3) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(180,220,200,.25) 0%,transparent 50%); }
  .auth-card { width:100%; max-width:340px; background:rgba(255,255,255,.95); border-radius:20px; padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.3); position:relative; z-index:1; }
  .auth-card h2 { font-size:20px; font-weight:700; text-align:center; margin-bottom:4px; color:var(--text-primary); }
  .auth-card .auth-sub { font-size:12px; text-align:center; color:var(--text-secondary); margin-bottom:20px; }
  .auth-card .auth-cat { width:56px; height:56px; margin:0 auto 12px; border-radius:50%; overflow:hidden; background:var(--surface-nested); display:grid; place-items:center; }
  .auth-card .auth-cat img { width:100%; height:100%; object-fit:cover; }
  .auth-field { margin-bottom:14px; }
  .auth-field input { width:100%; padding:11px 14px; border:1.5px solid var(--border-input); border-radius:12px; font-size:14px; background:var(--surface-nested); color:var(--text-primary); transition:border-color .15s; box-sizing:border-box; }
  .auth-field input:focus { outline:none; border-color:var(--accent); }
  .auth-role-sel { display:flex; gap:8px; margin-bottom:14px; }
  .auth-role-sel .opt { flex:1; text-align:center; padding:10px; border:1.5px solid var(--border-input); border-radius:12px; font-size:13px; cursor:pointer; transition:all .15s; background:var(--surface-nested); }
  .auth-role-sel .opt.on { border-color:var(--accent); background:var(--accent-muted); color:var(--accent); font-weight:600; }
  .auth-role-sel .opt.disabled { opacity:.4; cursor:not-allowed; border-style:dashed; }
  .auth-btn { width:100%; padding:13px; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; transition:all .15s; }
  .auth-btn:disabled { opacity:.45; cursor:not-allowed; }
  .auth-btn.primary { background:var(--accent); color:#fff; }
  .auth-btn.primary:active { transform:scale(.97); }
  .auth-btn.secondary { background:transparent; color:var(--text-secondary); margin-top:8px; font-size:13px; }
  .auth-err { color:#d9534f; font-size:12px; text-align:center; margin-top:8px; min-height:16px; }
  .auth-info { font-size:11px; color:var(--text-tertiary); text-align:center; margin-top:16px; line-height:1.6; }

  /* ---------- GAME DASHBOARD ---------- */
  .game-hero {
    position:relative; padding:20px 18px; border-radius:var(--radius-card); margin-bottom:16px;
    background:var(--candy-muted);
    border:1px solid var(--border-soft); box-shadow:var(--shadow-card); overflow:hidden;
  }
  .game-hero::before {
    content:''; position:absolute; top:-40px; right:-30px; width:140px; height:140px;
    background:radial-gradient(circle, rgba(255,210,180,.35) 0%, transparent 70%);
    border-radius:50%;
  }
  .game-hero::after {
    content:''; position:absolute; bottom:10px; right:20px; font-size:32px; opacity:.12;
    transform:rotate(-12deg);
  }
  .game-hero-row { display:flex; align-items:center; gap:14px; position:relative; z-index:1; }
  .game-hero-cat {
    width:60px; height:60px; border-radius:16px; overflow:hidden; flex:0 0 auto;
    border:3px solid rgba(255,255,255,.85); box-shadow:0 4px 12px rgba(0,0,0,.08);
  }
  .game-hero-cat img { width:100%; height:100%; object-fit:cover; }
  .game-hero-info { flex:1; min-width:0; }
  .game-hero-level {

  }

  /* 小屏幕适配 */
  @media (max-width: 359px) {

    .greet { padding: 18px 14px 20px; }

    .rings { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 16px 4px; }
    .ring .dial { width: 56px; height: 56px; }
    .ring .dial svg.gauge { width: 56px; height: 56px; }
    .panel { padding: 14px; }
    .game-card { padding: 14px; }
    .jn-candy .jn-candy-cat { width: 130px; height: 130px; }
    .mini { padding: 10px; }
    .mini .v { font-size: 15px; }

  }

  }

  /* 卡片容器 */
  .game-grid-main {
    display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:14px; margin-top:2px;
  }
  @media(min-width:560px){
    .game-grid-main { grid-template-columns:1fr; }
  }
  @media(min-width:860px){
    .game-grid-main { grid-template-columns:1fr; max-width:680px; margin-left:auto; margin-right:auto; }
  }
  .game-card {
    background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--shadow-card);
    transition: box-shadow .25s ease, transform .25s cubic-bezier(.2,.8,.25,1);
  }
  .game-card:hover { box-shadow:var(--shadow-card-hover); }
  .game-section-title {
    font-size:13px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:7px;
    color:var(--text); letter-spacing:.02em;
  }
  .game-section-title .count {
    font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px;
    background:var(--accent-muted); color:var(--accent);
  }

  .gc-list { max-height:260px; overflow-y:auto; }
  .gc-item {
    display:flex; align-items:center; justify-content:space-between; padding:9px 0;
    font-size:13px; border-bottom:1px solid var(--border-soft); gap:8px;
    transition:all .15s;
  }
  .gc-item:last-child { border:none; }
  .gc-item:hover { background:var(--bg-secondary); margin:0 -10px; padding:9px 10px; border-radius:10px; border-bottom-color:transparent; }
  .gc-item .chk {
    width:20px; height:20px; border-radius:var(--radius-control); border:1.5px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; flex:0 0 auto; color:#fff;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);
  }
  .gc-item .chk.on { background:var(--accent); border-color:var(--accent); transform:scale(1.05); }
  .gc-item .chk svg { opacity:0; transition:opacity .15s; }
  .gc-item .chk.on svg { opacity:1; }
  .gc-item.done .gc-name { text-decoration:line-through; color:var(--text-tertiary); }
  .gc-item.done { opacity:.6; }
  .gc-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .gc-pts {
    font-size:11px; color:var(--accent); font-weight:700; flex:0 0 auto;
    padding:2px 8px; border-radius:999px; background:var(--accent-muted);
  }
  .gc-item .gc-cat {
    font-size:14px; flex:0 0 auto; width:20px; text-align:center;
  }

  /* 糖币流水 */
  .pts-log-card {
    background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:14px 16px; box-shadow:var(--shadow-card);
  }
  .pts-log-header {
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .pts-log-title { font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .pts-log-summary { font-size:11px; color:var(--text-secondary); }
  .pl-list { max-height:240px; overflow-y:auto; }
  .pl-row {
    display:flex; align-items:center; gap:10px; padding:9px 10px;
    border-radius:10px; font-size:12px; transition:background .12s;
  }
  .pl-row:hover { background:var(--bg-secondary); }
  .pl-type {
    font-size:10px; padding:3px 9px; border-radius:999px; flex:0 0 auto; font-weight:600;
  }
  .pl-type.task { background:var(--accent-muted); color:var(--accent); }
  .pl-type.finance { background:#d8eef0; color:var(--module-4); }
  .pl-type.redeem { background:var(--candy-muted); color:var(--candy); }
  .pl-type.streak { background:#fff0e0; color:#d4802a; }
  .pl-type.daily { background:#e8e8f8; color:#6a5ab5; }
  .pl-type.level { background:#f0e8f8; color:var(--berry); }
  .pl-desc { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pl-time { font-size:10px; color:var(--text-tertiary); flex:0 0 auto; }
  .pl-amt { font-weight:800; flex:0 0 auto; font-size:13px; min-width:45px; text-align:right; }
  .pl-amt.plus { color:var(--accent); }
  .pl-amt.minus { color:var(--candy); }
  .pl-empty {
    text-align:center; padding:32px 20px; color:var(--text-tertiary); font-size:12px;
  }
  .pl-empty .empty-icon { font-size:32px; margin-bottom:8px; display:block; }

  /* 首页糖果小铺入口卡片 */
  .home-points-card {
    position:relative; padding:16px 18px; border-radius:var(--radius-card); cursor:pointer;
    background:var(--candy-muted);
    border:1px solid var(--border-soft); box-shadow:var(--shadow-card);
    transition:all .2s; overflow:hidden;
  }
  .home-points-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-card-hover); }
  .home-points-card:active { transform:translateY(0); }
  .home-points-card::before {
    content:''; position:absolute; top:10px; right:16px; font-size:26px; opacity:.12;
  }
  .home-points-card::after {
    content:''; position:absolute; bottom:8px; left:45%; font-size:20px; opacity:.08;
    transform:rotate(10deg);
  }
  .hpc-row { display:flex; align-items:center; gap:12px; position:relative; z-index:1; }
  .hpc-cat {
    width:46px; height:46px; border-radius:14px; overflow:hidden; flex:0 0 auto;
    border:2px solid rgba(255,255,255,.75); background:#fff;
  }
  .hpc-cat img { width:100%; height:100%; object-fit:cover; }
  .hpc-info { flex:1; min-width:0; }
  .hpc-pts {
    font-size:28px; font-weight:800; color:var(--accent); line-height:1;
    display:flex; align-items:baseline; gap:4px;
  }
  .hpc-pts .unit { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .hpc-level {
    display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px;
    background:var(--accent-muted); color:var(--accent); font-size:10px; font-weight:700;
    margin-top:5px;
  }
  .hpc-stats {
    display:flex; gap:10px; margin-top:12px; padding-top:12px;
    border-top:1px dashed var(--border-soft); position:relative; z-index:1;
  }
  .hpc-stat { flex:1; text-align:center; cursor:pointer; border-radius:10px; padding:4px 2px; transition:background .15s ease-out; }
  .hpc-stat:hover { background:rgba(255,255,255,.45); }
  .hpc-stat:active { background:rgba(255,255,255,.65); }
  .hpc-stat .num { font-size:15px; font-weight:800; color:var(--text); }
  .hpc-stat .lbl { font-size:10px; color:var(--text-secondary); margin-top:2px; }
  .hpc-chevron { flex:0 0 auto; color:var(--text-tertiary); }

  /* 积分数字弹跳动画 — emilkowalski 原则：使用 transform/opacity */
  @keyframes ptsBounce {
    0% { transform:scale(1); opacity:1; }
    20% { transform:scale(1.2); opacity:.9; }
    50% { transform:scale(.93); opacity:1; }
    80% { transform:scale(1.04); opacity:1; }
    100% { transform:scale(1); opacity:1; }
  }
  .pts-bounce { animation:ptsBounce .6s cubic-bezier(.34,1.56,.64,1); }
  /* 糖币卡片发光脉冲 — 200ms 内完成主要变化 */
  @keyframes candyGlow {
    0% { box-shadow:var(--shadow-card); }
    30% { box-shadow:0 0 0 3px var(--candy-muted), 0 0 20px rgba(212,160,92,.25); }
    100% { box-shadow:var(--shadow-card); }
  }
  .candy-glow { animation:candyGlow 1.2s ease-out; }

  /* 小猫浮动装饰 */
  @keyframes catFloat {
    0%, 100% { transform:translateY(0) rotate(-2deg); }
    50% { transform:translateY(-4px) rotate(2deg); }
  }
  .cat-float { animation:catFloat 3s ease-in-out infinite; display:inline-block; }

  /* emilkowalski: 尊重 reduced-motion 偏好 */
  @media (prefers-reduced-motion: reduce) {
    .pts-bounce, .candy-glow, .cat-float { animation:none !important; }
    * { transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }

  /* 进度条光泽效果 */
  @keyframes shimmer {
    0% { transform:translateX(-100%); }
    100% { transform:translateX(200%); }
  }
  .game-hero-bar-fill::after {
    content:''; position:absolute; top:0; bottom:0; width:40%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    animation:shimmer 2.5s ease-in-out infinite;
  }

  /* ---------- CAT POPUP ---------- */
  .cat-popup { position:fixed; top:35%; left:50%; transform:translate(-50%,-50%) scale(.5); z-index:10000;
    background:rgba(255,255,255,.98); border-radius:24px; padding:24px 32px 20px;
    box-shadow:0 16px 48px rgba(0,0,0,.15);
    display:flex; flex-direction:column; align-items:center; gap:8px; opacity:0; pointer-events:none;
    transition:all .35s cubic-bezier(.34,1.56,.64,1); min-width:180px; }
  .cat-popup.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .cat-popup .cp-ic { width:56px; height:56px; border-radius:50%; overflow:hidden;
    border:3px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.1); }
  .cat-popup .cp-ic img { width:100%; height:100%; object-fit:cover; }
  .cat-popup .cp-msg { font-size:15px; font-weight:700; color:var(--text-primary); }
  .cat-popup .cp-pts { font-size:28px; font-weight:800; color:var(--accent);
    animation:ptsBounce .5s cubic-bezier(.34,1.56,.64,1) .1s both; }
  .cat-popup .cp-pts.minus { color:#c95a5a; }
  .cat-popup .cp-tail {
    position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    width:16px; height:16px; background:rgba(255,255,255,.98);
    transform:translateX(-50%) rotate(45deg);
  }
  .cat-popup .cp-deco {
    position:absolute; font-size:18px; opacity:0;
    transition:all .5s cubic-bezier(.34,1.56,.64,1);
  }
  .cat-popup.show .cp-deco { opacity:1; }
  .cat-popup.show .cp-deco-1 { top:-6px; left:-4px; transform:rotate(-20deg) scale(1); animation:decoPop .6s cubic-bezier(.34,1.56,.64,1) .05s both; }
  .cat-popup.show .cp-deco-2 { top:-12px; right:10px; animation:decoPop .6s cubic-bezier(.34,1.56,.64,1) .15s both; }
  .cat-popup.show .cp-deco-3 { top:0; right:-10px; animation:decoPop .6s cubic-bezier(.34,1.56,.64,1) .1s both; }
  @keyframes decoPop {
    0% { opacity:0; transform:scale(0) rotate(0deg); }
    60% { transform:scale(1.2) rotate(15deg); }
    100% { opacity:1; transform:scale(1) rotate(10deg); }
  }

  /* ---------- GAME TABS ---------- */
  .game-tabs { display:flex; gap:4px; margin-bottom:14px; background:var(--bg-secondary);
    padding:4px; border-radius:var(--radius-tile); border:1px solid var(--border); }
  .game-tab { flex:1; padding:9px 10px; border:none; background:transparent;
    border-radius:10px; font-size:12.5px; font-weight:600; color:var(--text-secondary);
    cursor:pointer; transition:all .25s cubic-bezier(.2,.8,.25,1); display:flex; align-items:center; justify-content:center; gap:5px;
    white-space:nowrap; }
  .game-tab:hover { color:var(--text); background:rgba(255,255,255,.4); }
  .game-tab.active { background:var(--surface-card); color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03); font-weight:700; }
  .game-tab-content { animation:fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

  /* ---------- BUFF BANNER ---------- */
  .buff-banner { display:flex; align-items:center; gap:10px; padding:11px 14px;
    background:linear-gradient(135deg,var(--candy-muted),#fff5e6); border-radius:var(--radius-tile);
    border:1px solid #ffe0b8; margin-bottom:14px; font-size:12.5px;
    box-shadow:0 2px 8px rgba(255,180,80,.08); }
  .buff-banner .buff-icon { font-size:20px; animation:buffPulse 1.8s ease-in-out infinite; }
  .buff-banner .buff-name { font-weight:700; color:var(--candy); }
  .buff-banner .buff-mult { margin-left:auto; background:#fff; padding:3px 10px; border-radius:999px;
    font-weight:700; color:var(--candy); font-size:11.5px; }
  .buff-banner .buff-time { background:#fff; padding:3px 10px; border-radius:999px;
    font-weight:600; color:var(--candy); font-size:11.5px; font-variant-numeric:tabular-nums; }
  @keyframes buffPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.12) rotate(-5deg); } }

  /* ---------- QUICK SHOP ---------- */
  .quick-shop { display:flex; flex-direction:column; gap:8px; }
  .quick-item { display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--bg-secondary); border-radius:var(--radius-tile); transition:all .2s ease; }
  .quick-item:hover { background:var(--bg-tertiary); }
  .quick-icon-wrap { width:42px; height:42px; border-radius:12px;
    background:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.04); flex-shrink:0; }
  .quick-icon { font-size:22px; }
  .quick-body { flex:1; min-width:0; }
  .quick-name { font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:2px; }
  .quick-desc { font-size:11px; color:var(--text-tertiary); }
  .quick-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .quick-price { font-size:14px; font-weight:800; color:var(--accent); }
  .quick-btn { padding:6px 16px; font-size:12px; border-radius:999px; border:none;
    background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition:all .2s ease; }
  .quick-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 4px 10px rgba(60,150,90,.25); }
  .quick-btn:disabled { background:#c8d0d8; color:#8a95a0; cursor:not-allowed; }
  .shop-more-btn { margin-top:2px; padding:10px; font-size:12px; border:1px dashed var(--border);
    background:transparent; border-radius:var(--radius-tile); color:var(--text-secondary); cursor:pointer;
    transition:all .2s ease; font-weight:500; }
  .shop-more-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-muted); }

  /* ---------- SHOP ---------- */
  .shop-hint { display:flex; align-items:center; gap:8px; padding:10px 14px;
    background:linear-gradient(135deg,var(--candy-muted),#fff9ed); border-radius:var(--radius-tile);
    border:1px solid #fde6c0; margin-bottom:16px; font-size:12.5px; color:#8a6020; }
  .shop-hint .hint-ic { font-size:18px; }
  .shop-hint strong { color:var(--candy); }
  .shop-category { margin-bottom:20px; }
  .shop-cat-title { font-size:13px; font-weight:700; color:var(--text);
    margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .shop-cat-title::before { content:""; width:3px; height:12px; border-radius:2px; background:var(--candy); }
  .shop-grid { display:grid; grid-template-columns:1fr; gap:10px; }
  @media(min-width:560px) { .shop-grid { grid-template-columns:1fr 1fr; } }
  @media(min-width:860px) { .shop-grid { grid-template-columns:1fr 1fr 1fr; } }
  .shop-item { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:14px; transition:all .25s ease; display:flex; flex-direction:column; gap:10px;
    box-shadow:var(--shadow-card); }
  .shop-item:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.07); }
  .shop-icon { text-align:center; padding:6px 0; }
  .shop-icon img { width:48px; height:48px; object-fit:contain; }
  .shop-body { text-align:center; }
  .shop-name { font-size:13.5px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .shop-desc { font-size:11px; color:var(--text-tertiary); line-height:1.4; }
  .shop-extra { font-size:10px; color:var(--candy, #e89a4a); font-weight:600; margin-top:3px; }
  .shop-footer { display:flex; align-items:center; justify-content:space-between;
    padding-top:10px; border-top:1px solid var(--border-soft); }
  .shop-price { font-size:14px; font-weight:800; color:var(--accent); }
  .shop-btn { padding:6px 14px; font-size:12px; border-radius:999px; border:none;
    background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition:all .2s ease; }
  .shop-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 4px 10px rgba(60,150,90,.25); }
  .shop-btn:disabled { background:#c8d0d8; color:#8a95a0; cursor:not-allowed; }

  /* ---------- COLLECTION ---------- */
  .collect-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .cs-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    padding:14px 10px; text-align:center; box-shadow:var(--shadow-card); }
  .cs-num { font-size:26px; font-weight:800; color:var(--accent); line-height:1; }
  .cs-label { font-size:12px; color:var(--text-secondary); margin-top:6px; font-weight:600; }
  .cs-sub { font-size:10px; color:var(--text-tertiary); margin-top:3px; }
  .collect-section { margin-bottom:20px; }
  .collect-section-title { font-size:13px; font-weight:700; color:var(--text);
    margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .collect-section-title::before { content:""; width:3px; height:12px; border-radius:2px; background:var(--berry); }
  .collect-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  @media(min-width:560px) { .collect-grid { grid-template-columns:repeat(4,1fr); } }
  @media(min-width:860px) { .collect-grid { grid-template-columns:repeat(6,1fr); } }
  .collect-item { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile);
    padding:12px 8px; text-align:center; transition:all .2s ease; box-shadow:var(--shadow-card); }
  .collect-item.owned { background:linear-gradient(135deg,#f0faf3,#e8f5f0);
    border-color:#b8e0c8; }
  .collect-item.locked { opacity:.45; filter:grayscale(.6); background:var(--bg-secondary); }
  .collect-icon { margin-bottom:4px; }
  .collect-icon img { width:36px; height:36px; object-fit:contain; }
  .collect-name { font-size:11px; font-weight:600; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .collect-count { font-size:11px; color:var(--accent); font-weight:700; margin-top:2px; }
  .collect-price { font-size:10px; color:var(--text-tertiary); margin-top:2px; }
  .collect-locked-title { font-size:12px; color:var(--text-tertiary); margin-bottom:8px;
    padding-left:4px; font-weight:500; }
  .locked-grid .collect-icon { filter:grayscale(1); }
  /* 已放置贴纸 — 点击选中，拖动移位，删除需二次确认 */
  .placed-sticker { position:absolute; width:32px; height:32px; object-fit:contain; opacity:.7;
    cursor:grab; touch-action:none; user-select:none; z-index:5;
    transition: opacity .2s, transform .2s, box-shadow .2s; }
  .placed-sticker:hover { opacity:1; transform: scale(1.15) rotate(0deg) !important; }
  .placed-sticker.selected { opacity:1; z-index:10; box-shadow:0 0 0 2px var(--accent), 0 4px 12px rgba(0,0,0,.15); border-radius:8px; }
  .sticker-del-btn { position:absolute; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff;
    font-size:11px; font-weight:700; display:grid; place-items:center; cursor:pointer; z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,.2); border:none; padding:0; line-height:1; }

  /* ---------- RARITY SYSTEM ---------- */
  .rarity-tag { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px;
    border-radius:999px; letter-spacing:.02em; }
  .rarity-common { background:#eef1f5; color:#7a8490; }
  .rarity-rare { background:#e0ecf8; color:#3a7ab5; }
  .rarity-epic { background:#efe8f8; color:#7b5ab5; }
  .rarity-legendary { background:linear-gradient(135deg,#fff3d6,#ffe0a3); color:#b8860b;
    box-shadow:0 0 8px rgba(255,200,80,.3); }

  .collect-item.rarity-common.owned { background:linear-gradient(135deg,#f7f9fc,#eef1f5);
    border-color:#d0d8e0; }
  .collect-item.rarity-rare.owned { background:linear-gradient(135deg,#eef5fc,#e0ecf8);
    border-color:#a8c8e8; }
  .collect-item.rarity-epic.owned { background:linear-gradient(135deg,#f5f0fc,#ebe0f8);
    border-color:#c8a8e8; }
  .collect-item.rarity-legendary.owned {
    background:linear-gradient(135deg,#fff8e8,#fff0d0,#fff8e8);
    border:2px solid #f0c850;
    position:relative;
    box-shadow:0 0 12px rgba(255,200,80,.25);
  }
  .collect-item.rarity-legendary.owned::before {
    content:''; position:absolute; inset:-2px; border-radius:var(--radius-tile);
    background:linear-gradient(45deg,transparent,rgba(255,215,100,.4),transparent);
    animation:legendaryShine 2.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes legendaryShine {
    0%,100% { opacity:.3; transform:translateX(-100%); }
    50% { opacity:.8; transform:translateX(100%); }
  }
  .shop-item.rarity-legendary {
    border:2px solid #f0c850;
    position:relative;
    box-shadow:0 0 16px rgba(255,200,80,.2);
  }
  .shop-item.rarity-epic { border-color:#c8a8e8; }
  .shop-item.rarity-rare { border-color:#a8c8e8; }

  /* ---------- DAILY TASKS ---------- */
  .daily-task-card { background:var(--surface-card); border:1px solid var(--border);
    border-radius:var(--radius-card); padding:16px; margin-bottom:12px; box-shadow:var(--shadow-card);
    display:flex; align-items:center; gap:14px; transition:all .2s ease; }
  .daily-task-card.done { background:linear-gradient(135deg,#f0faf3,#e8f5f0); border-color:#b8e0c8; }
  .daily-task-icon { width:48px; height:48px; border-radius:14px;
    background:var(--surface-nested); display:grid; place-items:center; font-size:26px;
    flex-shrink:0; }
  .daily-task-card.done .daily-task-icon { background:var(--accent-muted); }
  .daily-task-body { flex:1; min-width:0; }
  .daily-task-name { font-size:14px; font-weight:700; color:var(--text); margin-bottom:3px; }
  .daily-task-desc { font-size:11.5px; color:var(--text-secondary); }
  .daily-task-reward { font-size:12px; font-weight:700; color:var(--accent);
    background:var(--accent-muted); padding:3px 10px; border-radius:999px; flex-shrink:0; }
  .daily-task-btn { padding:7px 16px; font-size:12px; border-radius:999px; border:none;
    background:var(--accent); color:#fff; font-weight:600; cursor:pointer; flex-shrink:0;
    transition:all .2s ease; }
  .daily-task-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 4px 10px rgba(60,150,90,.25); }
  .daily-task-btn:disabled { background:#c8d0d8; color:#8a95a0; cursor:not-allowed; }
  .daily-task-btn.done-btn { background:#d5eede; color:#247a50; cursor:default; }
  .daily-header { display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; }
  .daily-header .dh-title { font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .daily-header .dh-refresh { font-size:11px; color:var(--text-tertiary); }

  /* ---------- STREAK DISPLAY ---------- */
  .streak-row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .streak-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 10px;
    border-radius:999px; font-size:11px; font-weight:600; background:#fff;
    border:1px solid var(--border-soft); }
  .streak-chip.task-streak { color:var(--accent); background:var(--accent-muted); border-color:transparent; }
  .streak-chip.money-streak { color:var(--module-4); background:#d8eef0; border-color:transparent; }
  .streak-chip .fire { font-size:13px; }

  /* ---------- HERO UPGRADE ---------- */
  .game-hero-title {
    display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px;
    background:linear-gradient(135deg,var(--candy-muted),#fff5e6); color:var(--candy);
    font-size:11px; font-weight:700; margin-bottom:6px; border:1px solid #ffe0b8;
  }
  .game-hero-buffs { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .hero-buff-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px;
    border-radius:999px; font-size:10px; font-weight:600; background:#fff;
    border:1px solid #ffe0b8; color:var(--candy); }
  .hero-buff-tag.permanent { background:linear-gradient(135deg,#fff3d6,#ffe8b8);
    border-color:#f0c850; color:#b8860b; }

  /* ---------- COLLECTION DETAIL MODAL ---------- */
  .collect-detail-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45);
    z-index:9999; display:grid; place-items:center; padding:20px;
    animation:fadeIn .2s ease; }
  .collect-detail-modal { background:var(--surface-card); border-radius:var(--radius-sheet);
    width:100%; max-width:340px; padding:24px 20px; box-shadow:var(--shadow-overlay);
    text-align:center; position:relative; }
  .collect-detail-icon { margin-bottom:12px; }
  .collect-detail-icon img { width:64px; height:64px; object-fit:contain; }
  .collect-detail-name { font-size:18px; font-weight:800; color:var(--text); margin-bottom:6px; padding-right:40px; overflow-wrap:anywhere; word-break:break-word; }
  .collect-detail-desc { font-size:12.5px; color:var(--text-secondary); line-height:1.6; margin-bottom:14px; }
  .collect-detail-meta { display:flex; justify-content:center; gap:12px; margin-bottom:16px; }
  .collect-detail-meta .meta-item { font-size:11px; color:var(--text-tertiary); }
  .collect-detail-close { position:absolute; top:14px; right:14px; width:28px; height:28px;
    border-radius:50%; border:none; background:var(--bg-secondary); cursor:pointer;
    display:grid; place-items:center; color:var(--text-tertiary); font-size:16px; }
  /* 不可购买的藏品（如称号）提示 */
  .collect-detail-tip { font-size:12px; color:var(--text-tertiary); line-height:1.6;
    padding:8px 12px; border-radius:var(--radius-tile);
    background:var(--bg-secondary); border:1px dashed var(--border-input); }

  /* ---------- COLLECTION TABS ---------- */
  .collect-sub-tabs { display:flex; gap:4px; margin-bottom:14px; background:var(--bg-secondary);
    padding:4px; border-radius:var(--radius-tile); border:1px solid var(--border);
    overflow-x:auto; }
  .collect-sub-tab { flex:1; padding:7px 8px; border:none; background:transparent;
    border-radius:10px; font-size:11.5px; font-weight:600; color:var(--text-secondary);
    cursor:pointer; transition:all .2s ease; white-space:nowrap; min-width:fit-content; }
  .collect-sub-tab.active { background:var(--surface-card); color:var(--accent);
    box-shadow:0 2px 6px rgba(0,0,0,.05); font-weight:700; }

  /* ---------- SHOP CATEGORY NAV ---------- */
  .shop-cat-nav { display:flex; gap:6px; margin-bottom:16px; overflow-x:auto;
    padding-bottom:4px; }
  .shop-cat-nav-btn { padding:7px 14px; border:1px solid var(--border); border-radius:999px;
    background:var(--surface-card); font-size:12px; font-weight:600; color:var(--text-secondary);
    cursor:pointer; transition:all .2s ease; white-space:nowrap; flex-shrink:0; }
  .shop-cat-nav-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* ---------- TITLE POPUP ---------- */
  .title-popup { position:fixed; top:30%; left:50%; transform:translate(-50%,-50%) scale(.5);
    z-index:10001; background:linear-gradient(135deg,#fff8e8,#fff0d0,#fff8e8);
    border-radius:24px; padding:28px 36px; box-shadow:0 16px 48px rgba(255,180,50,.25);
    display:flex; flex-direction:column; align-items:center; gap:10px; opacity:0;
    pointer-events:none; transition:all .4s cubic-bezier(.34,1.56,.64,1);
    border:2px solid #f0c850; min-width:220px; }
  .title-popup.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .title-popup .tp-label { font-size:11px; font-weight:700; color:#b8860b; letter-spacing:.1em; }
  .title-popup .tp-icon { font-size:48px; animation:titleSpin 1.2s ease-out; }
  .title-popup .tp-name { font-size:20px; font-weight:800; color:#8a6020; }
  .title-popup .tp-desc { font-size:12px; color:#a08050; }
  @keyframes titleSpin {
    0% { transform:scale(0) rotate(-180deg); opacity:0; }
    60% { transform:scale(1.2) rotate(10deg); }
    100% { transform:scale(1) rotate(0); opacity:1; }
  }

  /* ---------- MILESTONE CELEBRATION ---------- */
  .milestone-badge { display:inline-flex; align-items:center; gap:4px;
    background:linear-gradient(135deg,var(--candy-muted),#fff5e6); color:var(--candy);
    padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700;
    border:1px solid #ffe0b8; }

  /* Home card buff tag */
  .hpc-buff { font-size:11px; color:#e08020; background:#fff5e6; padding:2px 8px;
    border-radius:10px; display:inline-block; margin-top:4px; font-weight:600; }

  /* ---------- USER MGMT ---------- */
  .user-row { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); gap:8px; }
  .user-row:last-child { border:none; }
  .user-row .ur-name { font-size:14px; font-weight:600; }
  .user-row .ur-role { font-size:11px; padding:2px 8px; border-radius:20px; }
  .user-row .ur-role.admin { background:#d5eede; color:var(--accent); }
  .user-row .ur-role.family { background:#eae6f2; color:#7b6ba8; }
  .user-row .ur-time { font-size:11px; color:var(--text-tertiary); }
  .user-row .ur-del { font-size:12px; color:#d9534f; cursor:pointer; padding:4px 10px; border:1px solid #f5d0ce; border-radius:8px; flex:0 0 auto; }
  .user-row .ur-del:active { transform:scale(.95); }
  .user-bar { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--surface-card); border-radius:14px; margin-bottom:12px; }
  .user-bar .ub-name { font-size:14px; font-weight:600; }
  .user-bar .ub-logout { font-size:12px; color:#d9534f; cursor:pointer; padding:6px 14px; border:1px solid #f5d0ce; border-radius:10px; }
  .user-bar .ub-role { font-size:11px; color:var(--text-secondary); margin-top:2px; }

  /* ---------- GROUP SYSTEM ---------- */
  .group-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); margin-bottom:12px; overflow:hidden; }
  .group-card .gc-head { display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:linear-gradient(135deg, var(--accent-muted) 0%, var(--candy-muted) 100%);
    border-bottom:1px solid var(--border); }
  .group-card .gc-name { font-size:14px; font-weight:700; color:var(--text-primary); display:flex; align-items:center; gap:6px; }
  .group-card .gc-badge { font-size:10px; padding:2px 8px; border-radius:20px; background:var(--accent); color:#fff; font-weight:600; }
  .group-card .gc-count { font-size:11px; color:var(--text-secondary); }
  .group-card .gc-edit-name { display:inline-flex; align-items:center; cursor:pointer; color:var(--text-tertiary); padding:2px; border-radius:6px; transition:.2s; }
  .group-card .gc-edit-name:hover { color:var(--accent); background:var(--accent-bg); }
  .group-card .gc-body { padding:4px 0; }
  .group-card .gc-empty { padding:14px; text-align:center; color:var(--text-tertiary); font-size:12px; }
  .group-member { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; gap:8px; }
  .group-member + .group-member { border-top:1px solid var(--border-soft); }
  .group-member .gm-info { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .group-member .gm-avatar { width:36px; height:36px; border-radius:50%; background:var(--surface-nested);
    display:grid; place-items:center; font-size:16px; flex:0 0 auto; overflow:hidden; position:relative; cursor:pointer; }
  .group-member .gm-avatar img { width:100%; height:100%; object-fit:cover; }
  .group-member .gm-avatar .avatar-cam { position:absolute; inset:0; display:grid; place-items:center;
    background:rgba(0,0,0,.35); color:#fff; font-size:11px; opacity:0; transition:opacity .15s; border-radius:50%; }
  .group-member .gm-avatar:hover .avatar-cam { opacity:1; }
  .group-member .gm-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .group-member .gm-meta { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
  .group-member .gm-role { font-size:10px; padding:2px 7px; border-radius:20px; flex:0 0 auto; }
  .group-member .gm-role.admin { background:#d5eede; color:var(--accent); }
  .group-member .gm-role.family { background:#eae6f2; color:#7b6ba8; }
  .group-member .gm-del { font-size:11px; color:#d9534f; cursor:pointer; padding:3px 8px;
    border:1px solid #f5d0ce; border-radius:7px; flex:0 0 auto; }
  .group-member .gm-self { font-size:10px; color:var(--accent); font-weight:600; padding:2px 6px;
    background:var(--accent-muted); border-radius:6px; flex:0 0 auto; }

  /* pending applications */
  .pending-list { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); margin-bottom:12px; overflow:hidden; }
  .pending-list .pl-head { padding:10px 14px; background:var(--candy-muted); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; }
  .pending-list .pl-title { font-size:13px; font-weight:700; color:var(--candy); display:flex; align-items:center; gap:6px; }
  .pending-list .pl-count { font-size:11px; color:var(--text-secondary); background:#fff; padding:1px 8px; border-radius:10px; }
  .app-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; gap:8px; }
  .app-item + .app-item { border-top:1px solid var(--border-soft); }
  .app-item .ai-info { flex:1; min-width:0; }
  .app-item .ai-name { font-size:13px; font-weight:600; }
  .app-item .ai-meta { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
  .app-item .ai-actions { display:flex; gap:6px; flex:0 0 auto; }
  .app-item .ai-btn { font-size:11px; padding:4px 10px; border-radius:8px; cursor:pointer; border:1px solid; font-weight:600; }
  .app-item .ai-btn.approve { background:#d5eede; color:var(--accent); border-color:#b8dcc2; }
  .app-item .ai-btn.reject { background:#fde8e8; color:#d9534f; border-color:#f5d0ce; }
  .app-item .ai-btn:active { transform:scale(.95); }

  /* group select in auth */
  .auth-group-sel { margin-bottom:14px; }
  .auth-group-sel label { font-size:12px; color:var(--text-secondary); display:block; margin-bottom:6px; }
  .auth-group-sel select { width:100%; padding:10px 12px; border:1.5px solid var(--border-input); border-radius:12px;
    font-size:13px; background:var(--surface-nested); color:var(--text-primary); cursor:pointer; }
  .auth-group-sel select:focus { outline:none; border-color:var(--accent); }
  .auth-group-sel select:disabled { opacity:.5; cursor:not-allowed; }

  .auth-apply-tip { background:var(--candy-muted); border:1px solid #f5d8b0; border-radius:10px;
    padding:10px 12px; font-size:12px; color:#a06a20; margin-bottom:14px; line-height:1.5; }
  .auth-apply-tip b { color:var(--candy); }

  .quota-bar { display:flex; align-items:center; justify-content:space-between; font-size:11px;
    color:var(--text-secondary); margin-bottom:14px; }
  .quota-bar .qb-num { font-weight:700; color:var(--accent); }
  .quota-bar .qb-num.warn { color:var(--candy); }
  .quota-bar .qb-num.full { color:#d9534f; }

  .modal-cat { width:44px; height:44px; margin:0 auto 8px; border-radius:50%; overflow:hidden; }
  .modal-cat img { width:100%; height:100%; object-fit:cover; }
  .quick-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .qbtn { display:flex; flex-direction:column; align-items:center; gap:9px; padding: 15px 6px 12px; border:none; cursor:pointer;
    border-radius: var(--radius-tile); background: var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card);
    text-align:center; transition: transform .15s cubic-bezier(.2,.8,.25,1), box-shadow .25s ease, border-color .15s; }
  .qbtn:hover { box-shadow: var(--shadow-card-hover); }
  .qbtn:active { transform: scale(.96); border-color: var(--border-input); }
  .qbtn .e { position: relative; width: 44px; height: 44px; border-radius: var(--radius-tile); display:grid; place-items:center; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size: 12px; font-weight: 600; color: var(--text); }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:flex; flex-direction:column; gap: 8px; }
  .pin { display:flex; align-items:center; gap: 11px; padding: 12px 14px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .pin-ic { width: 32px; height: 32px; border-radius: var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .pin .arw { color: var(--text-tertiary); flex:0 0 auto; }
  .pin-chk { flex:0 0 auto; width: 24px; height: 24px; border-radius: var(--radius-control); border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:#fff; transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 6px; }
  .pin-step button { width: 28px; height: 28px; border-radius: var(--radius-control); border: 1px solid var(--border-input);
    background: var(--surface-nested); color: var(--text); font-size: 17px; line-height: 1; cursor:pointer;
    display:grid; place-items:center; transition: all .15s; }
  .pin-step button:active { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { padding: 20px 16px; text-align:center; color: var(--text-secondary); font-size: 12px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- today plan cards ---------- */
  .tcard-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile);
    padding: 10px 12px; cursor:pointer; transition: all .15s; position:relative; overflow:hidden; box-shadow: var(--shadow-card); }
  .tcard:active { transform: scale(.97); }
  .tcard.done { opacity: .55; }
  .tcard.done .tc-title { text-decoration: line-through; color: var(--text-secondary); }
  .tcard .tc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; }
  .tcard .tc-prio { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
  .tcard .tc-chk { width: 20px; height: 20px; border-radius: var(--radius-control); border: 1.6px solid var(--border-input);
    background: var(--surface-nested); display:grid; place-items:center; color: #fff; cursor:pointer; transition: all .15s; flex:0 0 auto; }
  .tcard .tc-chk:active { transform: scale(.9); }
  .tcard .tc-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .tcard .tc-chk svg { opacity: 0; }
  .tcard .tc-chk.on svg { opacity: 1; }
  .tcard .tc-title { font-size: 13px; font-weight: 600; line-height: 1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tcard .tc-time { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; display:flex; align-items:center; gap: 3px; }

  /* ---------- record list (inside a module) ---------- */

  /* 记账小票入口 chips（位于模块标题下方） */

  /* ---------- 记账小票（借鉴 IMG_9478 版式语言，纯 CSS） ---------- */

    display:flex; align-items:flex-start; justify-content:center; padding:max(18px,env(safe-area-inset-top)) 14px 24px; overflow:auto; z-index:9999; }
  .receipt-sheet { position:relative; width:100%; max-width:420px; margin:auto; background:var(--surface-card);
    border-radius:6px; padding:18px 18px 14px; box-shadow:0 12px 40px color-mix(in srgb,var(--text) 32%,transparent);
    color:var(--text); font-family:var(--font-journal); }
  /* 撕纸边：上沿锯齿（纯 CSS，不新增图片） */
  .receipt-sheet::before { content:""; position:absolute; left:0; right:0; top:-9px; height:9px;

  .r-head { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:700; letter-spacing:.5px; }

  /* 红色印章（CSS 圆章，纯装饰） */
  .r-stamp { position:absolute; right:16px; top:54px; width:64px; height:64px; border-radius:50%;

  .r-voucher { font-family:var(--font-mono); font-size:10.5px; color:var(--text-tertiary); letter-spacing:1px; }
  .r-slogan { font-size:11px; color:var(--text-tertiary); margin-top:6px; letter-spacing:.5px; }

  .mini .l { font-size: 11px; color: var(--text-secondary); }

  /* module hero header (per-type summary) — compact strip */

  /* record thumbnail */

  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */

  .rec.rec-layout-feature { flex-direction:column; padding:0; overflow:hidden; }
  .rec.rec-layout-feature .thumb { width:100%; height:140px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:10px 74px 10px 12px; font-size:15px; font-weight:700; color:var(--text);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    overflow-wrap:anywhere; word-break:break-word; }
  .rec.rec-layout-feature .feat-body { padding:0 12px 12px; font-size:13px; color:var(--text-secondary); }
  /* quote: 大字居中 + 留白 */

  .rec.rec-layout-quote .quote-text { font-size:16px; font-weight:600; line-height:1.6; color:var(--text); white-space:pre-wrap;
    overflow-wrap:anywhere; word-break:break-word; }
  .rec.rec-layout-quote .quote-meta { margin-top:8px; font-size:12px; color:var(--text-tertiary); }
  /* 线本手账卡片：横线本 + 左侧红线装订边 + 贴纸式图片 */
  .rec.rec-layout-notebook { position:relative; padding:14px 14px 14px 30px; background:var(--surface-card);
    background-image:repeating-linear-gradient(to bottom, var(--surface-card) 0, var(--surface-card) 23px, color-mix(in srgb, var(--border-soft) 75%, transparent) 23px, color-mix(in srgb, var(--border-soft) 75%, transparent) 24px);
    background-position:0 40px; border:1px solid var(--border-soft); border-radius:var(--radius-card); }
  .rec.rec-layout-notebook::before { content:""; position:absolute; left:22px; top:0; bottom:0; width:1.5px; background:color-mix(in srgb, var(--danger) 28%, transparent); }
  .rec.rec-layout-notebook .nb-title { font-family:var(--font-journal); font-size:15px; font-weight:700; color:var(--text); line-height:24px;
    padding-right:74px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    overflow-wrap:anywhere; word-break:break-word; }

  .rec.rec-layout-notebook .nb-pic { display:block; width:max-content; max-width:100%; margin:8px 0 2px; padding:6px; background:var(--surface-card); border:1px solid var(--border-soft);

  .rec.rec-layout-notebook .nb-pic img { display:block; max-width:100%; border-radius:2px; decoding:async; }

  /* ============================================================
     灵感备忘 · 手账卡片（和纸胶带 + 回形针 PNG + 猫咪 PNG；无线圈 / 无 SVG 图案）
     ============================================================ */
  .rec.rec-layout-jn { position: relative; overflow: visible; padding: 26px 14px 16px;
    background-color: #FAF6EF;
    background-image:
      linear-gradient(rgba(140,120,95,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,120,95,.055) 1px, transparent 1px);
    background-size: 18px 18px;
    border: 1px solid #E8DFD0; border-radius: 12px;
    box-shadow: 0 2px 6px rgba(92,74,58,.05); }

  /* 左上：CSS 和纸胶带（80x20，-3deg，70% 透明） */
  .rec.rec-layout-jn .jn-tape { position:absolute; top:-9px; left:12px; width:80px; height:20px;

  /* 右上：真实回形针 PNG（原图 100x240，容器法 32x42 + contain 控制高度，-15deg） */
  .rec.rec-layout-jn .jn-clip { position:absolute; top:-24px; right:6px; width:32px; height:42px;

  .rec.rec-layout-jn .jn-inner { position:relative; z-index:1; }

  .rec.rec-layout-jn .j-head { display:flex; justify-content:space-between; align-items:flex-start; }

  .rec.rec-layout-jn .pin-btn.on { color:#8B7355; }
  .rec.rec-layout-jn .pin-btn.on svg { fill:currentColor; }

  /* 卡片标题：衬线宋体 */
  .rec.rec-layout-jn .j-title { font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    font-size:17px; font-weight:600; color:#3D3226; line-height:1.4; letter-spacing:.3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    overflow-wrap:anywhere; word-break:break-word; }

  /* 标签：统一浅米灰底 + 深棕字，无彩色 */
  .rec.rec-layout-jn .j-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:7px; }
  .rec.rec-layout-jn .j-tag { display:inline-block; padding:2px 9px; border-radius:6px; font-size:11px;

  .rec.rec-layout-jn .j-date { font-size:11px; font-weight:300; color:#9C8B7A; margin-left:2px; }
  .rec.rec-layout-jn .badge.family-badge { background:#F0E8DC; color:#5C4A3A; }

  /* 正文：3 行截断；溢出时 JS 打 .jn-clamped 加渐变淡出 */
  .rec.rec-layout-jn .j-body { margin-top:9px; font-family:var(--font); font-size:13px; line-height:1.8;

  .rec.rec-layout-jn .j-body.jn-clamped {

  /* 「展开全文 →」14px 黑体深棕，在 [data-edit] 之外，不会误触发编辑器 */
  .rec.rec-layout-jn .j-more { display:block; margin-top:6px; padding:0; border:none; background:transparent;

  /* 卡片内小拍立得（有图时） */

  .rec.rec-layout-jn .jn-cat { position:absolute; height:20%; min-height:38px; max-height:64px; width:auto;

  /* ============================================================
     灵感备忘 · 详情内页（手账本翻开质感：书脊 + 页缘纸叠 + 低密度点阵）
     ============================================================ */
  .nd-overlay { position:fixed; inset:0; z-index:60; display:flex; align-items:stretch; justify-content:center;
    background:rgba(61,50,38,.34); perspective:1800px; animation:ndFade .3s ease both; }
  @keyframes ndFade { from{opacity:0} to{opacity:1} }
  @keyframes ndFlip { from{ transform: rotateY(-26deg); opacity:0; } to{ transform: rotateY(0deg); opacity:1; } }
  .nd-sheet { position:relative; display:flex; flex-direction:column; width:100%; height:100%;
    background-color:#F9F5EC; transform-origin:left center;
    animation:ndFlip .5s cubic-bezier(.36,.06,.2,1) both;
    border-radius:0 14px 14px 0;
    box-shadow:
      /* 左：前一页米黄书页（多页叠加 + 负 y 偏移填满顶部空隙） */
      -1px 0 0 #F0E7D4, -2px 0 0 #EAE0CB, -3px 0 0 #E4D9C2, -4px 0 0 #DED2B9, -5px 0 0 #D8D2B0, -6px 0 0 #D2CBA7,
      -1px -1px 0 #F0E7D4, -2px -2px 0 #EAE0CB, -3px -3px 0 #E4D9C2, -4px -4px 0 #DED2B9,
      -1px  1px 0 #F0E7D4, -2px  2px 0 #EAE0CB, -3px  3px 0 #E4D9C2, -4px  4px 0 #DED2B9,
      -7px 3px 12px rgba(61,50,38,.07),
      /* 右：内页厚度 */
      1px 0 0 #F4EDDD, 2px 0 0 #EFE6D3, 3px 0 0 #E9DEC8, 4px 0 0 #E3D7BE, 5px 0 0 #DDD0B5,
      /* 右：低饱和浅绿封皮边缘 */
      6px 0 0 #A9BFA8, 7px 0 0 #93AE97, 8px 0 0 #7A9A7E, 9px 0 0 #6E8C72,
      /* 顶/底：书脊边缘（米黄） */
      0 -1px 0 #F0E7D4, 0 -2px 0 #EAE0CB, 0 -3px 0 #E4D9C2,
      0 1px 0 #F0E7D4, 0 2px 0 #EAE0CB, 0 3px 0 #E4D9C2,
      /* 柔和外阴影 */
      16px 12px 34px rgba(61,50,38,.15),
      inset -10px 0 14px -10px rgba(61,50,38,.10); }
  @media (min-width:720px){
    .nd-overlay { align-items:center; padding:30px 24px 30px 30px; }
    .nd-sheet { height:88vh; max-width:620px; border-radius:0 16px 16px 0; overflow:hidden;
      box-shadow:
        /* 左：前一页米黄书页（多页叠加 + 负 y 填满顶部空隙） */
        -1px 0 0 #F0E7D4, -2px 0 0 #EAE0CB, -3px 0 0 #E4D9C2, -4px 0 0 #DED2B9,
        -1px -2px 0 #F0E7D4, -2px -3px 0 #EAE0CB, -3px -4px 0 #E4D9C2,
        -9px 4px 16px rgba(61,50,38,.08),
        /* 右：内页厚度 */
        1px 0 0 #F4EDDD, 2px 0 0 #EFE6D3, 3px 0 0 #E9DEC8, 4px 0 0 #E3D7BE, 5px 0 0 #DDD0B5,
        /* 右：低饱和浅绿封皮边缘 */
        6px 0 0 #A9BFA8, 7px 0 0 #93AE97, 8px 0 0 #7A9A7E, 9px 0 0 #6E8C72,
        /* 顶/底：书脊边缘 */
        0 -1px 0 #F0E7D4, 0 -2px 0 #EAE0CB, 0 -3px 0 #E4D9C2,
        0 1px 0 #F0E7D4, 0 2px 0 #EAE0CB, 0 3px 0 #E4D9C2,
        /* 柔和外阴影 */
        20px 16px 54px rgba(61,50,38,.16),
        inset -12px 0 16px -12px rgba(61,50,38,.10); }
  }
  @media (max-width:719px){
    .nd-overlay { padding:0 16px 0 12px; align-items:center; }
