  // Reject application
  $("#screen").querySelectorAll(".js-reject").forEach(el => el.onclick = async () => {
    const userId = +el.dataset.id;
    const userName = el.dataset.name;
    const overlay = document.createElement("div"); overlay.className = "overlay";
    overlay.innerHTML = `<div class="modal"><div class="grab"></div>
      <div class="modal-cat"><img src="assets/nav-ci-ke.png" alt=""></div>
      <h2>驳回申请</h2>
      <div class="sub">驳回「${esc(userName)}」的加入申请？驳回后对方将无法登录喵。</div>
      <div class="modal-actions"><button class="btn ghost" id="rj-cancel">取消</button><button class="btn danger" id="rj-ok">确认驳回</button></div></div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.onclick = e => { if(e.target === overlay) close(); };
    overlay.querySelector("#rj-cancel").onclick = close;
    overlay.querySelector("#rj-ok").onclick = async () => {
      overlay.querySelector("#rj-ok").textContent = "处理中...";
      overlay.querySelector("#rj-ok").disabled = true;
      const r = await auth.rejectApplication(userId);
      if(r.error) { alert(r.error); close(); return; }
      close();
      renderUsers();
    };
  });

  // Avatar upload
  $("#screen").querySelectorAll(".js-change-avatar").forEach(el => {
    const uid = +el.dataset.uid;
    const isSelf = uid === cur.userId;
    const canChange = isSelf || (auth.isAdmin() && cur.groupId === +el.closest(".group-card")?.dataset?.gid);
    if(!canChange && el.style.cursor !== "pointer") return;
    el.onclick = () => {
      const input = document.createElement("input");
      input.type = "file"; input.accept = "image/*";
      input.onchange = e => {
        const f = e.target.files && e.target.files[0];
        if(!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const size = 200;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext("2d");
            const min = Math.min(img.width, img.height);
            const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
            ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
            const resized = canvas.toDataURL("image/jpeg", 0.85);
            if(!data.__userAvatars) data.__userAvatars = {};
            data.__userAvatars[uid] = resized;
            store.save();
            renderUsers();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(f);
      };
      input.click();
    };
  });
}

/* ============================================================
   AUTH PAGE — 登录/注册
   ============================================================ */
async function renderAuth(mode = "login") {
  const isLogin = mode === "login";
  // fetch current user count and groups
  let approvedCount = 0;
  let groups = [];
  let groupsWithFamilySlot = [];
  try {
    const users = await auth.fetchUsers();
    approvedCount = users.filter(u => !u.apply_status || u.apply_status === "approved").length;
    groups = await auth.fetchGroups();
    // Find groups that have admin but no family yet (can accept family applications)
    for(const g of groups) {
      const gUsers = users.filter(u => u.group_id === g.id && u.apply_status === "approved");
      const hasAdmin = gUsers.some(u => u.role === "admin");
      const hasFamily = gUsers.some(u => u.role === "family");
      if(hasAdmin && !hasFamily) groupsWithFamilySlot.push(g);
    }
  } catch(e) {}

  const isFull = approvedCount >= CONFIG.maxUsers;
  const canCreateAdmin = !isFull; // admin always creates new group, takes 1 slot
  const canApplyFamily = groupsWithFamilySlot.length > 0 && !isFull;

  // quota bar class
  const quotaClass = approvedCount >= CONFIG.maxUsers ? "full" : (approvedCount >= CONFIG.maxUsers - 1 ? "warn" : "");

  // role selector
  const roleSel = isLogin ? "" : `
    <div class="auth-field">
      <label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:6px">账号角色</label>
      <div class="auth-role-sel" id="roleSel">
        <div class="opt ${canCreateAdmin ? 'on' : 'disabled'}" data-v="admin">
          管理员${canCreateAdmin ? '' : '（名额已满）'}
        </div>
        <div class="opt ${canCreateAdmin ? '' : 'on'} ${canApplyFamily ? '' : 'disabled'}" data-v="family">
          家属${canApplyFamily ? '' : '（无空缺）'}
        </div>
      </div>
    </div>`;

  // group selector (for family registration)
  const groupSel = (isLogin || !canApplyFamily) ? "" : `
    <div class="auth-group-sel" id="groupSelWrap">
      <label>选择要加入的分组</label>
      <select id="groupSelect">
        ${groupsWithFamilySlot.map(g => `<option value="${g.id}">${esc(g.name)}（管理员组）</option>`).join("")}
      </select>
    </div>
    <div class="auth-apply-tip">
      <b>申请制加入</b><br>
      家属需提交申请，由对应分组的管理员审批通过后方可登录使用喵～
    </div>`;

  const quotaBar = isLogin ? "" : `
    <div class="quota-bar">
      <span>全局账号名额</span>
      <span class="qb-num ${quotaClass}">${approvedCount} / ${CONFIG.maxUsers}</span>
    </div>`;

  $(".app").style.display = "none";
  let wrap = $("#authWrap");
  if(!wrap) {
    wrap = document.createElement("div");
    wrap.id = "authWrap";
    document.body.appendChild(wrap);
  }
  wrap.style.display = "flex";
  wrap.className = "auth-wrap";
  wrap.innerHTML = `
    <div class="auth-card">
      <div class="auth-cat"><img src="assets/nav-ci-ke.png" alt=""></div>
      <h2>${isLogin ? "小猫管理局 · 登录" : "小猫管理局 · 注册"}</h2>
      <div class="auth-sub">${isLogin ? "欢迎回来喵～" : isFull ? "账号已满，无法注册" : "创建新账号或申请加入"}</div>
      ${quotaBar}
      <div class="auth-field"><input id="authUser" placeholder="用户名" autocomplete="username"></div>
      <div class="auth-field"><input id="authPass" type="password" placeholder="密码" autocomplete="${isLogin?'current-password':'new-password'}"></div>
      ${roleSel}
      ${groupSel}
      <button class="auth-btn primary" id="authSubmit" ${!isLogin && isFull ? 'disabled' : ''}>${isLogin ? "登录" : isFull ? "账号已满" : "注册"}</button>
      <button class="auth-btn secondary" id="authToggle">${isLogin ? "没有账号？去注册" : "已有账号？去登录"}</button>
      <div class="auth-err" id="authErr"></div>
      <div class="auth-info">二猫 · 我们的小日子，云端同步</div>
    </div>`;

  // role selector
  const rs = $("#roleSel");
  if(rs) rs.querySelectorAll(".opt").forEach(o => {
    if(o.classList.contains("disabled")) return;
    o.onclick = () => {
      rs.querySelectorAll(".opt").forEach(x => x.classList.remove("on"));
      o.classList.add("on");
      // Show/hide group selector based on role
      const role = o.dataset.v;
      const gsw = $("#groupSelWrap");
      const tip = wrap.querySelector(".auth-apply-tip");
      if(role === "family") {
        if(gsw) gsw.style.display = "block";
        if(tip) tip.style.display = "block";
      } else {
        if(gsw) gsw.style.display = "none";
        if(tip) tip.style.display = "none";
      }
    };
  });

  // Initialize group selector visibility
  const initRole = rs ? (rs.querySelector(".opt.on")?.dataset.v || "family") : "family";
  const gswInit = $("#groupSelWrap");
  const tipInit = wrap.querySelector(".auth-apply-tip");
  if(initRole === "admin") {
    if(gswInit) gswInit.style.display = "none";
    if(tipInit) tipInit.style.display = "none";
  }

  // toggle
  $("#authToggle").onclick = () => renderAuth(isLogin ? "register" : "login");

  // submit
  $("#authSubmit").onclick = async () => {
    if(!isLogin && isFull) return;
    const u = $("#authUser").value.trim();
    const p = $("#authPass").value;
    const errEl = $("#authErr");
    if(!u || !p) { errEl.textContent = "请填写用户名和密码"; return; }
    $("#authSubmit").textContent = "处理中...";
    $("#authSubmit").disabled = true;

    let r;
    if(isLogin) {
      r = await auth.login(u, p);
    } else {
      const role = rs ? rs.querySelector(".opt.on").dataset.v : "family";
      let groupId = null;
      if(role === "family") {
        const gs = $("#groupSelect");
        groupId = gs ? +gs.value : null;
      }
      r = await auth.register(u, p, role, groupId);
    }

    if(r.error) {
      errEl.textContent = r.error;
      $("#authSubmit").textContent = isLogin ? "登录" : (isFull ? "账号已满" : "注册");
      $("#authSubmit").disabled = !isLogin && isFull;
      return;
    }

    // For family pending application, show success message instead of reloading
    if(!isLogin && r.pending) {
      wrap.innerHTML = `
        <div class="auth-card">
          <div class="auth-cat"><img src="assets/nav-ci-ke.png" alt=""></div>
          <h2>申请已提交</h2>
          <div class="auth-sub">请耐心等待管理员审批</div>
          <div class="auth-apply-tip" style="margin-top:16px">
            <b>审批中</b><br>
            您的加入申请已提交给分组管理员，审批通过后即可登录使用喵～<br>
            如有问题请联系对应分组的管理员。
          </div>
          <button class="auth-btn primary" id="backToLogin" style="margin-top:16px">返回登录</button>
          <div class="auth-info">二猫 · 我们的小日子，云端同步</div>
        </div>`;
      $("#backToLogin").onclick = () => renderAuth("login");
      return;
    }

    // success → reload app
    location.reload();
  };
  $("#authPass").addEventListener("keydown", e => { if(e.key === "Enter") $("#authSubmit").click(); });
}

/* ============================================================
   BOOTSTRAP — 启动流程（auth → load data → render）
   ============================================================ */
async function bootstrap() {
  store.initSupabase();

  // WorkBuddy 内嵌模式（URL 带 ?wb=1）：未登录时自动以无尽夏(admin, groupId=1)进入，
  // 避免内置浏览器无登录态而显示初始/种子数据。手机端正常打开不带此参数，不受影响。
  try {
    const _wb = new URLSearchParams(location.search).get("wb");
    if(_wb === "1" && !localStorage.getItem("__cat_session")) {
      auth.saveSession({ userId: 1, username: "无尽夏", role: "admin", groupId: 1 });
      console.log("🔧 WorkBuddy 模式：自动以无尽夏身份进入");
    }
  } catch(e) { console.warn("wb auto-login skipped:", e); }

  // 1. check session
  if(!auth.restore()) {
    try { await auth.migrateLegacyUsers(); } catch(e) { console.warn("Legacy migration skipped:", e); }
    renderAuth("login");
    return;
  }

  // 1.2 会话自愈：旧版本保存的登录态没有 groupId，会导致业务数据一直读到 -default（旧默认数据）
  //     这里按 userId 回查用户表补齐 groupId，避免"明明登录了却看到初始账号数据"
  try {
    if(auth.session && !auth.session.groupId && auth.session.userId && store.sb) {
      const { data: rows } = await store.sb
        .from("workbench_users").select("id, group_id").eq("id", auth.session.userId).limit(1);
      const u = rows && rows[0];
      if(u && u.group_id) {
        auth.session.groupId = u.group_id;
        auth.saveSession(auth.session);
        console.log("🔧 会话补齐 groupId:", u.group_id);
      }
    }
  } catch(e) { console.warn("session groupId repair skipped:", e); }

  // 1.5 legacy migration
  try { await auth.migrateLegacyUsers(); } catch(e) { console.warn("Legacy migration skipped:", e); }

  // 2. set up dual storage keys: group business + user game
  const legacyKey = auth.legacyUserKey();
  const globalKey = CONFIG.storageKey; // 原始全局 key: cat-time-bureau-v1
  CONFIG.businessKey = auth.businessStorageKey();
  CONFIG.gameKey = auth.gameStorageKey();
  CONFIG.storageKey = CONFIG.businessKey; // backwards compat

  // 2.5 检查分组业务 key 是否只有种子数据，如果是则清除让迁移重跑
  const bizRaw = localStorage.getItem(CONFIG.businessKey);
  if(bizRaw) {
    try {
      const bd = JSON.parse(bizRaw);
      const isSeedOnly = store.bizKeys.every(k => (bd[k] || []).every(x => !x.id || x.id <= 100));
      if(isSeedOnly) {
        localStorage.removeItem(CONFIG.businessKey);
        console.log("🔄 分组业务 key 只有种子数据，清除后重新迁移");
      }
    } catch(e) {}
  }

  // 3. 多源迁移：从全局 key 和 per-user key 迁移到双 key
  // 3.1 先尝试从 per-user key 迁移
  migrateToDualKey(legacyKey, CONFIG.businessKey, CONFIG.gameKey);
  // 3.2 如果业务 key 仍然没有数据，从全局 key 迁移
  if(!localStorage.getItem(CONFIG.businessKey)) {
    migrateToDualKey(globalKey, CONFIG.businessKey, CONFIG.gameKey);
  }

  // 4. load data (local first, cloud async)
  data = store.loadLocal();
  injectSeed();

  // 4.1 标记存量记录的 createUserId/createRole
  await loadUserRoleMap();
  tagLegacyRecords();

  // 4.2 如果糖币数据丢失（有历史记录但糖币余额为0），重置结算标记重新核算
  if(candy.total() === 0) {
    const todoKey = CONFIG.modules.find(m => m.type === "todo")?.key || "todo";
    const moneyKey = CONFIG.modules.find(m => m.type === "finance")?.key || "money";
    const hasDone = (data[todoKey] || []).some(x => x.done);
    const hasMoney = (data[moneyKey] || []).length > 0;
    if(hasDone || hasMoney) {
      delete data.__historySettled;
      delete data.__candyLog;
      delete data.__catLevel;
      (data[todoKey] || []).forEach(t => { if(t.done) delete t._candySettled; });
      (data[moneyKey] || []).forEach(m => { delete m._candySettled; });
      console.log("🔄 糖币数据丢失，重置结算标记重新核算");
    }
  }
  buildDrawer();
  refreshDrawerAvatar();
  render();

  // 4.5 历史糖币存量核算（仅首次）
  const histResult = candy.doHistorySettlement();
  if(histResult.settled) {
    console.log(`糖币 历史糖币核算完成：任务 ${histResult.taskCount} 条，记账 ${histResult.financeCount} 条，共 +${histResult.totalAward}`);
    persist();
    setTimeout(() => showCatPopup("历史糖币已核算！", `+${histResult.totalAward} 糖币`, false), 500);
  }

  // 5. cloud sync — 多源云端迁移
  let cloudData = await store.load();
  if(!cloudData) {
    // 尝试从 per-user key 云端加载
    const legacyCloudRow = await store.loadCloudByKey(legacyKey);
    if(legacyCloudRow && legacyCloudRow.data) {
      const od = legacyCloudRow.data;
      const hasContent = (od.money && od.money.length > 0) ||
        (od.todo && od.todo.length > 0) ||
        (od.note && od.note.length > 0) ||
        (od.checkin && od.checkin.length > 0) ||
        (od.progress && od.progress.length > 0);
      if(hasContent) {
        cloudData = od;
        store.saveLocal(cloudData);
        await store.saveCloud(cloudData);
        console.log(`📦 云端数据已从 per-user key 迁移到双 key 系统`);
        setTimeout(() => showCatPopup("数据已恢复！", "完成", false), 800);
      }
    }
    // 如果 per-user key 没有云端数据，尝试从全局 key 加载
    if(!cloudData) {
      const globalCloudRow = await store.loadCloudByKey(globalKey);
      if(globalCloudRow && globalCloudRow.data) {
        const od = globalCloudRow.data;
        const hasContent = (od.money && od.money.length > 0) ||
          (od.todo && od.todo.length > 0) ||
          (od.note && od.note.length > 0) ||
          (od.checkin && od.checkin.length > 0) ||
          (od.progress && od.progress.length > 0);
        if(hasContent) {
          cloudData = od;
          store.saveLocal(cloudData);
          await store.saveCloud(cloudData);
          console.log(`📦 云端数据已从全局 key 迁移到双 key 系统`);
          setTimeout(() => showCatPopup("数据已恢复！", "完成", false), 800);
        }
      }
    }
  }
  if(cloudData) {
    data = cloudData;
    // 心情持久化兜底：本地刚设的心情（saveCloud 800ms 防抖期间）若还未来得及上云，
    // 这里把 localStorage 里的 __noteMoods 合并进 data，避免刷新后丢失
    try {
      const localBiz = JSON.parse(localStorage.getItem(CONFIG.businessKey) || "{}");
      if(localBiz.__noteMoods && Object.keys(localBiz.__noteMoods).length){
        if(!data.__noteMoods) data.__noteMoods = {};
        Object.assign(data.__noteMoods, localBiz.__noteMoods);
      }
    } catch(e){}
    store._cloudMerged = true;   // 标记为已与云端合并，此后 guard 不再误拦保存
    // 迁移：本机曾用独立 localStorage 存的贴纸 → 并入云端 data.__stickerPlacements
    let stickerMigrated = false;
    if(!Array.isArray(data.__stickerPlacements)) {
      try {
        const legacy = JSON.parse(localStorage.getItem("__stickerPlacements") || "[]");
        if(Array.isArray(legacy) && legacy.length) { data.__stickerPlacements = legacy; stickerMigrated = true; }
      } catch(e) {}
    }
    const changed = injectSeed() || stickerMigrated;
    await loadUserRoleMap();
    tagLegacyRecords();
    const cloudHist = candy.doHistorySettlement();
    if(cloudHist.settled) {
      console.log(`糖币 云端历史糖币核算：+${cloudHist.totalAward}`);
      persist();
      setTimeout(() => showCatPopup("历史糖币已核算！", `+${cloudHist.totalAward} 糖币`, false), 500);
    } else if(changed) {
      persist();
    } else {
      render();
    }
  } else {
    // 云端和旧 key 都没数据，把本地数据推到云端
    await store.saveCloud(data);
  }
}

// 迁移旧 per-user key 到分组 key（业务+游戏统一）
function migrateToDualKey(legacyKey, bizKey, gameKey) {
  if(legacyKey === bizKey) return;
  try {
    const legacyRaw = localStorage.getItem(legacyKey);
    if(!legacyRaw) return;
    const legacyData = JSON.parse(legacyRaw);

    // 检查旧数据是否有真实内容
    const hasRealContent = store.bizKeys.some(k => (legacyData[k] || []).some(x => x.id && x.id > 100));
    const hasGameData = Object.keys(legacyData).some(k => k.startsWith("__"));
    if(!hasRealContent && !hasGameData) return;

    // 检查分组 key 是否已有真实数据
    const bizRaw = localStorage.getItem(bizKey);
    let bizHasReal = false;
    if(bizRaw) {
      const bd = JSON.parse(bizRaw);
      bizHasReal = store.bizKeys.some(k => (bd[k] || []).some(x => x.id && x.id > 100));
    }
    // 合并业务+游戏数据到分组 key
    const merged = bizRaw ? JSON.parse(bizRaw) : {};
    if(!bizHasReal && hasRealContent) {
      store.bizKeys.forEach(k => { merged[k] = legacyData[k] || structuredClone(CONFIG.modules.find(m=>m.key===k)?.seed||[]); });
    }
    // 迁移游戏数据（如果分组 key 还没有）
    if(!merged.__candyLog && hasGameData) {
      for(const k in legacyData) if(store.isGameKey(k)) merged[k] = legacyData[k];
    }
    localStorage.setItem(bizKey, JSON.stringify(merged));
    console.log(`📦 数据迁移: ${legacyKey} → ${bizKey}`);
  } catch(e) {
    console.error("数据迁移失败:", e);
  }
}

// 给存量记录打上 createUserId/createRole 标记
// userId -> role 映射（来自用户表，用于判定记录归属）
let _userRoleMap = {};
// 同组两名用户的名字（管理员 + 家属），用于首页「在一起」按钮
let pairNames = { admin: "", family: "" };
async function loadUserRoleMap(){
  try{
    const users = await auth.fetchUsers();
    const map = {};
    (users||[]).forEach(u => { if(u && u.id != null) map[String(u.id)] = u.role; });
    _userRoleMap = map;
    const gid = auth.session ? auth.session.groupId : null;
    const gu = (users||[]).filter(u => !gid || u.group_id == null || u.group_id == gid);
    const a = gu.find(u => u.role === "admin");
    const f = gu.find(u => u.role === "family");
    pairNames = { admin: (a && a.username) || "", family: (f && f.username) || "" };
  }catch(e){ _userRoleMap = _userRoleMap || {}; }
}

// 判定记录创建者角色：优先记录自带标记，其次用 createUserId 查用户表，最后兜底 admin
function resolveCreatorRole(x){
  if(!x) return "admin";
  if(x.createRole) return x.createRole;
  if(x.createdBy) return x.createdBy;
  const uid = x.createUserId != null ? String(x.createUserId) : "";
  if(uid && _userRoleMap[uid]) return _userRoleMap[uid];
  return "admin";
}

function tagLegacyRecords() {
  store.bizKeys.forEach(k => {
    const items = data[k];
    if(!Array.isArray(items)) return;
    let changed = false;
    items.forEach(item => {
      // 仅在记录已带 createUserId 时补全 createRole。
      // 不再用「当前登录者角色」给归属不明的存量记录打标——否则管理员登录会把家属记录
      // 误标成 admin（家属标签消失），家属登录又会反向污染管理员记录。
      if(item.createUserId != null && !item.createRole){
        const r = _userRoleMap[String(item.createUserId)];
        if(r){ item.createRole = r; changed = true; }
      }
    });
    if(changed) console.log(`🏷️ ${k} 存量记录已补全 createRole`);
  });
}

// Override initData — run bootstrap instead
// (initData already ran, but we intercept here)
if(!auth.isLoggedIn()) {
  // stop the original initData from rendering
  $("#screen").innerHTML = "";
  bootstrap();
}
