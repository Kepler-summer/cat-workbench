  .nd-imgs { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0 4px; }
  .nd-img-cell { position:relative; background:#fff; padding:3px 3px 9px; border:1px solid #E8DFD0;
    border-radius:2px; box-shadow:0 2px 5px rgba(92,74,58,.09); }
  .nd-img-cell img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:1px; }
  .nd-img-del { position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%;
    border:none; background:#3D3226; color:#FBF8F1; font-size:12px; line-height:1; cursor:pointer; }
  .nd-img-add { aspect-ratio:1/1; border:1px dashed #D8CBB4; border-radius:6px; background:rgba(255,253,247,.6);
    color:#9C8B7A; font-size:12px; cursor:pointer; }
  .nd-tools { display:flex; align-items:center; gap:10px; margin-top:16px; }
  .nd-tool { display:inline-flex; align-items:center; gap:4px; border:1px solid #D8CBB4;
    background:rgba(255,253,247,.85); color:#5C4A3A; font-size:12px; padding:5px 13px;
    border-radius:999px; cursor:pointer; }
  .nd-tools .nd-tip { font-size:10.5px; color:#B8A99A; }
  .nd-btn { border:1px solid #D8CBB4; background:#F0E8DC; color:#5C4A3A; font-size:13px; font-weight:600;
    padding:9px 24px; border-radius:999px; cursor:pointer; }
  .nd-btn:active { transform:scale(.96); }
  .nd-btn-primary { background:#5C4A3A; border-color:#5C4A3A; color:#FBF8F1; }
  /* 贴纸层：查看态纯展示，编辑态可拖拽/缩放 */
  .nd-page > .nd-stickers { position:absolute; inset:0; z-index:2; pointer-events:none; }
  .ndstk { position:absolute; width:52px; height:52px; pointer-events:none; }
  .ndstk img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(2px 3px 4px rgba(92,74,58,.14)); }
  .ndstk-edit { pointer-events:auto; cursor:grab; touch-action:none; user-select:none; }
  .ndstk-edit.sel { outline:1.5px dashed #C08A4E; outline-offset:3px; border-radius:6px; }
  .ndstk-tools { position:absolute; left:50%; transform:translateX(-50%); bottom:62px; z-index:80;
    display:flex; gap:6px; background:#3D3226; border-radius:999px; padding:6px 10px;
    box-shadow:0 3px 12px rgba(61,50,38,.3); }
  .ndstk-tools[hidden] { display:none; }
  .ndstk-tools button { border:none; background:transparent; color:#F0E8DC; font-size:13px; padding:4px 11px;
    border-radius:999px; cursor:pointer; }
  .ndstk-tools button:active { background:rgba(255,255,255,.12); }
  /* 藏品贴纸面板 */
  .nd-panel { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-height:46vh; overflow-y:auto;
    padding:4px 2px; }
  .nd-pnl-it { display:flex; flex-direction:column; align-items:center; gap:4px; border:1px solid var(--border);
    background:var(--surface-card); border-radius:10px; padding:10px 4px; cursor:pointer; font-size:10.5px;
    color:var(--text-secondary); }
  .nd-pnl-it img { width:34px; height:34px; object-fit:contain; }
  .nd-pnl-it:active { background:#F3EDDE; }
  /* ============================================================
     灵感备忘 · 扉页栏目卡（图标 + 名称 + 说明 + 贴纸式新建按钮 + 猫咪）
     ============================================================ */
  .greet.jn-fd { overflow:visible; min-height:0; padding:16px 14px 18px; gap:11px; align-items:center;
    background-color:#FBF8F1;
    background-image:
      linear-gradient(rgba(140,120,95,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,120,95,.045) 1px, transparent 1px);
    background-size:18px 18px;
    border:1px dashed #E0D5C5; border-radius:14px; box-shadow:0 2px 6px rgba(92,74,58,.05); }
  .greet.jn-fd .jn-fd-ic { width:38px; height:38px; object-fit:contain; flex:0 0 auto;
    filter:drop-shadow(1px 2px 3px rgba(92,74,58,.10)); }
  .greet.jn-fd .jn-fd-tx { flex:1; min-width:0; }
  .jn-fd-name { font-family:var(--font-journal); font-size:21px; font-weight:700; color:#3D3226; line-height:1.25; margin:0; }
  .jn-fd-desc { font-size:12px; color:#9C8B7A; margin:4px 0 0; line-height:1.5; }
  .jn-fd-add { flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    border:1px solid #D8CBB4; background:rgba(255,253,247,.85); color:#5C4A3A;
    font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer;
    transition:transform .12s ease, background .15s; }
  .jn-fd-add:active { transform:scale(.96); background:#F3EDDE; }
  .jn-fd-cat { position:absolute; right:14px; bottom:-10px; width:52px; height:auto; opacity:.92;
    filter:drop-shadow(2px 3px 4px rgba(92,74,58,.12)); pointer-events:none; transform:rotate(4deg); }

  /* ---------- bottom nav ---------- */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; height: var(--nav-h);
    background: var(--surface-card); backdrop-filter: blur(16px); border-top: 1px solid var(--border-soft);
    display: grid; grid-template-columns: repeat(4,1fr); align-items: center; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
  .nav .n { display:flex; flex-direction:column; align-items:center; gap: 5px; cursor:pointer; color: var(--text-tertiary); font-size: 11px; font-weight: 500; letter-spacing: .5px; transition: color .2s ease; }
  .nav .n.active { color: var(--accent); font-weight: 600; }

  /* ---------- drawer — 日系手账奶油白侧边栏 ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(92,74,58,.12); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 40; opacity:0; pointer-events:none; transition: opacity .3s ease; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .drawer { position: fixed; top:0; bottom:0; left:0; width: 296px; max-width: 82vw; z-index: 50; transform: translateX(-104%);
    transition: transform .4s cubic-bezier(.22,.96,.36,1); overflow-y:auto; overflow-x:hidden;
    background: var(--drawer-bg); color:var(--drawer-text);
    border-radius: 0 20px 20px 0; box-shadow: 4px 0 30px rgba(92,74,58,.08); }
  .drawer.show { transform: translateX(0); }
  .drawer .dh { padding: 28px 20px 20px; display:flex; align-items:center; gap: 12px; position: relative; }
  .drawer .dh .brand { position: relative; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); box-shadow: 0 0 0 1px var(--border); cursor: pointer; }
  .drawer .dh .brand img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .drawer .dh .brand .brand-cam { position:absolute; inset:0; display:grid; place-items:center; opacity:0;
    background: color-mix(in srgb, var(--text) 35%, transparent); color:var(--drawer-text); transition: opacity .15s; border-radius:12px; }
  .drawer .dh .brand:active .brand-cam { opacity:1; }
  .drawer .dh h2 { font-family:var(--font-journal); font-size: 18px; font-weight:700; letter-spacing: 2px; padding-right:44px; }
  .drawer .dh p { font-family:var(--font-sans-light); font-size: 11px; color:var(--drawer-text-mute); margin-top: 4px; letter-spacing: 1px; }
  .drawer .dclose { position:absolute; top:18px; right:16px; width:32px;height:32px;border-radius:10px; border:none; cursor:pointer;
    background: var(--drawer-hover); color:var(--drawer-text); display:grid; place-items:center; transition: all .2s ease; }
  .drawer .dclose:hover { background: var(--drawer-active); }
  .drawer .dsep { height:1px; background: var(--border); margin: 6px 20px 8px; }
  .drawer .ditem { display:flex; align-items:center; gap: 13px; padding: 12px 20px; cursor:pointer; font-size: 14px; font-weight: 400;
    font-family:var(--font-sans-light); color: var(--drawer-text); transition: all .2s ease; letter-spacing:.3px; }
  .drawer .ditem:hover { background: var(--drawer-hover); }
  .drawer .ditem svg { color: var(--drawer-text-mute); }
  .drawer .ditem.active { background: var(--drawer-active); color:var(--candy); font-weight: 500; box-shadow:inset 3px 0 0 var(--candy); }
  .drawer .ditem.active svg { color:var(--candy); }
  .drawer .dfoot { font-family:var(--font-sans-light); font-size: 11px; color:var(--drawer-text-mute); padding: 20px 20px 28px; letter-spacing:.5px; }

  /* ---------- modal — tinytype/Vaul 风格底部弹窗 ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(26,41,56,.35); backdrop-filter: blur(8px) saturate(1.2); -webkit-backdrop-filter: blur(8px) saturate(1.2); z-index: 60;
    display:flex; align-items:flex-end; justify-content:center; animation: fade .25s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background: var(--surface-card); border-radius: 24px 24px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    width: 100%; max-width: 520px; box-shadow: var(--shadow-overlay); animation: sheetUp .4s cubic-bezier(.22,.96,.36,1); max-height: 88vh; overflow-y:auto;
    border-top: 1px solid rgba(255,255,255,.6); }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal .grab { width: 32px; height: 4px; border-radius:999px; background: var(--border-input); margin: 0 auto 16px; opacity:.4; transition: opacity .2s, width .2s; }
  .modal:active .grab { opacity:.7; width:40px; }
  .modal h2 { font-size: 18px; font-weight: 800; letter-spacing:-.01em; }
  .modal .sub { color: var(--text-secondary); font-size: 13px; margin: 4px 0 16px; }
  .field { margin-bottom: 13px; }
  .field label { display:block; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  input, select, textarea { font-family: var(--font); font-size: 15px; border: 1px solid var(--border-input); border-radius: var(--radius-tile);
    padding: 11px 12px; background: var(--surface-card); color: var(--text); outline:none; width: 100%; transition: border-color .15s, box-shadow .15s; }
  textarea { resize: vertical; min-height: 74px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-muted); }
  .frow { display:flex; gap: 10px; }
  .frow .field { flex:1; }
  .seg { display:flex; gap: 8px; }
  .seg .opt { flex:1; text-align:center; padding: 10px; border-radius: var(--radius-tile); border: 1px solid var(--border-input);
    cursor:pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .seg .opt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .modal-actions { display:flex; align-items:center; gap: 10px; margin-top: 18px; }
  .btn { flex:1; background: var(--accent); color:var(--on-accent); border:none; border-radius: var(--radius-tile); padding: 13px; font-size: 15px; font-weight: 700; cursor:pointer;
    transition: transform .1s ease, box-shadow .2s ease, opacity .2s; }
  .btn:active { transform: scale(.97); opacity:.9; }
  .btn.ghost { flex: 0 0 auto; background: var(--surface-nested); color: var(--text-secondary); border: 1px solid var(--border-input); padding: 13px 20px; }
  .btn.ghost:active { transform: scale(.97); }
  .btn.danger { background: var(--danger); }
  .link-danger { color: var(--danger); background:none; border:none; font-size: 14px; font-weight: 600; cursor:pointer; }

  /* ---------- insight charts ---------- */
  .bar-list { display:flex; flex-direction:column; gap:11px; margin-top:14px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-ic { width:30px; height:30px; border-radius:var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .bar-name { font-size:13px; font-weight:600; width:64px; flex:0 0 auto; color:var(--text); }
  .bar-row .pbar { flex:1; margin:0; height:7px; }
  .bar-pct { font-size:12px; font-weight:600; color:var(--text-secondary); width:54px; text-align:right; flex:0 0 auto; }

  .donut-wrap { display:flex; gap:18px; align-items:center; margin-top:14px; }
  .donut { position:relative; width:104px; height:104px; flex:0 0 auto; }
  .donut svg { transform:rotate(-90deg); width:104px; height:104px; }
  .donut-mid { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; font-weight:800; color:var(--text); text-align:center; line-height:1.2; }
  .donut-legend { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .legend-dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .legend-name { color:var(--text); font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-amt { color:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
  .legend-pct { color:var(--text-secondary); width:38px; text-align:right; font-variant-numeric:tabular-nums; }
  .donut-empty { width:68px; height:68px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:var(--text-tertiary); font-size:10px; }

  /* ---------- calendar grid ---------- */
  .cal-panel { margin-top:12px; }
  .cal-hd { display:flex; align-items:center; gap:10px; }
  .cal-nav { width:30px; height:30px; border-radius:var(--radius-tile); border:1px solid var(--border-input); background:var(--surface-nested);
    color:var(--text); cursor:pointer; display:grid; place-items:center; transition: all .15s; }
  .cal-nav:active { background:var(--accent-muted); border-color:var(--accent); }
  .cal-nav[data-cal="prev"] svg { transform: scaleX(-1); }
  .cal-title { flex:1; text-align:center; font-size:14px; font-weight:700; color:var(--text); }
  .cal-chips { display:flex; gap:6px; overflow-x:auto; margin:12px 0 10px; padding-bottom:2px; scrollbar-width:none; }
  .cal-chips::-webkit-scrollbar { display:none; }
  .cal-chip { flex:0 0 auto; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border-input); background:var(--surface-card); color:var(--text-secondary); cursor:pointer; white-space:nowrap; transition: all .15s;
    font-family:var(--font); }
  .cal-chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .cal-dow { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--text-tertiary); font-weight:600; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell { aspect-ratio:1; border-radius:var(--radius-control); display:grid; place-items:center; font-size:12px; font-weight:600;
    color:var(--text-secondary); background:var(--surface-nested); border:1px solid var(--border); cursor:pointer; transition: all .15s;
    font-family:var(--font); }
  .cal-cell.blank { background:transparent; border:none; cursor:default; }
  .cal-cell.on { color:#fff; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell:active { transform: scale(.92); }
  .cal-toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%) translateY(16px);
    background:var(--text); color:var(--surface-card); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px;
    box-shadow:var(--shadow-overlay); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; display:flex; align-items:center; gap:10px; }
  .cal-toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .cal-toast button { background:var(--module-2); color:#fff; border:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font); }
  .cal-foot { margin-top:12px; font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .cal-foot svg { color:var(--module-3); }

  .hidden { display: none !important; }

  /* ---------- 猫咪时间报 · 主题装饰 ---------- */
  .greet::after { content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px;
    border-radius:50%; background: radial-gradient(circle, rgba(45,157,106,.1), transparent 70%);
    pointer-events:none; z-index:0; }
  .sec-title::before { background: linear-gradient(180deg, var(--accent), var(--module-1)); }
  .quote::before { background: linear-gradient(180deg, var(--accent), var(--module-1)); }
  .nav .n.active { color: var(--accent); }
  .nav .n img.nav-img { width: 32px; height: 32px; object-fit: contain; transition: all .28s cubic-bezier(.2,.8,.25,1); }
  .nav .n:not(.active) img.nav-img { opacity: .45; }
  .nav .n.active img.nav-img { opacity: 1; transform: scale(1.1); }
.ring .dial .mid { filter: drop-shadow(0 0 4px rgba(45,157,106,.12)); }

  /* ---------- 三段式每日金句 + 小猫装饰 ---------- */
  .quote { position: relative; background: url(assets/quote-bg.jpg) center / cover no-repeat; overflow: hidden; }
  .quote::before { content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background: radial-gradient(ellipse 70% 60% at center, color-mix(in srgb,var(--card) 92%,transparent) 30%, color-mix(in srgb,var(--card) 20%,transparent) 80%); }
  .quote > * { position: relative; z-index: 1; }
  .quote .cat-deco { position: absolute; top: 8px; right: 10px; width: 56px; height: 56px; object-fit: contain; border-radius: 50%; opacity: .18; pointer-events: none; z-index: 1; }
  .quote .src { display: block; font-size: .7rem; opacity: .45; margin-top: 2px; font-style: italic; font-weight: 400; }
  .quote .quote-lines { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .quote .quote-line { display: flex; align-items: baseline; gap: 8px; }
  .quote .ql-label { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; flex: 0 0 auto; }
  .quote .ql-label.ql-poem { color: var(--module-1); background: rgba(45,157,106,.12); }
  .quote .ql-label.ql-lyric { color: var(--module-2); background: rgba(74,122,181,.12); }
  .quote .ql-text { font-size: 13px; color: var(--text-secondary); font-weight: 500; line-height: 1.55; flex: 1; min-width: 0; }
  .quote .txt { font-size: 15px; }

  /* 小猫爪印分隔装饰 */
  .paw-row { display: flex; align-items: center; gap: 10px; margin: 20px 2px 12px; }
  .paw-row svg { color: var(--text-tertiary); opacity: .3; flex: 0 0 auto; }
  .paw-row .paw-line { flex: 1; height: 1px; background: var(--border); }
  .paw-row .paw-text { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

  /* ========== 温暖手账本 · 首页主题（参考拙趣 Bistro/奶油小程序） ========== */
  body.journal-theme {
    --page-bg: #FFF9F0;              /* 日系手账奶油白纸张底色 */
    --surface-card: #fffdf7;         /* 暖白卡片 */
    --surface-nested: #f8f2e4;        /* 嵌套奶油底 */
    --bg-secondary: #efe7d3;         /* 次级暖背景 */
    --bg-tertiary: #e9dec6;          /* hover 暖底 */
    --border: #e6dac0;               /* 浅褐细边 */
    --border-input: #d4c7ad;         /* 稍深暖边框 */
    --border-soft: #f0e8d6;          /* 软暖边/分隔 */
    --text: #5C4A3A;                  /* 手账深棕主文字 */
    --text-secondary: #7d7466;        /* 灰棕次文字 */
    --text-tertiary: #a89b88;         /* 浅棕弱文字 */
    --scrap-yellow: #FFE4A0;          /* 手账点缀 · 鹅黄 */
    --scrap-mint: #B8E0C8;            /* 手账点缀 · 薄荷绿 */
    --scrap-peach: #FFC8C8;           /* 手账点缀 · 蜜桃粉 */
    --scrap-blue: #C8DFF0;            /* 手账点缀 · 淡蓝 */
    --accent: #8c9e7e;                /* 低饱和鼠尾草绿 */
    --accent-light: #b5c6a8;          /* 浅绿 */
    --accent-muted: #eef2ea;          /* 浅绿底 */
    --on-accent: #ffffff;
    --candy: #b8875c;                 /* 焦糖色 */
    --candy-light: #d4ad82;
    --candy-muted: #f7f0e6;
    --berry: #a890b0;
    --berry-muted: #efeaf2;
    --module-1: #8c9e7e;
    --module-2: #8aa5c0;
    --module-3: #d4b876;
    --module-4: #7ba5a0;
    --module-5: #9e8fb5;
    --danger: #c07070;
    --danger-muted: #f2e0e0;
    --success: #5bb98c;
    --success-muted: #2a3d34;
    --accent-pair-1: #c98b8b;
    --accent-pair-2: #9ab5d4;
    --love-soft: #fbf4f4;
    --love-tint: #f7ecee;
    --love-ink:  #9b6b7d;
    --shadow-card: 0 2px 14px rgba(61,54,45,.04);
    --shadow-overlay: 0 4px 24px rgba(58,53,46,.10);
    --radius-card: 18px;
    --radius-tile: 14px;
    --radius-control: 6px;
    --page-texture: none;
    --greet-image: none;
    --font-journal: "Kaiti SC", "STKaiti", "楷体", "Ma Shan Zheng", cursive;
    --font-hand: "ZCOOL KuaiLe", "Ma Shan Zheng", "Kaiti SC", "STKaiti", "楷体", cursive;   /* 手写中文 */
    --font-hand-en: "Caveat", "ZCOOL KuaiLe", "Kaiti SC", cursive;                          /* 手写英文 */

function isoToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return isoToday(); }
function avgProgress(list){
  if(!list||!list.length) return { value: 0, sub: "0" };
  const v = Math.round(list.reduce((s,x)=>s+Math.min(100,(x.current/x.target)*100||0),0)/list.length);
  return { value: v, sub: `${list.length} 项` };
}

  isGameKey(k){ return k.startsWith("__"); },

  loadLocal(){
    const raw = localStorage.getItem(CONFIG.businessKey);
    const d = {};
    if(raw){ try { Object.assign(d, JSON.parse(raw)); } catch(e){} }
    // 迁移：如果分组 key 没有游戏数据，从个人 key 加载
    if(!d.__candyLog){
      const gameRaw = localStorage.getItem(CONFIG.gameKey);
      if(gameRaw){ try { const g = JSON.parse(gameRaw); for(const k in g) if(this.isGameKey(k)) d[k] = g[k]; } catch(e){} }
    }
    // 确保模块字段存在
    this.bizKeys.forEach(k => { if(!d[k]) d[k] = structuredClone(CONFIG.modules.find(m=>m.key===k)?.seed||[]); });
    return d;
  },

  // 保存到本地（业务+游戏统一存分组 key）
  saveLocal(d){
    const all = {};
    this.bizKeys.forEach(k => { all[k] = d[k]; });
    for(const k in d) if(this.isGameKey(k)) all[k] = d[k];
    localStorage.setItem(CONFIG.businessKey, JSON.stringify(all));

  async loadCloud(){
    if(!this.sb) return null;
    try {
      const { data: rows, error } = await this.sb
        .from("workbench_data")
        .select("id, data, updated_at, device_id")
        .eq("storage_key", CONFIG.businessKey)
        .order("updated_at", { ascending: false })
        .limit(1);
      if(error) throw error;
      const bizRow = rows && rows[0];
      if(bizRow && bizRow.data){
        const d = bizRow.data;
        // 迁移：如果分组 key 没有游戏数据，从个人 key 加载
        if(!d.__candyLog){
          const legacyRow = await this.loadCloudByKey(CONFIG.gameKey);
          if(legacyRow && legacyRow.data){
            for(const k in legacyRow.data) if(this.isGameKey(k)) d[k] = legacyRow.data[k];
          }
        }
        return { data: d, bizRow, gameRow: null };
      }
      return null;
    } catch(e) {
      console.warn("Cloud load failed:", e);
      return null;
    }

        .from("workbench_data")
        .select("id, data, updated_at, device_id")
        .eq("storage_key", key)
        .order("updated_at", { ascending: false })
        .limit(1);
      if(error) throw error;
      if(rows && rows.length > 0){

      if(!this.sb) return true;                       // 没连云端，放行
      // 已与云端完成合并（bootstrap 第 5 步 data=cloudData 后置位）：
      // 此后本地 data 即云端权威副本 + 用户最新操作，直接放行，避免误拦打卡/贴纸等保存
      if(this._cloudMerged) return true;
      // 尚未合并时，用「真实记录计数」保护云端（防止空/演示环境顶掉真实数据）
      const localReal = this.countRealEntries(localData);
      if(localReal > 0) return true;                  // 本地有真实数据，正常同步
      const cloud = await this.loadCloud();
      const cloudReal = this.countRealEntries(cloud && cloud.data);
      if(cloudReal === 0) return true;                // 云端也是空的，首次写入放行

      // 危险：本环境没有真实数据，云端却有 → 拦截上传
      if(!this._overwriteWarned){
        this._overwriteWarned = true;
        console.warn("⛔ 已阻止上传：本地无真实数据，云端有 " + cloudReal + " 条真实记录");
        try {
          if(typeof showCatPopup === "function"){
            showCatPopup("已阻止覆盖云端数据", "云端有 " + cloudReal + " 条记录", true);
          }
        } catch(e){}
      }
      return false;
    } catch(e) {
      return true;    // 校验本身出错时不阻断正常同步
    }
  },

  // 保存到云端（业务+游戏统一存分组 key）
  async saveCloud(d){
    if(!this.sb) return false;
    try {
      const allowed = await this.guardAgainstOverwrite(d);
      if(!allowed) return false;
      const all = {};
      this.bizKeys.forEach(k => { all[k] = d[k]; });
      for(const k in d) if(this.isGameKey(k)) all[k] = d[k];
      const now = new Date().toISOString();
      const { error } = await this.sb.from("workbench_data").upsert({
        storage_key: CONFIG.businessKey, data: all,
        device_id: this.deviceId, updated_at: now
      }, { onConflict: "storage_key" });
      if(error) throw error;
      return true;
    } catch(e) {
      console.warn("Cloud save failed:", e);
      return false;
    }
  },

  // 加载（优先云端，云端无数据返回 null 让 bootstrap 处理迁移）
  async load(){
    const inited = this.initSupabase();
    if(inited){
      const cloud = await this.loadCloud();
      if(cloud && cloud.data){
        this.saveLocal(cloud.data);
        this.startRealtime();
        return cloud.data;
      }
      // 云端没数据，返回 null 让 bootstrap 尝试旧 key 迁移
      this.startRealtime();
      return null;
    }
    return this.loadLocal();
  },

  // 保存（本地先存，云端异步防抖）
  save(){
    this.saveLocal(data);
    if(this._saveTimer) clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(() => {
      this.saveCloud(data);
    }, 800);
  },

  // 实时订阅：同组数据变更（业务+游戏统一在分组 key）
  startRealtime(){
    if(!this.sb) return;
    if(!this._realtimeSub){
      try {
        this._realtimeSub = this.sb
          .channel("workbench-biz")
          .on("postgres_changes",
            { event: "*", schema: "public", table: "workbench_data", filter: `storage_key=eq.${CONFIG.businessKey}` },
            (payload) => {
              const newData = payload.new && payload.new.data;
              const fromDevice = payload.new && payload.new.device_id;
              if(newData && fromDevice !== this.deviceId){
                Object.assign(data, newData);
                this.saveLocal(data);
                render();
              }
            }
          )
          .subscribe();
      } catch(e) { console.warn("Realtime failed:", e); }
    }
  },
};

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

/* ---------- DAILY QUOTE ---------- */
function getDailyQuote(){
  const todayKey = "__dailyQuote3_" + today();
  const cached = localStorage.getItem(todayKey);
  if(cached){
    try {
      const cq = JSON.parse(cached);
      if(cq && cq.cn) return cq;
    } catch(e){}
  }
  const fb = CONFIG.fallbackQuotes;
  const enFb = CONFIG.fallbackEnQuotes;
  const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 86400000);
  const i = dayOfYear % fb.length;
  const q = { cn: fb[i], cnSrc: "", en: enFb[i % enFb.length], enSrc: "" };
  localStorage.setItem(todayKey, JSON.stringify(q));
  fetch("https://v1.hitokoto.cn/?c=d&c=i&c=k&encode=json")
    .then(r=>r.json())
    .then(d=>{
      if(d && d.hitokoto){
        const txt = d.hitokoto;
        const hasJapanese = /[\u3040-\u309f\u30a0-\u30ff\u31f0-\u31ff]/.test(txt);
        if(hasJapanese) return;
        const apiQ = { cn: txt, cnSrc: d.from || d.from_who || "一言", en: enFb[i % enFb.length], enSrc: "" };
        localStorage.setItem(todayKey, JSON.stringify(apiQ));
        const el = $("#screen").querySelector(".quote");
        if(el){
          const cnEl = el.querySelector(".q-cn");
          const enEl = el.querySelector(".q-en");
          if(cnEl) cnEl.innerHTML = esc(apiQ.cn) + '<em class="src">' + esc(apiQ.cnSrc) + '</em>';
          if(enEl) enEl.innerHTML = esc(apiQ.en) + '<em class="src">' + esc(apiQ.enSrc) + '</em>';
        }
      }
    })
    .catch(()=>{});
  return q;
}

function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

/* ---------- calendar grid (打卡月视图) ---------- */
let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天 · 点日期可打卡今日</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const ds=el.dataset.date;
    const item=it.find(x=>x.id===calItemId)||it[0];
    if(!item) return;
    const todayIso=isoToday();
    if(ds>todayIso) return;
    item.log=item.log||{};
    const wasOn=!!item.log[ds];
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(!wasOn && ds===todayIso){ item.log[ds]=true; persist(); }
    else if(wasOn && ds===todayIso){ delete item.log[ds]; persist(); showCalUndo(item, ds); }
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");

  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);

}
function hideCalToast(){ const t=$("#calToast"); if(t) t.classList.remove("show"); }

    ? `<div class="receipt-chips"><button type="button" class="r-chip jn-receipt-open" data-receipt="flow">收支流水</button><span class="dot">·</span><button type="button" class="r-chip jn-receipt-open" data-receipt="cat">分类占比</button><span class="dot">·</span><button type="button" class="r-chip jn-receipt-open" data-receipt="month">月度小结</button></div>`
    : `<p>${m.desc}</p>`;
  /* 扉页栏目卡（灵感页先行，后续全局复用）：图标 + 名称 + 说明 + 贴纸式新建按钮 + 猫咪；顶栏标题置空避免重复 */
  let greetHtml;
  if (m.type === 'note') {
    greetHtml = ''; // \u7075\u611f\u9875\u53bb\u6807\u9898\u5361\uff0c\u907f\u514d\u4e0e\u9876\u90e8\u680f\u91cd\u590d
  } else {
    greetHtml = `<div class="greet"><div><h1>${m.name}</h1>${greetSub}</div>${greetCat}
      ${auth.canEdit(key) ? `<button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button>` : ''}</div>`;
  }
  $("#screen").innerHTML = `${greetHtml}
    <div style="margin-top:16px">${head}${extra}
      ${filterBar}
      <div class="sec-title">记录</div>${body}</div>`;
  // FAB 必须挂到 body：#screen 带 transform（页面切换动画 translateY(8px)->0），会成为
  // position:fixed 的包含块，使 FAB 相对 #screen 定位而跟随滚动，不再固定在视口底部
  document.querySelectorAll('body > .jn-fab').forEach(el => el.remove());
  if(m.type === 'note' && auth.canEdit(key)){
    document.body.insertAdjacentHTML('beforeend', `<button class="jn-fab" id="btn-add">${icon('plus',22,2.2)}</button>`);
  }

  // 列表懒加载：首屏 30 条，滚动到底的哨兵触发再追加 30 条（避免一次性渲染大量带图记录）
  const sentinel = document.getElementById("loadMoreSentinel");
  if(sentinel){
    if(!window.__listIO) window.__listIO = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          const k = en.target.dataset.key;
          _listWindow[k] = (_listWindow[k]||30) + 30;
          const y = window.scrollY;
          renderModule(k, true);
          window.scrollTo(0, y);
        }
      });
    }, { rootMargin: "120px" });
    window.__listIO.observe(sentinel);
  }

  // 筛选标签交互：重新渲染模块视图
  if(showFilter) {
    $("#screen").querySelectorAll(".filter-tab").forEach(tab => {
      tab.onclick = () => {
        _moduleFilter = tab.dataset.filter;
        renderModule(key);
      };
    });
  }
  wireModule(key);
  decorateNotes();
}

/* ---------- 记账小票：收支流水 / 分类占比 / 月度小结 ---------- */
function openReceipt(kind){
  const moneyMod = CONFIG.modules.find(m=>m.type==="finance");
  const key = moneyMod ? moneyMod.key : "money";
  const items = (data[key]||[]);
  const now = new Date();
  const dowArr=["周日","周一","周二","周三","周四","周五","周六"];
  const dow = dowArr[now.getDay()];
  const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  const weekNo = Math.ceil(((Date.now()-new Date(now.getFullYear(),0,1))/86400000 + new Date(now.getFullYear(),0,1).getDay())/7);
  const serial = "NO." + String(items.length).padStart(4,'0') + " · " + dateStr.replace(/\./g,'');
  const titleMap = { flow:"收支流水", cat:"分类占比", month:"月度小结" };
  const title = "二猫账本 · " + (titleMap[kind]||"账单");

  let body = "";
  if(kind==="flow"){
    const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const todayItems = items.filter(x => (x.date||'').slice(0,10) === today);
    const sorted=[...todayItems].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    body = `<div class="r-sec-title">今日流水</div>` + (sorted.length?sorted.map(x=>{
      const inc = x.type==="income";
      const amt = (inc?"+":"-") + "¥" + Number(x.amount||0).toFixed(2);
      const d = (x.date||'').slice(5).replace('-','/');
      return `<div class="r-row"><div class="r-item">${esc(x.title||x.category||'记录')}<small>${d}${x.category?(' · '+esc(x.category)):''}</small></div><span class="r-amt ${inc?'inc':'exp'}">${amt}</span></div>`;
    }).join('') : `<div class="r-row"><div class="r-item">今日还没有记账记录</div></div>`);
  } else if(kind==="cat"){
    const mapInc={}, mapExp={};
    items.forEach(x=>{ const c=x.category||'其他'; const a=+x.amount||0;
      if(x.type==="income") mapInc[c]=(mapInc[c]||0)+a; else mapExp[c]=(mapExp[c]||0)+Math.abs(a); });
    const incTotal=Object.values(mapInc).reduce((s,v)=>s+v,0);
    const expTotal=Object.values(mapExp).reduce((s,v)=>s+v,0);
    const incCats=Object.entries(mapInc).sort((a,b)=>b[1]-a[1]);
    const expCats=Object.entries(mapExp).sort((a,b)=>b[1]-a[1]);
    const renderBars=(cats,total,cls)=>cats.map(([c,v])=>{
      const pct=total?Math.round(v/total*100):0;
      return `<div class="r-bar-row ${cls}"><div class="r-bar-top"><span>${esc(c)}</span><span class="r-pct">¥${v.toFixed(2)} · ${pct}%</span></div><div class="r-bar"><i class="${cls}" style="width:${pct}%"></i></div></div>`;
    }).join('');
    let parts=[];
    if(incCats.length) parts.push(`<div class="r-sec-title inc">收入分类</div>` + renderBars(incCats,incTotal,'inc'));
    if(expCats.length) parts.push(`<div class="r-sec-title exp">支出分类</div>` + renderBars(expCats,expTotal,'exp'));
    body = parts.length?parts.join('') : `<div class="r-row"><div class="r-item">还没有分类数据</div></div>`;
  } else {
    const map={};
    items.forEach(x=>{ const mo=(x.date||'0000-00').slice(0,7); if(!mo||mo==='0000-00') return;
      map[mo]=map[mo]||{inc:0,exp:0}; if(x.type==="income") map[mo].inc+=+x.amount; else map[mo].exp+=+x.amount; });
    const months=Object.keys(map).sort().reverse();
    body = `<div class="r-sec-title">月度小结</div>` + (months.length?months.map(mo=>{
      const v=map[mo]; const bal=v.inc-v.exp;
      return `<div class="r-month"><div class="r-month-h">${mo.replace('-','/')}</div><div class="r-month-grid">
        <div class="r-cell"><div class="k">预算</div><div class="v">¥${v.inc.toFixed(2)}</div></div>
        <div class="r-cell exp"><div class="k">支出</div><div class="v">¥${v.exp.toFixed(2)}</div></div>
        <div class="r-cell bal"><div class="k">结余</div><div class="v">¥${bal.toFixed(2)}</div></div></div></div>`;
    }).join('') : `<div class="r-row"><div class="r-item">还没有月度数据</div></div>`);
  }

  // 猫咪贴纸位：默认存钱罐猫；用户已贴的装扮贴纸覆盖其上
  const placements = getStickerPlacements().filter(p=>p.cardId==="receipt");
  const stickerHTML = placements.length ? renderPlacedStickers("receipt") : `<img class="r-default-cat" src="assets/stickers/cat-piggy.png" alt="">`;
  if(placements.length) initStickerDrag();

  const overlay=document.createElement("div"); overlay.className="receipt-overlay";
  overlay.innerHTML = `<div class="receipt-sheet">
    <button class="receipt-close" aria-label="关闭">×</button>
    <div class="r-head"><span>${esc(title)}</span><span class="r-no">${serial}</span></div>
    <div class="r-date">${dateStr}<small>${dow} · 第 ${weekNo} 期</small></div>
    <div class="r-stamp"><span>已记账</span></div>
    <div class="r-dash"></div>
    ${body}
    <div class="r-sticker-zone">${stickerHTML}</div>
    <div class="receipt-footer">
      <div class="r-barcode"></div>
      <div class="r-voucher">记账凭证 ${serial}</div>
      <div class="r-slogan">记住每一笔 · 把日子过成糖</div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick=e=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector(".receipt-close").onclick=()=>overlay.remove();
}

function renderTimeline(items){
  const scheduled=items.filter(x=>x.time);
  if(!scheduled.length) return '';
  scheduled.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const marks=['06','09','12','15','18','21'];
  const labels=['上午','上午','中午','下午','傍晚','夜间'];
  const slots=marks.map((h,i)=>({h:parseInt(h),label:labels[i],next: i<marks.length-1?parseInt(marks[i+1]):24}));
  const groups=slots.map(s=>({slot:s,items:scheduled.filter(x=>{const hi=parseInt(x.time.split(':')[0]); return hi>=s.h&&hi<s.next;})}));
  const bars=groups.map(g=>{
    if(!g.items.length) return '';
    return `<div class="tl-group"><div class="tl-time"><span class="tl-h">${g.slot.h}:00</span><span class="tl-l">${g.slot.label}</span></div><div class="tl-tasks">${g.items.map(x=>{const p=x.priority||'P1'; return `<div class="tl-task ${x.done?'done':''} prio-${p}"><span class="tl-dot"></span><span class="tl-name">${esc(x.title)}</span><span class="tl-t">${esc(x.time)}</span></div>`;}).join('')}</div></div>`;
  }).join('');
  return `<div class="timeline"><div class="tl-title">时间轴</div>${bars}</div>`;
}

function recHTML(m,x){
  const canEdit = auth.canEdit(m.key);
  const creatorRole = resolveCreatorRole(x);
  const familyTag = creatorRole === "family" ? `<span class="badge family-badge">家属操作</span>` : '';
  const pin= canEdit ? `<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>` : '';
  const del= canEdit ? `<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>` : '';
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",14,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const recAttrs = `data-create-role="${creatorRole}"`;
  const layoutCls=`rec-layout-${layout}`;

  // note 模块：统一手账卡片（和纸胶带 + 回形针 PNG + 猫咪 PNG，无线圈）
  if(m.type==="note"){
    return journalNoteHTML(m,x,acts,recAttrs,familyTag,customBlock);
  }

  // feature layout: 大图在上 + 标题 + 正文 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 12px 12px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout (原有逻辑)
  if(m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    const fmtDate=x.date?x.date.replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1/$2/$3'):'';
    return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div>
      <div class="rmeta">${x.time?`<span class="badge" style="background:#e0ecf5;color:#4a6a8a"><span class="dot"></span>${esc(x.time)}</span>`:''}${fmtDate?`<span class="badge" style="background:#f0eee5;color:#8a7a5a"><span class="dot"></span>${esc(fmtDate)}</span>`:''}${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}${familyTag}</div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="checkin"){
    const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}${familyTag}</div>${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>${familyTag}</div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="finance"){
    const inc=x.type==="income";
    return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span><span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span>${familyTag}</div>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}" style="margin-left:auto">${inc?'+':'-'}¥${Number(x.amount).toFixed(2)}</div></div></div>`;
  }
  // notebook layout: 线本手账卡片（仅 note 类型）
  if(m.type==="note" && layout==='notebook'){
    const pic = x.image ? `<div class="nb-pic"><img src="${attr(x.image)}" alt=""></div>` : '';
    return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div data-edit="${x.id}" style="position:relative">
      <div class="nb-title">${esc(x.title||'无标题')}</div>
      <div class="nb-meta">${x.category?esc(x.category)+' · ':''}${x.mood?esc(x.mood)+' · ':''}${x.date||''}${familyTag}</div>
      ${x.content?`<div class="nb-body">${esc(x.content)}</div>`:''}
      ${pic}
      ${customBlock}</div></div>`;
  }
  // note
  return `<div class="rec ${layoutCls}" ${recAttrs}>${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.category?`<span class="badge" style="background:#eae6f2;color:#7b6ba8"><span class="dot"></span>${esc(x.category)}</span>`:''}${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span>${familyTag}</div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

/* ---------- 灵感备忘 · 手账卡片（和纸胶带 + 回形针 PNG + 猫咪 PNG，无线圈 / 无 SVG 图案） ---------- */
/* 稳定伪随机：同一条记录每次渲染角度一致，避免重渲染时贴纸"抖动" */
function noteHash(s){ let h=0; const t=String(s); for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))>>>0; } return h; }
function noteRot(seed, base, span){ return base + (noteHash(seed) % span); }

/* 分类 -> 猫咪 PNG + 摆放位置（bl 左下 / rm 右中 / br 右下 / none 不放猫） */
function noteCatPNG(cat, mood, id){
  const t = String(cat || '') + String(mood || '');   /* 分类与 mood 都参与匹配（复盘是 mood 不是分类） */
  if (t.indexOf('\u8bfb\u4e66') >= 0) return { src:'assets/stickers/cat-book.png', pos:'bl' };
  /* 市场观察：右上角与操作图标物理冲突，按约定不放猫咪贴纸，只留小装饰 */
  if (t.indexOf('\u5e02\u573a') >= 0 || t.indexOf('\u89c2\u5bdf') >= 0) return { src:null, pos:'none' };
  if (t.indexOf('\u7075\u611f') >= 0 || t.indexOf('\u901f\u8bb0') >= 0) return { src:'assets/stickers/cat-pencil.png', pos:'rm' };
  if (t.indexOf('\u590d\u76d8') >= 0) return { src:'assets/stickers/cat-study.png', pos:'br' };
  const others = ['assets/stickers/cat-wave.png','assets/stickers/cat-letter.png',
                  'assets/stickers/cat-dream.png','assets/stickers/cat-stars.png'];
  return { src: others[(Number(id)||0) % others.length], pos:'br' };
}

/* ---------- 灵感备忘 · weeks 时间轴条目（真实手账本 weeks 版式） ---------- */
function jnDayCol(d){
  if(!d) return `<div class="jn-wk-num">\u00b7\u00b7</div>`;
  const dt = new Date(d + 'T00:00:00');
  const en = ['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getDay()];
  return `<div class="jn-wk-num">${Number(d.slice(8,10))}</div><div class="jn-wk-en">${en}</div>`;
}
function jnWeekEntryHTML(m, x){
  const canEdit = auth.canEdit(m.key);
  const creatorRole = resolveCreatorRole(x);
  const familyTag = creatorRole === "family" ? `<span class="jn-wk-fam">\u5bb6\u5c5e</span>` : '';
  const pin = canEdit ? `<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="\u6536\u85cf">${icon("star",13)}</button>` : '';
  const del = canEdit ? `<button class="del js-del" data-id="${x.id}" title="\u5220\u9664">${icon("trash",13)}</button>` : '';
  const body = (x.content || x.note || '').trim();
  const flat = body.replace(/\n+/g, ' ').trim();
  const sum = flat ? (flat.length > 64 ? flat.slice(0, 64) + '\u2026' : flat) : '';
  const tags = [x.category, x.mood].filter(Boolean).slice(0,1).map(s=>`<span class="jn-wk-tag">${esc(s)}</span>`).join('');
  const stk = jnWeekStickerHTML(x);
  return `<div class="jn-wk-entry" data-note-open="${x.id}" data-note-key="${attr(m.key)}">`
    + `<span class="jn-wk-dot"></span>`
    + `<div class="jn-wk-main">`
      + `<div class="jn-wk-title">${esc(x.title || '\u65e0\u6807\u9898')}</div>`
      + (sum ? `<div class="jn-wk-sum">${esc(sum)}</div>` : '')
      + `<div class="jn-wk-meta">${tags}${familyTag}</div>`
    + `</div>`
    + `<div class="jn-wk-stickers">`
      + (x.image ? `<img class="jn-wk-thumb" src="${attr(x.image)}" alt="" loading="lazy">` : '')
      + stk
    + `</div>`
    + `<span class="jn-wk-acts">${pin}${del}</span></div>`;
}

/* 时间轴贴纸：优先用该笔记已选贴纸（stickerId），否则按 id 在系统贴纸里轮换，模拟手账随手贴 */
function jnWeekStickerHTML(x){
  const c = noteCatPNG(x.category, x.mood, Number(x.id) || 0);
  if(!c.src) return '';

function togglePin(key, id){
  const x = (data[key]||[]).find(i=>i.id==id); if(!x) return;
  x.pinned = !x.pinned; persist();
}

/* ---------- 灵感备忘 · 详情内页（点状线手账内页，无胶带/无回形针） ---------- */
/* 正文渲染：段落 + 荧光笔 mark（highlights 存子串数组，persist 同步云端） */
function noteRenderContent(x){
  const raw = String(x.content || x.note || '');
  let escd = esc(raw);
  const hls = (Array.isArray(x.highlights) ? x.highlights : [])
    .map(h => (typeof h === 'string') ? { t:h, c:'y' } : h);   /* 兼容旧版纯字符串标记 */
  hls.forEach(h => {
    const he = esc(String(h.t || ''));
    if (!he) return;
    escd = escd.split(he).join(`<mark class="jn-hl jn-hl-${h.c || 'y'}">${he}</mark>`);
  });
  return escd.split(/\n/).map(l => l.trim() ? `<p class="nd-p">${l}</p>` : '').join('');
}

function noteCalendarHTML(key, items){
  const today = isoToday();
  const d = new Date();
  const y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const startDay = first.getDay();
  const daysInMonth = last.getDate();
  const MEN = ['\u4e00\u6708','\u4e8c\u6708','\u4e09\u6708','\u56db\u6708','\u4e94\u6708','\u516d\u6708','\u4e03\u6708','\u516b\u6708','\u4e5d\u6708','\u5341\u6708','\u5341\u4e00\u6708','\u5341\u4e8c\u6708'];
  const WDS = ['\u65e5','\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d'];
  const moods = (data.__noteMoods || {});
  let grid = WDS.map(wd => `<div class="jn-cal-wd">${wd}</div>`).join('');
  for(let i=0;i<startDay;i++) grid += `<div class="jn-cal-day other"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = ds === today;
    const isFuture = ds > today;
    const mood = moods[ds];
    const cls = ['jn-cal-day', isToday?'today':'', ds===_noteSelDate?'sel':'', mood?'has-mood':'', isFuture?'future':''].filter(Boolean).join(' ');
    grid += `<div class="${cls}" data-cal-d="${ds}">${mood?`<img class="mood-corner" src="${mood.src}" alt="">`:day}</div>`;
  }
  const count = items.length;
  const todayN = items.filter(x=>x.date===today).length;
  return `<div class="jn-cal" data-module="${attr(key)}">
    <div class="jn-cal-hd"><div class="jn-cal-my">${y} · ${MEN[m]}</div><div class="jn-cal-count">${count} \u6761\u8bb0\u5f55 · \u4eca\u65e5 ${todayN} \u6761</div></div>
    <div class="jn-cal-grid">${grid}</div>
  </div>`;
}

function openNoteDetail(key, id, editing){
  const m = modOf(key);
  let rec;
  if(id == null){
    rec = newItem(m);
    rec.date = isoToday();
    rec.category = (m.categories && m.categories[0]) || '\u5176\u4ed6';
    rec.mood = '';
    if(!Array.isArray(rec.images)) rec.images = [];
    if(!Array.isArray(rec.stickers)) rec.stickers = [];
  } else {
    rec = (data[key]||[]).find(i=>i.id==id); if(!rec) return;
  }
  const canEdit = (typeof auth !== "undefined" && auth.canEdit) ? auth.canEdit(key) : true;
  const isEdit = !!(editing && canEdit);
  const overlay = document.createElement("div");
  overlay.className = "nd-overlay";
  overlay.setAttribute("role", "dialog");
  overlay.innerHTML = noteDetailHTML(key, rec, canEdit, isEdit);
  document.body.appendChild(overlay);
  let onSel = ()=>{};
  const close = ()=>{ overlay.remove(); document.removeEventListener("selectionchange", onSel); };
  overlay.addEventListener("click", e=>{ if(e.target===overlay) close(); });
  const back = overlay.querySelector("[data-nd='back']"); if(back) back.onclick = close;

  if(isEdit){
    /* ================= 编辑态（手账沉浸式：直接在页面上写） ================= */
    let curCat = rec.category || (m.categories && m.categories[0]) || '\u5176\u4ed6';
    let curMood = rec.mood || '';
    overlay.querySelectorAll("#nd-f-cat .opt").forEach(o=>o.onclick=()=>{
      overlay.querySelectorAll("#nd-f-cat .opt").forEach(x=>x.classList.remove("on"));
      o.classList.add("on"); curCat = o.dataset.v;
    });
    overlay.querySelectorAll("#nd-f-mood .opt").forEach(o=>o.onclick=()=>{
      const segEl = o.parentElement; const wasOn = o.classList.contains("on");
      segEl.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
      if(wasOn){ curMood = ""; } else { o.classList.add("on"); curMood = o.dataset.v; }
    });
    const ta = overlay.querySelector("#nd-f-content");
    const autoH = ()=>{ ta.style.height = "auto"; ta.style.height = Math.max(170, ta.scrollHeight + 4) + "px"; };
    ta.addEventListener("input", autoH); setTimeout(autoH, 60);

    /* 多图上传（自动压缩，上限 9 张） */
    let imgs = notePicsOf(rec).slice();
    const renderImgs = ()=>{
      const box = overlay.querySelector("#nd-imgs");
      box.innerHTML = imgs.map((p,i)=>`<div class="nd-img-cell"><img src="${attr(p)}" alt=""><button type="button" class="nd-img-del" data-pi="${i}">\u00d7</button></div>`).join("")
        + `<button type="button" class="nd-img-add" id="nd-add-img">\uff0b \u56fe\u7247</button>`;
      box.querySelector("#nd-add-img").onclick = ()=>overlay.querySelector("#nd-file").click();
      box.querySelectorAll(".nd-img-del").forEach(b=>b.onclick = ()=>{ imgs.splice(+b.dataset.pi, 1); renderImgs(); });
    };
    renderImgs();
    overlay.querySelector("#nd-file").onchange = e=>{
      const fs = [...(e.target.files||[])].slice(0, 9 - imgs.length);
      if(!fs.length){ alert("\u6700\u591a 9 \u5f20\u56fe\u7247\u54e6"); e.target.value=""; return; }
      let done = 0;
      fs.forEach(f=>{
        if(f.size > 6*1024*1024){ done++; return; }
        compressImageToDataURL(f, out=>{ if(out && imgs.length < 9) imgs.push(out); if(++done === fs.length) renderImgs(); });
      });
      e.target.value = "";
    };

    /* 藏品贴纸：贴入 / 拖拽 / 缩放 / 旋转 / 二次确认移除（只属于本条笔记，不动藏品库存） */
    const stkLayer = overlay.querySelector("#nd-stickers");
    const tools = overlay.querySelector("#ndstk-tools");
    let selIdx = null;
    const stks = ()=>{ if(!Array.isArray(rec.stickers)) rec.stickers = []; return rec.stickers; };
    const renderStk = ()=>{ stkLayer.innerHTML = noteStickersHTML(rec, true); wireStk(); };
    const selectStk = i=>{
      selIdx = i;
      stkLayer.querySelectorAll(".ndstk").forEach(el=>el.classList.toggle("sel", +el.dataset.si === i));
      tools.hidden = (i == null);
    };
    const wireStk = ()=>{
      stkLayer.querySelectorAll(".ndstk").forEach(el=>{
        el.addEventListener("pointerdown", ev=>{
          ev.preventDefault();
          selectStk(+el.dataset.si);
          const s = stks()[+el.dataset.si]; if(!s) return;
          const pageR = overlay.querySelector(".nd-page").getBoundingClientRect();
          const move = mv=>{
            const nx = Math.min(97, Math.max(3, ((mv.clientX - pageR.left) / pageR.width) * 100));
            const ny = Math.min(96, Math.max(3, ((mv.clientY - pageR.top) / pageR.height) * 100));
            s.x = Math.round(nx * 10) / 10; s.y = Math.round(ny * 10) / 10;
            el.style.left = s.x + "%"; el.style.top = s.y + "%";
          };
          const up = ()=>{ window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });
      });
    };
    renderStk();
    tools.querySelectorAll("button").forEach(b=>b.onclick = e=>{
      e.stopPropagation();
      if(selIdx == null) return;
      const s = stks()[selIdx]; if(!s) return;
      if(b.dataset.stk === "big") s.scale = Math.min(2.5, (s.scale || 1) + 0.15);
      else if(b.dataset.stk === "small") s.scale = Math.max(0.4, (s.scale || 1) - 0.15);
      else if(b.dataset.stk === "rot") s.rot = Math.round(((s.rot || 0) + 8) % 360);
      else if(b.dataset.stk === "del"){
        const nm = (ALL_SHOP_ITEMS[s.item] || {}).name || "\u8be5\u8d34\u7eb8";
        showConfirm("\u79fb\u9664\u8d34\u7eb8", `\u786e\u8ba4\u79fb\u9664\u300c${nm}\u300d\u5417\uff1f`, ()=>{
          stks().splice(selIdx, 1); selIdx = null; tools.hidden = true; renderStk();
        });
        return;
      }
      renderStk(); selectStk(selIdx);
    });
    overlay.querySelector("[data-nd='stickers']").onclick = e=>{
      e.stopPropagation();
      let owned = [];

        <div class="modal-actions"><button class="btn ghost" id="pnl-close">\u5173\u95ed</button></div></div>`;

        stks().push({ item: b2.dataset.item, x: 50, y: 38, rot: Math.round(-6 + Math.random()*12), scale: 1 });
        pnl.remove(); renderStk();
      });
    };
    /* 保存 / 取消 */
    overlay.querySelector("[data-nd='save']").onclick = ()=>{
      rec.title = (overlay.querySelector("#nd-f-title").value || "").trim() || "\u672a\u547d\u540d";
      rec.content = (overlay.querySelector("#nd-f-content").value || "").trim();
      rec.category = curCat; rec.mood = curMood;
      rec.date = (overlay.querySelector("#nd-f-date").value || "").trim() || isoToday();
      rec.images = imgs;
      if(id == null){
        (data[key] = data[key] || []).unshift(rec);
        rec.createUserId = auth.session ? auth.session.userId : 0;
        rec.createRole = auth.session ? auth.session.role : "admin";
        rec.createdBy = auth.isFamily() ? "family" : "admin";
      }
      persist();
      overlay.remove(); document.removeEventListener("selectionchange", onSel);
      openNoteDetail(key, rec.id, false);
    };
    overlay.querySelector("[data-nd='cancel']").onclick = ()=>{
      overlay.remove(); document.removeEventListener("selectionchange", onSel);
      if(id != null) openNoteDetail(key, id, false);
    };
  } else {
    /* ================= 查看态 ================= */
    const content = overlay.querySelector(".nd-content");
    const del = overlay.querySelector("[data-nd='del']");
    if(del) del.onclick = ()=>{ confirmDelete(key, id); close(); };
    const edit = overlay.querySelector("[data-nd='edit']");
    if(edit) edit.onclick = ()=>{ close(); openNoteDetail(key, id, true); };
    const pin = overlay.querySelector("[data-nd='pin']");
    if(pin) pin.onclick = ()=>{
      togglePin(key, id);
      const cur = (data[key]||[]).find(i=>i.id==id);
      pin.classList.toggle("on", !!(cur && cur.pinned));
    };
    /* 划重点（查看态）：三色浮层 + 取消高亮 */
    const chip = document.createElement("div");
    chip.className = "nd-hlchip";
    chip.innerHTML = `<button type="button" class="sw sw-y" data-c="y" title="\u6d45\u9ec4"></button>`
      + `<button type="button" class="sw sw-p" data-c="p" title="\u6d45\u7c89"></button>`
      + `<button type="button" class="sw sw-g" data-c="g" title="\u6d45\u7eff"></button>`
      + `<button type="button" class="nd-hl-off">\u53d6\u6d88\u9ad8\u4eae</button>`;
    overlay.appendChild(chip);
    const offBtn = chip.querySelector(".nd-hl-off");
    let selText = "";
    const norm = h => (typeof h === 'string') ? { t:h, c:'y' } : h;
    const hideChip = ()=>{ chip.classList.remove("on"); selText = ""; offBtn.style.display = "none"; };
    const curHls = ()=>{ const r=(data[key]||[]).find(i=>i.id==id); return r && Array.isArray(r.highlights) ? r.highlights.map(norm) : []; };
    const rerender = ()=>{
      const fresh = (data[key]||[]).find(ii=>ii.id==id);
      if(content) content.innerHTML = noteRenderContent(fresh) + notePicsOf(fresh).map(p=>`<img class="nd-pic" src="${attr(p)}" alt="">`).join("");
    };
    const showChip = ()=>{
      const sel = window.getSelection();
      if(!sel || sel.rangeCount === 0) return hideChip();
      const txt = String(sel).trim();
      if(!txt || txt.length > 80 || !content) return hideChip();
      const range = sel.getRangeAt(0);
      if(!content.contains(range.commonAncestorContainer)) return hideChip();
      const rect = range.getBoundingClientRect();
      if(!rect || (rect.width === 0 && rect.height === 0)) return hideChip();
      const or = overlay.getBoundingClientRect();
      selText = txt;
      offBtn.style.display = curHls().some(h => h.t === txt) ? "" : "none";
      chip.classList.add("on");
      chip.style.left = Math.max(10, Math.min(or.width - 150, rect.left - or.left + rect.width/2 - 70)) + "px";
      chip.style.top = Math.max(8, rect.top - or.top - 44) + "px";
    };
    onSel = ()=>{ const s=window.getSelection(); (s && String(s).trim()) ? showChip() : hideChip(); };
    document.addEventListener("selectionchange", onSel);
    if(content){
      content.addEventListener("mouseup", showChip);
      content.addEventListener("touchend", ()=>setTimeout(showChip, 60));
    }
    chip.addEventListener("mousedown", e=>e.preventDefault());
    const applyHl = c=>{
      if(!selText) return;
      const r = (data[key]||[]).find(i=>i.id==id); if(!r) return;
      const hls = curHls();
      const i = hls.findIndex(h=>h.t===selText);
      if(i >= 0) hls[i].c = c; else hls.push({ t:selText, c:c });
      r.highlights = hls;
      persist(); rerender(); hideChip();
    };
    chip.querySelectorAll(".sw").forEach(sw => sw.onclick = e=>{ e.stopPropagation(); applyHl(sw.dataset.c); });
    offBtn.onclick = e=>{
      e.stopPropagation();
      if(!selText) return;
      const r = (data[key]||[]).find(i=>i.id==id); if(!r) return;
      r.highlights = curHls().filter(h=>h.t!==selText);
      persist(); rerender(); hideChip();
    };
    overlay.addEventListener("mousedown", e=>{ if(!chip.contains(e.target) && !(content && content.contains(e.target))) hideChip(); });
  }
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{

      else { x.done=false; }

  const add=$("#btn-add"); if(add) add.onclick=()=>{ const am=modOf(key); if(am && am.type==='note'){ openNoteDetail(key, null, true); } else { openEditor(key,null); } };
  if(m.type==="note"){

  // 记账三张小票入口
  $("#screen").querySelectorAll(".jn-receipt-open").forEach(el=>el.onclick=()=>openReceipt(el.dataset.receipt));
}

// 图片上传压缩：最长边 ≤1024px、JPEG 0.82；>300KB 自动降档（1024→800→640），仍超限提示换图
function compressImageToDataURL(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let maxDim=1024, q=0.82;
      const render=()=>{
        const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        const out=c.toDataURL("image/jpeg",q);
        if(out.length>400*1024 && maxDim>640){ maxDim=maxDim===1024?800:640; q=0.8; render(); }
        else if(out.length>400*1024){ alert("图片太大，单张请控制在 300KB 内，换一张更小的吧～"); cb(null); }
        else cb(out);
      };
      render();
    };
    img.onerror=()=>{ alert("图片读取失败"); cb(null); };
    img.src=reader.result;
  };
  reader.onerror=()=>{ alert("图片读取失败"); cb(null); };
  reader.readAsDataURL(file);
}

function openEditor(key, item){

  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="frow"><div class="field" style="flex:1"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field" style="flex:0 0 130px"><label>计划时间</label><input id="f-time" type="time" value="${attr(d.time||'')}" style="font-size:15px"/></div></div>
      <div class="field"><label>计划日期</label><input id="f-date" type="date" value="${attr(d.date||isoToday())}" style="font-size:15px"/></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;

    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在列表点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">预算</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.categories&&m.categories.length)?`<div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${m.categories.map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>`:''}
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }

  // custom fields (from m.fields config) — rendered after type-specific fields

    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image field (URL 输入 + 本地上传压缩，二选一)
  fields+=`<div class="field"><label>图片（可选）</label>

      <button type="button" class="btn" id="f-upload-img">上传图片（自动压缩）</button>
      <input type="file" id="f-upload-input" accept="image/*" hidden>
      <span id="f-upload-tip" style="font-size:11px;color:var(--text-tertiary)"></span>
    </div></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  // 本地图片上传：FileReader + canvas 压缩（照抄头像上传实现，最长边 1024、自动降档、上限 ~300KB）
  const upBtn=overlay.querySelector("#f-upload-img");
  const upInput=overlay.querySelector("#f-upload-input");
  const upTip=overlay.querySelector("#f-upload-tip");
  if(upBtn && upInput) upBtn.onclick=()=>upInput.click();
  if(upInput) upInput.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(f.size>6*1024*1024){ alert("图片超过 6MB，请换一张更小的～"); upInput.value=""; return; }
    compressImageToDataURL(f, out=>{
      if(!out) { upInput.value=""; return; }
      const inp=overlay.querySelector("#f-image"); if(inp) inp.value=out;
      if(upTip) upTip.textContent="已压缩至约 " + Math.max(1,Math.round(out.length*0.75/1024)) + "KB";
    });
  };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); d.time=val("#f-time")||""; d.date=val("#f-date")||isoToday(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    const wasNew = !editing;
    if(wasNew) {
      (data[key]=data[key]||[]).unshift(d);
      // mark creator info
      d.createUserId = auth.session ? auth.session.userId : 0;
      d.createRole = auth.session ? auth.session.role : "admin";
      d.createdBy = auth.isFamily() ? "family" : "admin";
    }
    if(wasNew && m.type==="finance") { d._candySettled = true; candy.awardFinance(d.title || d.category || "记账记录", d.id); }
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:"", time:"", date:isoToday()};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", category:(m.categories&&m.categories[0])||"其他", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>

    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
