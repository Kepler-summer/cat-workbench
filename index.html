/* ---------- 通用二次确认弹窗（与 confirmDelete / confirmCalUncheck 同构） ---------- */
function showConfirm(title,msg,onOk){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>${esc(title)}</h2>
    <div class="sub">${esc(msg)}</div>
    <div class="modal-actions"><button class="btn ghost" id="sc-cancel">取消</button><button class="btn danger" id="sc-ok">确定</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#sc-cancel").onclick=close;
  // 先关弹窗再执行回调，避免回调内 render() 后弹窗残留
  overlay.querySelector("#sc-ok").onclick=()=>{ close(); if(onOk) onOk(); };
}

/* ---------- change password ---------- */
function openChangePassword(){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <div class="modal-cat"><img src="assets/nav-ci-ke.png" alt=""></div>
    <h2>修改登录密码</h2>
    <div class="sub">只改当前登录账号的密码，不会退出登录喵～</div>
    <div class="auth-field"><input type="password" id="cp-old" placeholder="原密码" autocomplete="current-password"></div>
    <div class="auth-field"><input type="password" id="cp-new" placeholder="新密码（至少 4 位）" autocomplete="new-password"></div>
    <div class="auth-field"><input type="password" id="cp-confirm" placeholder="再输入一次新密码" autocomplete="new-password"></div>
    <div class="auth-err" id="cp-err"></div>
    <div class="modal-actions"><button class="btn ghost" id="cp-cancel" style="background:var(--surface-nested);color:var(--text)">取消</button><button class="btn" id="cp-ok" style="background:var(--accent)">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cp-cancel").onclick=close;
  const okBtn = overlay.querySelector("#cp-ok");
  const oldIn = overlay.querySelector("#cp-old");
  const newIn = overlay.querySelector("#cp-new");
  const confIn = overlay.querySelector("#cp-confirm");
  const errEl = overlay.querySelector("#cp-err");

  const validate = () => {
    const o = oldIn.value, n = newIn.value, c = confIn.value;
    if(!o || !n || !c){ errEl.textContent = "请填写全部密码"; return false; }
    if(n.length < 4){ errEl.textContent = "新密码至少 4 位"; return false; }
    if(n !== c){ errEl.textContent = "两次新密码不一致"; return false; }
    errEl.textContent = "";
    return true;
  };
  [oldIn, newIn, confIn].forEach(el => el.oninput = validate);

  okBtn.onclick = async () => {
    if(!validate()) return;
    okBtn.textContent = "处理中...";
    okBtn.disabled = true;
    const r = await auth.changePassword(oldIn.value, newIn.value);
    okBtn.textContent = "保存";
    okBtn.disabled = false;
    if(r.error){
      errEl.textContent = r.error;
      errEl.style.color = "";
      return;
    }
    errEl.textContent = "✅ 密码已修改";
    errEl.style.color = "var(--ok)";
    setTimeout(close, 900);
  };
}

/* ---------- router / nav ---------- */
function go(v){ view=v; closeDrawer(); render(); window.scrollTo({top:0}); }
function render(){
  // 手账主题全局应用 — 统一韩系手账视觉风格
  document.body.classList.add("journal-theme");

  // permission check: family can only access note
  if(auth.session && !auth.canAccess(view)) {
    view = "note";
  }
  // top title（顶栏只保留标题；首页标题置空，由欢迎栏右上角「二猫 + slogan」承担）
  if(view==="home"){ $("#topTitle").childNodes[0].textContent=""; }
  else if(view==="game"){ $("#topTitle").childNodes[0].textContent="糖果小铺"; }
  else if(view==="users"){ $("#topTitle").childNodes[0].textContent="用户管理"; }
  else { const m=modOf(view); $("#topTitle").childNodes[0].textContent=m?m.name:"我的工作台"; }
  $(".app").classList.toggle("home-view", view === "home");
  // 日期：首页只显示 M/D，其它视图显示 M/D 周x
  const nowDate = new Date();
  const wd = "日一二三四五六"[nowDate.getDay()];
  const dateText = `${nowDate.getMonth()+1}/${String(nowDate.getDate()).padStart(2,'0')}`;
  $("#dateChip").innerHTML = `${icon("calendar",13)} ${view==="home" ? dateText : dateText + " 周" + wd}`;
  // nav active (family sees all nav items too)
  const navItems = ["home","money","todo","note"];
  navItems.forEach(k => {
    const el = $("#nav").querySelector(`[data-nav="${k}"]`);
    if(!el) return;
    el.classList.toggle("active", view === k);
  });
  // render body
  document.querySelectorAll('body > .jn-fab').forEach(el => el.remove()); // 切走时清掉悬浮按钮
  if(view==="home") renderHome();
  else if(view==="game") renderGame();
  else if(view==="users") renderUsers();
  else renderModule(view);
  // page transition fade-in
  const screen=$("#screen");
  if(screen){ screen.style.opacity="0"; screen.style.transform="translateY(8px)";
    requestAnimationFrame(()=>{ screen.style.transition="opacity .2s ease-out, transform .2s ease-out";
      screen.style.opacity="1"; screen.style.transform="translateY(0)";
      setTimeout(()=>{ screen.style.transition=""; },250);
    });
  }
  initStickerDrag();
}

/* ---------- drawer ---------- */
function buildDrawer(){
  $("#drawerName").textContent = auth.session ? auth.session.username : CONFIG.owner;
  $("#drawerSlogan").textContent = CONFIG.slogan;
  const items = [`<div class="ditem" data-go="home">${icon("home",20)}首页</div>`];
  // 全部角色可见：5 个业务模块（其中习惯打卡 / 长期目标为抽屉唯一入口，不可删）
  items.push(...CONFIG.modules.map(m=>`<div class="ditem" data-go="${m.key}">${icon(m.icon,20)}${m.name}</div>`));
  items.push(`<div class="ditem" data-go="game">${icon("star",20)}糖果小铺</div>`);
  // 已登录即可见：用户管理（页内已含「修改密码」，故抽屉不再单独重复该入口）
  // 注：页内的删除 / 审批 / 改组名等功能均有 admin 守卫，家属进入不会越权
  if(auth.isLoggedIn()) {
    items.push(`<div class="ditem" data-go="users">${icon("user",20)}用户管理</div>`);
  }
  $("#drawerList").innerHTML = items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===view));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ---------- wire chrome ---------- */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else go(t);
});

$("#brandCam").innerHTML = icon("camera",18);
function refreshDrawerAvatar(){
  try{
    if(typeof auth==="undefined"||!auth.session) return;
    const uid = auth.session.userId;
    const userAv = (data.__userAvatars||{})[uid];
    const legacyAv = data.__avatar;
    const src = userAv || legacyAv;
    if(src) $("#brandImg").src = src;
  }catch(_){}
}
// 当前登录用户的头像：优先 per-user 头像，其次旧版全局头像，都没有返回空串
function currentUserAvatar(){
  try{
    if(typeof auth==="undefined"||!auth.session) return "";
    const uid = auth.session.userId;
    return (data.__userAvatars||{})[uid] || data.__avatar || "";
  }catch(_){ return ""; }
}
$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const size = 200; canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, size, size);
      const resized = canvas.toDataURL("image/jpeg", 0.85);
      data.__avatar = resized;
      const uid = auth.session?.userId;
      if(uid){ if(!data.__userAvatars) data.__userAvatars = {}; data.__userAvatars[uid] = resized; }
      $("#brandImg").src = resized; store.save();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
  e.target.value = "";
};

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

// buildDrawer() and render() are called by bootstrap() after auth is ready

/* ============================================================
   AUTH SYSTEM — 用户管理模块
   ============================================================ */
const auth = {
  session: null,

  async hash(password) {
    const enc = new TextEncoder().encode(password + "__cat_salt_2026__");
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  },

  restore() {
    try {
      const raw = localStorage.getItem("__cat_session");
      if(raw) { this.session = JSON.parse(raw); return true; }
    } catch(e){}
    return false;
  },

  saveSession(s) { this.session = s; localStorage.setItem("__cat_session", JSON.stringify(s)); },
  clearSession() { this.session = null; localStorage.removeItem("__cat_session"); },

  isAdmin() { return this.session && this.session.role === "admin"; },
  isFamily() { return this.session && this.session.role === "family"; },
  isLoggedIn() { return !!this.session; },

  canAccess(view) {
    if(!this.session) return false;
    if(this.isAdmin()) return true;
    return true;
  },
  // family can edit: note, money, todo, goal; cannot edit: checkin, game(redeem), users
  canEdit(moduleKey) {
    if(!this.session) return false;
    if(this.isAdmin()) return true;
    if(this.isFamily()) {
      return ["note", "money", "todo", "goal"].includes(moduleKey);
    }
    return false;
  },

  storageKey() {
    if(!this.session) return CONFIG.storageKey;
    return CONFIG.storageKey + "-u" + this.session.userId;
  },
  // 分组业务 key（同组共享）
  businessStorageKey() {
    if(!this.session || !this.session.groupId) return CONFIG.storageKey + "-default";
    return CONFIG.storageKey + "-g" + this.session.groupId;
  },
  // 个人游戏 key
  gameStorageKey() {
    if(!this.session) return CONFIG.storageKey;
    return CONFIG.storageKey + "-u" + this.session.userId;
  },
  // 旧版 per-user key（用于迁移）
  legacyUserKey() {
    if(!this.session) return CONFIG.storageKey;
    return CONFIG.storageKey + "-u" + this.session.userId;
  },

  /* ---------- Groups ---------- */

  async fetchGroups() {
    if(!store.sb) return [];
    try {
      const { data: rows, error } = await store.sb.from("workbench_groups").select("*").order("created_at",{ascending:true});
      if(error) { console.warn("fetchGroups error:", error); return []; }
      return rows || [];
    } catch(e) { return []; }
  },

  async createGroup(name) {
    if(!store.sb) return { error: "数据库未连接" };
    try {
      const { data: insData, error: insErr } = await store.sb.from("workbench_groups").insert({ name }).select();
      if(insErr) return { error: "创建分组失败: " + insErr.message };
      return { ok: true, group: insData[0] };
    } catch(e) { return { error: "创建分组失败" }; }
  },

  async deleteGroup(groupId) {
    if(!store.sb) return { error: "数据库未连接" };
    try {
      const { error } = await store.sb.from("workbench_groups").delete().eq("id", groupId);
      if(error) return { error: "删除分组失败: " + error.message };
      return { ok: true };
    } catch(e) { return { error: "删除分组失败" }; }
  },

  /* ---------- Users ---------- */

  async fetchUsers() {
    if(!store.sb) return [];
    try {
      const { data: rows, error } = await store.sb.from("workbench_users").select("*").order("created_at",{ascending:true});
      if(error) { console.warn("fetchUsers error:", error); return []; }
      return rows || [];
    } catch(e) { return []; }
  },

  async fetchApprovedUsers() {
    const users = await this.fetchUsers();
    return users.filter(u => !u.apply_status || u.apply_status === "approved");
  },

  async getApprovedCount() {
    const approved = await this.fetchApprovedUsers();
    return approved.length;
  },

  async fetchGroupUsers(groupId) {
    const users = await this.fetchUsers();
    return users.filter(u => u.group_id === groupId && u.apply_status === "approved");
  },

  async fetchPendingApplications(groupId) {
    const users = await this.fetchUsers();
    return users.filter(u => u.group_id === groupId && u.apply_status === "pending");
  },

  async getGroupMembersCount(groupId) {
    const members = await this.fetchGroupUsers(groupId);
    return members.length;
  },

  async hasAdminInGroup(groupId) {
    const members = await this.fetchGroupUsers(groupId);
    return members.some(u => u.role === "admin");
  },

  async hasFamilyInGroup(groupId) {
    const members = await this.fetchGroupUsers(groupId);
    return members.some(u => u.role === "family");
  },

  /* ---------- Register / Login ---------- */

  async register(username, password, role, groupId) {
    if(!store.sb) return { error: "数据库未连接" };
    if(!username || !password) return { error: "请填写用户名和密码" };

    const users = await this.fetchUsers();
    if(users.some(u=>u.username === username)) return { error: "用户名已存在" };

    // Check global quota (only approved users count)
    const approvedCount = users.filter(u => !u.apply_status || u.apply_status === "approved").length;
    if(approvedCount >= CONFIG.maxUsers) return { error: `账号数量已满（最多 ${CONFIG.maxUsers} 个）` };

    const hash = await this.hash(password);

    if(role === "admin") {
      // Admin registration: create a new group + admin user
      // Check if adding one more admin group would exceed max users
      // Each admin adds at least 1 user (themselves), potentially 2 with family
      if(approvedCount + 1 > CONFIG.maxUsers) return { error: `账号数量已满（最多 ${CONFIG.maxUsers} 个）` };

      // Generate group name from username
      const groupName = username + "的小组";
      const gr = await this.createGroup(groupName);
      if(gr.error) return { error: gr.error };

      const { data: insData, error: insErr } = await store.sb.from("workbench_users").insert({
        username, password_hash: hash, role,
        group_id: gr.group.id, apply_status: "approved"
      }).select();
      if(insErr) {
        // Rollback: delete the group we just created
        await this.deleteGroup(gr.group.id);
        return { error: "注册失败: " + insErr.message };
      }
      const u = insData[0];
      this.saveSession({ userId: u.id, username: u.username, role: u.role, groupId: u.group_id });
      return { ok: true, user: u };

    } else {
      // Family registration: apply to join an existing group
      if(!groupId) return { error: "请选择要加入的分组" };

      // Check if group already has a family member
      const hasFamily = await this.hasFamilyInGroup(groupId);
      if(hasFamily) return { error: "该分组已有家属，无法再加入" };

      const { data: insData, error: insErr } = await store.sb.from("workbench_users").insert({
        username, password_hash: hash, role,
        group_id: groupId, apply_status: "pending"
      }).select();
      if(insErr) return { error: "申请提交失败: " + insErr.message };
      // Family user is NOT logged in after applying - they must wait for approval
      return { ok: true, user: insData[0], pending: true };
    }
  },

  async login(username, password) {
    if(!store.sb) return { error: "数据库未连接" };
    const hash = await this.hash(password);
    try {
      const { data: rows, error } = await store.sb.from("workbench_users").select("*").eq("username", username).limit(1);
      if(error) {
        console.error("Supabase login error:", error);
        const errMsg = (error.message || "").toLowerCase();
        if(errMsg.includes("jwt") || errMsg.includes("apikey") || errMsg.includes("invalid") || errMsg.includes("unauthorized")) {
          return { error: "接口鉴权失败，请检查 Supabase 密钥或网络" };
        }
        return { error: "无法连接数据库，请检查网络后重试" };
      }
      if(!rows || !rows.length) return { error: "该账号不存在，请检查用户名" };
      const u = rows[0];
      if(u.password_hash !== hash) return { error: "密码错误，请重新输入" };
      // Family users can only log in if approved
      if(u.role === "family" && u.apply_status && u.apply_status !== "approved") {
        if(u.apply_status === "pending") return { error: "申请待审批中，请等待管理员同意" };
        if(u.apply_status === "rejected") return { error: "您的加入申请已被驳回" };
        return { error: "账号状态异常" };
      }
      this.saveSession({ userId: u.id, username: u.username, role: u.role, groupId: u.group_id });
      return { ok: true, user: u };
    } catch(e) { return { error: "登录失败: " + e.message }; }
  },

  async changePassword(oldPassword, newPassword) {
    if(!store.sb) return { error: "数据库未连接" };
    if(!this.isLoggedIn()) return { error: "请先登录" };
    if(!oldPassword || !newPassword) return { error: "请填写原密码和新密码" };
    if(newPassword.length < 4) return { error: "新密码至少 4 位" };
    try {
      const oldHash = await this.hash(oldPassword);
      const { data: rows, error: fetchErr } = await store.sb.from("workbench_users").select("*").eq("id", this.session.userId).limit(1);
      if(fetchErr) return { error: "无法连接数据库，请检查网络后重试" };
      if(!rows || !rows.length) return { error: "账号不存在" };
      const u = rows[0];
      if(u.password_hash !== oldHash) return { error: "原密码不正确" };
      const newHash = await this.hash(newPassword);
      const { data: updated, error: updErr } = await store.sb.from("workbench_users")
        .update({ password_hash: newHash })
        .eq("id", this.session.userId)
        .select();
      if(updErr) return { error: "密码修改失败: " + updErr.message };
      if(!updated || !updated.length) return { error: "密码修改未生效" };
      return { ok: true };
    } catch(e) { return { error: "修改密码失败: " + e.message }; }
  },

  /* ---------- Approval ---------- */

  async approveApplication(userId) {
    if(!store.sb) return { error: "数据库未连接" };
    if(!this.isAdmin()) return { error: "只有管理员可以审批" };

    // Check quota before approving
    const approvedCount = await this.getApprovedCount();
    if(approvedCount >= CONFIG.maxUsers) return { error: `账号数量已满（最多 ${CONFIG.maxUsers} 个）` };

    try {
      const { data, error } = await store.sb.from("workbench_users")
        .update({ apply_status: "approved" })
        .eq("id", userId)
        .select();
      if(error) return { error: "审批失败: " + error.message };
      return { ok: true, user: data[0] };
    } catch(e) { return { error: "审批失败" }; }
  },

  async rejectApplication(userId) {
    if(!store.sb) return { error: "数据库未连接" };
    if(!this.isAdmin()) return { error: "只有管理员可以审批" };
    try {
      const { data, error } = await store.sb.from("workbench_users")
        .update({ apply_status: "rejected" })
        .eq("id", userId)
        .select();
      if(error) return { error: "驳回失败: " + error.message };
      return { ok: true, user: data[0] };
    } catch(e) { return { error: "驳回失败" }; }
  },

  /* ---------- Delete User ---------- */

  async deleteUser(userId) {
    if(!store.sb) return { error: "数据库未连接" };
    try {
      // First get the user to check role and group
      const { data: userRows, error: fetchErr } = await store.sb.from("workbench_users")
        .select("*").eq("id", userId).limit(1);
      if(fetchErr || !userRows || !userRows.length) return { error: "用户不存在" };
      const user = userRows[0];

      // delete user's workbench data
      const userKey = CONFIG.storageKey + "-u" + userId;
      await store.sb.from("workbench_data").delete().eq("storage_key", userKey);

      // delete user
      const { error } = await store.sb.from("workbench_users").delete().eq("id", userId);
      if(error) return { error: "删除失败: " + error.message };

      // If admin was deleted, also delete the group (and reject/delete pending apps)
      if(user.role === "admin" && user.group_id) {
        // Delete remaining users in the group (family members, pending apps, etc.)
        const remaining = await this.fetchUsers();
        for(const u of remaining) {
          if(u.group_id === user.group_id) {
            const uKey = CONFIG.storageKey + "-u" + u.id;
            await store.sb.from("workbench_data").delete().eq("storage_key", uKey);
            await store.sb.from("workbench_users").delete().eq("id", u.id);
          }
        }
        // Delete the group
        await this.deleteGroup(user.group_id);
      }

      return { ok: true };
    } catch(e) { return { error: "删除失败: " + e.message }; }
  },

  /* ---------- Legacy Migration ---------- */

  // Migrate old users (without group_id) into a single group
  async migrateLegacyUsers() {
    if(!store.sb) return { migrated: false, reason: "no db" };
    try {
      const users = await this.fetchUsers();
      const legacyUsers = users.filter(u => u.group_id === null || u.group_id === undefined);

      if(legacyUsers.length === 0) return { migrated: false, reason: "already migrated" };

      // Create a default group
      const gr = await this.createGroup("初始分组");
      if(gr.error) return { migrated: false, reason: gr.error };

      // Assign all legacy users to this group with approved status
      for(const u of legacyUsers) {
        await store.sb.from("workbench_users")
          .update({ group_id: gr.group.id, apply_status: "approved" })
          .eq("id", u.id);
      }

      // If current session user is a legacy user, update session with groupId
      if(this.session && legacyUsers.some(u => u.id === this.session.userId)) {
        this.session.groupId = gr.group.id;
        this.saveSession(this.session);
      }

      return { migrated: true, groupId: gr.group.id, userCount: legacyUsers.length };
    } catch(e) {
      console.warn("Legacy migration error:", e);
      return { migrated: false, reason: e.message };
    }
  },

  logout() {
    this.clearSession();
    location.reload();

function getCatLevelInfo(catLevel) {
  const lvl = Math.max(1, Math.min(50, catLevel));
  const current = CAT_LEVELS[lvl - 1];
  const next = CAT_LEVELS[Math.min(49, lvl)]; // lvl up to 50, next index 49
  return {
    level: lvl,
    name: current.name,
    icon: current.icon,
    title: current.title,
    nextName: lvl >= 50 ? "已满级" : next.name,
    nextIcon: lvl >= 50 ? current.icon : next.icon,
    isMax: lvl >= 50,
  };
}

function getLevelItemPrice(item) {
  const curLevel = candy.catLevel();
  const coefficient = item.id === "milkCake" ? 50 : 120;
  return item.basePrice + curLevel * coefficient;
}

// 获取道具已使用次数
function getLevelItemUses(itemId) {
  if(!data.__levelItemUses) data.__levelItemUses = {};
  return data.__levelItemUses[itemId] || 0;
}

// 检查道具是否还能购买
function canBuyLevelItem(itemId) {
  const item = LEVEL_ITEMS[itemId];
  if(!item) return true;
  return getLevelItemUses(itemId) < item.maxUses;
}

// 全部商品索引
const ALL_SHOP_ITEMS = { ...BUFF_ITEMS, ...TOY_ITEMS, ...OUTFIT_ITEMS, ...LEVEL_ITEMS, ...MEMORIAL_ITEMS };
// 日历印记「我的贴纸」口径：仅藏品（玩具/装扮/情怀），排除增益道具与食物
const STICKER_COLLECTION = { ...TOY_ITEMS, ...OUTFIT_ITEMS, ...MEMORIAL_ITEMS };

// 糖币系统
const candy = {
  // 总糖币（只增不减）
  total() {
    return (data.__candyLog || []).reduce((s, x) => s + x.amount, 0);
  },

  // 累计获得糖币（用于等级计算）
  totalEarned() {
    return (data.__candyLog || [])
      .filter(x => x.amount > 0)
      .reduce((s, x) => s + x.amount, 0);
  },

  // 糖币流水
  log() { return data.__candyLog || []; },

  // 添加糖币记录（正向）
  _add(amount, type, description, refId) {
    if(!data.__candyLog) data.__candyLog = [];
    data.__candyLog.unshift({
      id: Date.now() + Math.random(),
      type, amount: Math.abs(amount), description,
      time: new Date().toISOString(),
      refId: refId || null
    });
    window.__candyJustChanged = true;
    // 检查升级
    this._checkLevelUp();
    // 检查称号解锁
    this._checkTitleUnlock();
  },

  // ========== 永久增益 ==========
  getPermanentBonus() {
    return data.__permanentBonus || 1.0;
  },
  setPermanentBonus(mult) {
    data.__permanentBonus = mult;
  },

  // ========== Buff 系统 ==========
  // 获取当前生效的最高倍率 buff（包含永久增益基础倍率 + 限时Buff取最高）
  getActiveBuff() {
    const permBonus = this.getPermanentBonus();
    let bestMult = permBonus;
    let bestBuff = null;
    let bestExpire = 0;

    if(data.__activeBuffs && data.__activeBuffs.length > 0) {
      const now = Date.now();
      for(const b of data.__activeBuffs) {
        if(b.expireAt > now) {
          const cfg = BUFF_ITEMS[b.buffId];
          if(cfg && cfg.multiplier > bestMult) {
            bestMult = cfg.multiplier;
            bestBuff = cfg;
            bestExpire = b.expireAt;
          }
        }
      }
      // 清理过期 buff
      data.__activeBuffs = data.__activeBuffs.filter(b => b.expireAt > now);
    }

    // 如果只有永久增益
    if(!bestBuff && permBonus > 1) {
      return { id: "permanent", name: "永久加成", icon: "星", multiplier: permBonus, expireAt: Infinity, permanent: true };
    }
    if(bestBuff) {
      return { ...bestBuff, expireAt: bestExpire };
    }
    return null;
  },

  // 获取所有生效的 buff 列表
  getAllActiveBuffs() {
    const result = [];
    const permBonus = this.getPermanentBonus();
    if(permBonus > 1) {
      result.push({ id: "permanent", name: "永久加成", icon: "星", multiplier: permBonus, permanent: true });
    }
    if(data.__activeBuffs && data.__activeBuffs.length > 0) {
      const now = Date.now();
      for(const b of data.__activeBuffs) {
        if(b.expireAt > now) {
          const cfg = BUFF_ITEMS[b.buffId];
          if(cfg) {
            result.push({ ...cfg, expireAt: b.expireAt });
          }
        }
      }
    }
    return result;
  },

  // 计算实际发放糖币（含 buff 倍率）
  _calcAmount(base) {
    const buff = this.getActiveBuff();
    if(!buff) return base;
    return Math.floor(base * buff.multiplier);
  },

  // 激活 buff
  activateBuff(buffId) {
    const cfg = BUFF_ITEMS[buffId];
    if(!cfg) return false;
    if(cfg.permanent) {
      this.setPermanentBonus(cfg.multiplier);
      return true;
    }
    if(!data.__activeBuffs) data.__activeBuffs = [];
    data.__activeBuffs.push({
      buffId,
      activateAt: Date.now(),
      expireAt: Date.now() + cfg.duration
    });
    return true;
  },

  // 是否拥有永久增益
  hasPermanentBuff() {
    return this.getPermanentBonus() > 1;
  },

  // ========== 连续记录系统 ==========
  _getStreaks() {
    if(!data.__streaks) {
      data.__streaks = {
        taskStreak: 0,
        taskLastDate: null,
        moneyStreak: 0,
        moneyLastDate: null,
        taskMilestones: {},
        moneyMilestones: {}
      };
    }
    return data.__streaks;
  },

  getTaskStreak() {
    return this._getStreaks().taskStreak || 0;
  },
  getMoneyStreak() {
    return this._getStreaks().moneyStreak || 0;
  },

  // 更新任务连续天数
  updateTaskStreak() {
    const s = this._getStreaks();
    const tdy = today();
    if(s.taskLastDate === tdy) return; // 今天已更新

    const yesterday = this._getYesterday();
    if(s.taskLastDate === yesterday) {
      s.taskStreak = (s.taskStreak || 0) + 1;
    } else if(s.taskLastDate) {
      // 断签1天：衰减3天而非归零
      s.taskStreak = Math.max(0, (s.taskStreak || 0) - 3);
      if(s.taskStreak === 0) s.taskStreak = 1; // 衰减到0则重新从1开始
    } else {
      s.taskStreak = 1; // 首次记录
    }
    s.taskLastDate = tdy;

    // 检测里程碑
    this._checkStreakMilestones("task", s.taskStreak);
  },

  // 更新记账连续天数
  updateMoneyStreak() {
    const s = this._getStreaks();
    const tdy = today();
    if(s.moneyLastDate === tdy) return; // 今天已更新

    const yesterday = this._getYesterday();
    if(s.moneyLastDate === yesterday) {
      s.moneyStreak = (s.moneyStreak || 0) + 1;
    } else if(s.moneyLastDate) {
      // 断签1天：衰减3天而非归零
      s.moneyStreak = Math.max(0, (s.moneyStreak || 0) - 3);
      if(s.moneyStreak === 0) s.moneyStreak = 1;
    } else {
      s.moneyStreak = 1; // 首次记录
    }
    s.moneyLastDate = tdy;

    // 检测里程碑
    this._checkStreakMilestones("money", s.moneyStreak);
  },

  _getYesterday() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },

  // 检测连续里程碑奖励
  _checkStreakMilestones(type, currentDays) {
    const s = this._getStreaks();
    const milestones = STREAK_MILESTONES[type];
    const key = type + "Milestones";
    if(!s[key]) s[key] = {};

    for(const m of milestones) {
      if(currentDays >= m.days && !s[key][m.days]) {
        s[key][m.days] = true;
        // 发放奖励
        this._add(m.reward, "streak", `连续${m.days}天${type === 'task' ? '任务' : '记账'}里程碑`, null);
        showCatPopup(`连续${m.days}天达成！`, `+${m.reward} 糖币`, false);
      }
    }
  },

  // ========== 每日任务系统 ==========
  getDailyTasks() {
    const tdy = today();
    if(!data.__dailyTasks || data.__dailyTasks.date !== tdy) {
      // 刷新每日任务
      data.__dailyTasks = {
        date: tdy,
        tasks: [
          { id: "daily_task", name: "完成1个任务", reward: 15, done: false, desc: "今日完成任意1个待办任务", icon: "✓" },
          { id: "daily_money", name: "记1笔账", reward: 10, done: false, desc: "今日记录1笔收支账目", icon: "钱" },
          { id: "daily_login", name: "登录打卡", reward: 5, done: false, desc: "今日登录糖果小铺", icon: "爪" },
        ]
      };
    }
    return data.__dailyTasks;
  },

  // 完成每日任务
  completeDailyTask(taskId) {
    const daily = this.getDailyTasks();
    const task = daily.tasks.find(t => t.id === taskId);
    if(!task || task.done) return false;
    task.done = true;
    const amount = this._calcAmount(task.reward);
    this._add(amount, "daily", `每日任务: ${task.name}`, null);
    showCatPopup(`每日任务完成！`, `+${amount} 糖币`, false);
    return true;
  },

  // 检查并触发每日任务（任务完成时调用）
  checkDailyTask(type) {
    const daily = this.getDailyTasks();
    if(type === "task") {
      const t = daily.tasks.find(x => x.id === "daily_task");
      if(t && !t.done) this.completeDailyTask("daily_task");
    } else if(type === "money") {
      const t = daily.tasks.find(x => x.id === "daily_money");
      if(t && !t.done) this.completeDailyTask("daily_money");
    }
  },

  // 登录打卡
  doLoginCheckin() {
    const daily = this.getDailyTasks();
    const t = daily.tasks.find(x => x.id === "daily_login");
    if(t && !t.done) {
      this.completeDailyTask("daily_login");
      return true;
    }
    return false;
  },

  // ========== 称号系统 ==========
  _getTitles() {
    if(!data.__titles) data.__titles = {};
    return data.__titles;
  },

  getUnlockedTitles() {
    return this._getTitles();
  },

  // 获取当前最高称号
  getCurrentTitle() {
    const lvl = this.catLevel();
    const titles = getAllTitles().filter(t => t.level <= lvl);
    if(titles.length === 0) return null;
    return titles[titles.length - 1];
  },

  // 检查并解锁新称号（升级时调用）
  _checkTitleUnlock() {
    const lvl = this.catLevel();
    const titles = this._getTitles();
    const allTitles = getAllTitles();
    for(const t of allTitles) {
      if(lvl >= t.level && !titles[t.id]) {
        titles[t.id] = new Date().toISOString();
        // 显示称号弹窗
        showTitlePopup(t);
      }
    }
  },

  // ========== 等级系统 ==========
  // 小猫等级（由累计获得糖币驱动）
  catLevel() {
    if(data.__catLevel) return data.__catLevel;
    // 根据累计糖币计算初始等级
    const earned = this.totalEarned();
    let lvl = 1;
    let threshold = 0;
    for(let i = 1; i <= 50; i++) {
      threshold += this._getLevelCost(i);
      if(earned >= threshold) lvl = i + 1;
      else break;
    }
    lvl = Math.min(50, Math.max(1, lvl));
    data.__catLevel = lvl;
    return lvl;
  },

  _getLevelCost(level) {
    // 升级所需糖币：每级递增，前几级较低
    if(level <= 5) return 50 + level * 20;
    if(level <= 10) return 100 + level * 30;
    if(level <= 20) return 200 + level * 50;
    if(level <= 30) return 400 + level * 80;
    if(level <= 40) return 800 + level * 120;
    return 1500 + level * 180;
  },

  // 检查升级
  _checkLevelUp() {
    const earned = this.totalEarned();
    let threshold = 0;
    let newLevel = 1;
    for(let i = 1; i <= 50; i++) {
      threshold += this._getLevelCost(i);
      if(earned >= threshold) newLevel = i + 1;
      else break;
    }
    newLevel = Math.min(50, Math.max(1, newLevel));
    const oldLevel = data.__catLevel || 1;
    if(newLevel > oldLevel) {
      data.__catLevel = newLevel;
      // 称号解锁会在 _add 中调用 _checkTitleUnlock
    }
  },

  // 升级（道具使用）
  levelUp(times) {
    const cur = this.catLevel();
    const next = Math.min(50, cur + times);
    if(next > cur) {
      data.__catLevel = next;
      this._checkTitleUnlock();
      return true;
    }
    return false;
  },

  // 获取等级进度
  getLevelProgress() {
    const lvl = this.catLevel();
    if(lvl >= 50) return { current: 100, next: 100, percent: 100 };
    const earned = this.totalEarned();
    let spent = 0;
    for(let i = 1; i < lvl; i++) {
      spent += this._getLevelCost(i);
    }
    const currentLvlCost = this._getLevelCost(lvl);
    const progress = earned - spent;
    return {
      current: Math.max(0, progress),
      next: currentLvlCost,
      percent: Math.min(100, Math.max(0, (progress / currentLvlCost) * 100))
    };
  },

  // ========== 藏品系统 ==========
  getCollection() {
    return data.__collection || {};
  },
  addToCollection(itemId) {
    if(!data.__collection) data.__collection = {};
    data.__collection[itemId] = (data.__collection[itemId] || 0) + 1;
  },
  hasItem(itemId) {
    return (data.__collection && data.__collection[itemId] > 0);
  },
  getItemCount(itemId) {
    return (data.__collection && data.__collection[itemId]) || 0;
  },

  // ========== 任务/记账奖励 ==========
  // 任务完成奖励
  awardTask(taskTitle, taskId) {
    const amount = this._calcAmount(CANDY_RULES.TASK_COMPLETE);
    this._add(amount, "task", `完成任务: ${taskTitle}`, taskId);
    const buff = this.getActiveBuff();
    let extra = buff ? ` (${buff.multiplier}x)` : "";
    showCatPopup("任务完成喵！" + extra, `+${amount} 糖币`, false);
    // 更新连续天数
    this.updateTaskStreak();
    // 每日任务检查
    this.checkDailyTask("task");
  },

  // 记账奖励
  awardFinance(recordTitle, recordId) {
    const amount = this._calcAmount(CANDY_RULES.FINANCE_RECORD);
    this._add(amount, "finance", `记账: ${recordTitle}`, recordId);
    const buff = this.getActiveBuff();
    let extra = buff ? ` (${buff.multiplier}x)` : "";
    showCatPopup("记账成功喵！" + extra, `+${amount} 糖币`, false);
    // 更新连续天数
    this.updateMoneyStreak();
    // 每日任务检查
    this.checkDailyTask("money");
  },

  // 兑换消耗（扣糖币）
  spend(cost, itemName, itemId) {
    if(auth.isFamily()) return false;
    if(this.total() < cost) return false;
    if(!data.__candyLog) data.__candyLog = [];
    data.__candyLog.unshift({
      id: Date.now() + Math.random(),
      type: "redeem", amount: -cost,
      description: `兑换: ${itemName}`,
      time: new Date().toISOString(),
      refId: itemId || null
    });
    window.__candyJustChanged = true;
    showCatPopup("兑换成功喵！", `-${cost} 糖币`, true);
    return true;
  },

  // 今日获得
  todayEarned() {
    const tdy = today();
    return (data.__candyLog || [])
      .filter(x => x.amount > 0 && x.time && x.time.startsWith(tdy))
      .reduce((s, x) => s + x.amount, 0);
  },

  // 历史存量核算（一次性）
  doHistorySettlement() {
    if(data.__historySettled) return { settled: false };
    const todoMod = CONFIG.modules.find(m => m.type === "todo");
    const moneyMod = CONFIG.modules.find(m => m.type === "finance");
    const todoKey = todoMod ? todoMod.key : "todo";
    const moneyKey = moneyMod ? moneyMod.key : "money";

    let taskCount = 0;
    let financeCount = 0;
    let totalAward = 0;

    // 扫描已完成且未结算的任务
    const todos = data[todoKey] || [];
    for(const t of todos) {
      if(t.done && !t._candySettled) {
        const amt = CANDY_RULES.TASK_COMPLETE;
        this._add(amt, "task", `历史任务: ${t.title}`, t.id);
        t._candySettled = true;
        taskCount++;
        totalAward += amt;
      }
    }

    // 扫描已存在且未结算的记账记录
    const moneys = data[moneyKey] || [];
    for(const m of moneys) {
      if(!m._candySettled) {
        const amt = CANDY_RULES.FINANCE_RECORD;
        this._add(amt, "finance", `历史记账: ${m.title || m.category || '记录'}`, m.id);
        m._candySettled = true;
        financeCount++;
        totalAward += amt;
      }
    }

    data.__historySettled = true;
    return { settled: true, taskCount, financeCount, totalAward };
  },
};

// 称号弹窗
function showTitlePopup(title) {
  let p = document.getElementById("titlePopup");
  if(!p) {
    p = document.createElement("div");
    p.id = "titlePopup";
    p.className = "title-popup";
    p.innerHTML = `
      <div class="tp-label">新称号解锁</div>
      <div class="tp-icon"></div>
      <div class="tp-name"></div>
      <div class="tp-desc"></div>`;
    document.body.appendChild(p);
  }
  p.querySelector(".tp-icon").textContent = title.icon;
  p.querySelector(".tp-name").textContent = title.name;
  p.querySelector(".tp-desc").textContent = title.desc;
  p.classList.remove("show");
  void p.offsetWidth;
  p.classList.add("show");
  clearTimeout(p._timer);
  p._timer = setTimeout(() => p.classList.remove("show"), 3000);
}

// 贴纸放置系统
// 贴纸归属云端 data.__stickerPlacements（带 __ 前缀，随业务数据一起同步），
// 同时保留 localStorage 作为兜底，确保刷新/重登/换设备都能还原。
function getStickerPlacements() {
  const fromData = (typeof data !== "undefined" && data && Array.isArray(data.__stickerPlacements)) ? data.__stickerPlacements : null;
  if(fromData && fromData.length) return fromData;
  try { const ls = JSON.parse(localStorage.getItem("__stickerPlacements") || "[]"); if(Array.isArray(ls) && ls.length) return ls; }
  catch(e) {}
  return [];
}
function saveStickerPlacements(arr) {
  if(typeof data !== "undefined" && data) data.__stickerPlacements = arr;
  try { localStorage.setItem("__stickerPlacements", JSON.stringify(arr)); } catch(e) {}
  store.save();   // 写入本地 + 云端（防抖），贴纸随业务数据同步
}
function placeSticker(stickerId, cardId) {
  const placements = getStickerPlacements();
  const x = 60 + Math.random() * 25;
  const y = 15 + Math.random() * 60;
  const rot = -8 + Math.random() * 16;
  placements.push({ stickerId, cardId, x, y, rot });
  saveStickerPlacements(placements);
}
function removeStickerAt(index) {
  const placements = getStickerPlacements();
  placements.splice(index, 1);
  saveStickerPlacements(placements);
}
function updateStickerPos(index, x, y) {
  const placements = getStickerPlacements();
  if(!placements[index]) return;
  placements[index].x = x;
  placements[index].y = y;
  saveStickerPlacements(placements);
}
function renderPlacedStickers(cardId) {
  const placements = getStickerPlacements();
  const cardPlacements = placements.map((p, i) => ({ ...p, _idx: i })).filter(p => p.cardId === cardId);
  if(!cardPlacements.length) return "";
  return cardPlacements.map(p => {
    const img = shopIcon(p.stickerId);
    if(!img) return "";
    return `<img class="placed-sticker" src="${img}" alt=""
      style="left:${p.x}%;top:${p.y}%;transform:rotate(${p.rot}deg)"
      data-sticker-idx="${p._idx}"
      draggable="true">`;
  }).join("");
}
let _selectedStickerIdx = null;
function clearStickerSelection() {
  document.querySelectorAll(".placed-sticker.selected").forEach(el => el.classList.remove("selected"));
  document.querySelectorAll(".sticker-del-btn").forEach(el => el.remove());
  _selectedStickerIdx = null;
}
function selectSticker(el) {
  clearStickerSelection();
  el.classList.add("selected");
  _selectedStickerIdx = parseInt(el.dataset.stickerIdx);
  const btn = document.createElement("button");
  btn.className = "sticker-del-btn";
  btn.textContent = "×";
  btn.style.left = (parseFloat(el.style.left) + 2) + "%";
  btn.style.top = (parseFloat(el.style.top) - 3) + "%";
  btn.onclick = e => { e.stopPropagation(); confirmDeleteSticker(_selectedStickerIdx); };
  el.parentElement.appendChild(btn);
}
function confirmDeleteSticker(idx) {
  const placements = getStickerPlacements();
  const p = placements[idx];
  if(!p) return;
  const name = (ALL_SHOP_ITEMS[p.stickerId] || {}).name || "该贴纸";
  showConfirm("移除贴纸", `确认移除「${name}」吗？`, () => {
    removeStickerAt(idx);
    clearStickerSelection();
    render();
  });
}
function initStickerDrag() {
  document.querySelectorAll(".placed-sticker").forEach(el => {
    let dragging = false, startX, startY, origX, origY, moved = false;
    let parent = el.parentElement;
    if(!parent) return;
    el.addEventListener("pointerdown", e => {
      dragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      origX = parseFloat(el.style.left) || 0;
      origY = parseFloat(el.style.top) || 0;
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    el.addEventListener("pointermove", e => {
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      const rect = parent.getBoundingClientRect();
      const newX = Math.max(0, Math.min(95, origX + dx / rect.width * 100));
      const newY = Math.max(0, Math.min(90, origY + dy / rect.height * 100));
      el.style.left = newX + "%";
      el.style.top = newY + "%";
      const delBtn = parent.querySelector(".sticker-del-btn");
      if(delBtn) { delBtn.style.left = (newX + 2) + "%"; delBtn.style.top = (newY - 3) + "%"; }
    });
    el.addEventListener("pointerup", e => {
      if(!dragging) return;
      dragging = false;
      if(moved) {
        const idx = parseInt(el.dataset.stickerIdx);
        updateStickerPos(idx, parseFloat(el.style.left), parseFloat(el.style.top));
      } else {
        selectSticker(el);
      }
    });
    el.addEventListener("click", e => { e.stopPropagation(); });
  });
  document.addEventListener("click", e => {
    if(!e.target.closest(".placed-sticker") && !e.target.closest(".sticker-del-btn")) {
      clearStickerSelection();
    }
  });
}

// 原地直接兑换：不再跳转到超市 tab，购买成功后弹窗内刷新为「已拥有」视图
window.__buyFromDetail = function(itemId) {
  const it = ALL_SHOP_ITEMS[itemId];
  if(!it) { showCatPopup("这个不能用糖币兑换喵～", "等级达标后会自动解锁", true); return; }
  const price = LEVEL_ITEMS[it.id] ? getLevelItemPrice(it) : (it.price || it.cost || 0);
  const ov = document.querySelector(".collect-detail-overlay");
  const cat = ov ? (ov.dataset.category || "") : "";
  // handleShopBuy 内部已含权限/限购/余额校验 + persist() + renderGame()
  handleShopBuy(it, price);
  // 购买成功（已入库）→ 原地刷新为「已拥有」；失败则弹窗保持打开（内部已弹 toast 提示）
  const still = document.querySelector(".collect-detail-overlay");
  if(still && candy.hasItem(itemId)) { still.remove(); showCollectDetail(it, cat); }
};

// 称号详情：按 id 查表构造对象。
// 原写法在 inline onclick 里用模板字符串拼对象字面量，会因引号/花括号被截断成
// `showCollectDetail({...rarity:'epic, 'titles')` 而报错，导致点称号打不开弹窗。
window.__showTitleDetail = function(titleId){
  const t = TITLES[titleId];
  if(!t) return;
  const unlocked = !!(candy.getUnlockedTitles() || {})[t.id];
  showCollectDetail({ id:t.id, name:t.name, icon:t.icon, desc:t.desc, price:0, level:t.level,
                      rarity: unlocked ? "epic" : "common" }, "titles");
};

window.__placeSticker = function(stickerId, cardId) {
  const overlay = document.querySelector(".collect-detail-overlay");
  if(overlay) overlay.remove();
  placeSticker(stickerId, cardId || "candy");
  showCatPopup("贴纸已贴上", "拖动可移动位置，点击可移除", false);
  render();
};

/* ============================================================
   CAT POPUP — 布偶小猫成功弹窗
   ============================================================ */
function showCatPopup(msg, pts, isMinus) {
  let p = $("#catPopup");
  if(!p) {
    p = document.createElement("div");
    p.id = "catPopup";
    p.className = "cat-popup";
    p.innerHTML = `
      <div class="cp-deco cp-deco-1"></div>
      <div class="cp-deco cp-deco-2"></div>
      <div class="cp-deco cp-deco-3"></div>
      <div class="cp-ic"><img src="assets/nav-ci-ke.png" alt=""></div>
      <div class="cp-msg"></div>
      <div class="cp-pts"></div>
      <div class="cp-tail"></div>`;
    document.body.appendChild(p);
  }
  p.querySelector(".cp-msg").textContent = msg;
  const pe = p.querySelector(".cp-pts");
  pe.textContent = pts;
  pe.className = "cp-pts" + (isMinus ? " minus" : "");
  p.classList.remove("show");
  // force reflow for animation restart
  void p.offsetWidth;
  p.classList.add("show");
  clearTimeout(p._timer);
  p._timer = setTimeout(() => p.classList.remove("show"), 2000);
}

// 糖币数字弹跳动画 + 卡片发光
function bounceCandy() {
  const ids = ["homeCandyNum", "gameCandyNum"];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.remove("pts-bounce");
    void el.offsetWidth;
    el.classList.add("pts-bounce");
  });
  const candyCard = document.querySelector(".jn-candy");
  if(candyCard) {
    candyCard.classList.remove("candy-glow");
    void candyCard.offsetWidth;
    candyCard.classList.add("candy-glow");
  }
}

      <span class="hint-ic"><img src="assets/stickers/candy.png" alt="糖币" style="width:20px;height:20px;object-fit:contain"></span>
      <span>当前糖币：<strong>${total}</strong> · ${isAdmin ? '管理员账号，可正常兑换' : '家属账号，仅可浏览不可兑换'}</span>
    </div>
    <div class="shop-cat-nav">${shopNavHtml}</div>
    <div class="shop-category">
      <div class="shop-cat-title">${currentCat.name}</div>
      <div class="shop-grid">${renderShopCategory(currentCat.items, currentCat.id)}</div>
    </div>
  `;

  // ============== Tab 3: 我的藏品 ==============
  const allToys = Object.values(TOY_ITEMS);
  const allOutfits = Object.values(OUTFIT_ITEMS);
  const allMemorials = Object.values(MEMORIAL_ITEMS);
  const allTitlesList = getAllTitles();
  const unlockedTitles = candy.getUnlockedTitles();

  const allCollectibles = [...allToys, ...allOutfits, ...allMemorials];
  const ownedCount = allCollectibles.filter(i => collection[i.id]).length;
  const rareItems = allCollectibles.filter(i => i.rarity === 'epic' || i.rarity === 'legendary');

  const renderCollectGrid = (items, catKey) => {
    if(!items.length) return `<div class="pl-empty">暂无藏品</div>`;
    return `<div class="collect-grid">${items.map(it => {
      const owned = collection[it.id] > 0;
      const count = collection[it.id] || 0;
      return `
        <div class="collect-item rarity-${it.rarity || 'common'} ${owned ? 'owned' : 'locked'}"
             onclick="showCollectDetail(ALL_SHOP_ITEMS['${it.id}'], '${catKey}')">
          <div class="collect-icon"><img src="${shopIcon(it.id)}" alt="${it.name}"></div>
          <div class="collect-name">${it.name}</div>
          ${owned ? `<div class="collect-count">×${count}</div>` : `<div class="collect-price">${it.price}糖币</div>`}
        </div>`;
    }).join("")}</div>`;
  };

  const renderTitleGrid = () => {
    if(!allTitlesList.length) return `<div class="pl-empty">暂无称号</div>`;
    return `<div class="collect-grid">${allTitlesList.map(t => {
      const unlocked = !!unlockedTitles[t.id];
      return `
        <div class="collect-item rarity-${unlocked ? 'epic' : 'common'} ${unlocked ? 'owned' : 'locked'}"
             onclick="window.__showTitleDetail('${t.id}')">
          <div class="collect-icon"><img src="assets/stickers/star-glossy.png" alt="${t.name}"></div>
          <div class="collect-name">${t.name}</div>
          ${unlocked ? `<div class="collect-count">已解锁</div>` : `<div class="collect-price">Lv.${t.level}</div>`}
        </div>`;
    }).join("")}</div>`;
  };

  const subTabs = [
    { id: "toys",     name: "玩具图鉴", count: allToys.filter(i => collection[i.id]).length + "/" + allToys.length },
    { id: "outfits",  name: "装扮图鉴", count: allOutfits.filter(i => collection[i.id]).length + "/" + allOutfits.length },
    { id: "memorial", name: "纪念章",   count: allMemorials.filter(i => collection[i.id]).length + "/" + allMemorials.length },
    { id: "titles",   name: "称号图鉴", count: Object.keys(unlockedTitles).length + "/" + allTitlesList.length },
    { id: "rare",     name: "稀有藏品", count: rareItems.filter(i => collection[i.id]).length + "/" + rareItems.length },
  ];

  let collectionListHtml = "";
  if(collectSubTab === "toys") {
    collectionListHtml = renderCollectGrid(allToys, "toys");
  } else if(collectSubTab === "outfits") {
    collectionListHtml = renderCollectGrid(allOutfits, "outfits");
  } else if(collectSubTab === "memorial") {
    collectionListHtml = renderCollectGrid(allMemorials, "memorial");
  } else if(collectSubTab === "titles") {
    collectionListHtml = renderTitleGrid();
  } else if(collectSubTab === "rare") {
    collectionListHtml = renderCollectGrid(rareItems, "rare");
  }

  const collectionContent = `
    <div class="collect-stats">
      <div class="cs-card">
        <div class="cs-num">${lvlInfo.level}</div>
        <div class="cs-label">当前等级</div>
        <div class="cs-sub">Lv.${lvlInfo.level} ${lvlInfo.name}</div>
      </div>
      <div class="cs-card">
        <div class="cs-num">${ownedCount}</div>
        <div class="cs-label">藏品数量</div>
        <div class="cs-sub">共 ${allCollectibles.length} 件</div>
      </div>
      <div class="cs-card">
        <div class="cs-num">${total}</div>
        <div class="cs-label">糖币余额</div>
        <div class="cs-sub">累计 ${candy.totalEarned()}</div>
      </div>
    </div>

    <div class="collect-sub-tabs">
      ${subTabs.map(t => `
        <button class="collect-sub-tab ${collectSubTab===t.id?'active':''}" data-ctab="${t.id}">
          ${t.name}<br><span style="font-size:10px;font-weight:500;opacity:.7">${t.count}</span>
        </button>`).join("")}
    </div>

    <div class="collect-section">
      ${collectionListHtml}
    </div>
  `;

  // ============== 主渲染 ==============
  const tabContent = gameTab === "board" ? boardContent
    : gameTab === "shop" ? shopContent
    : collectionContent;

  // Hero 区 buff 标签
  const heroBuffTags = allBuffs.map(b =>
    `<span class="hero-buff-tag ${b.permanent ? 'permanent' : ''}">${b.icon} ${b.multiplier}x ${b.permanent ? '永久' : ''}</span>`
  ).join("");

  // Hero 区连续天数
  const streakHtml = `
    <div class="streak-row">
      <span class="streak-chip task-streak">任务 ${taskStreak}天</span>
      <span class="streak-chip money-streak">记账 ${moneyStreak}天</span>
    </div>`;

  // 称号显示
  const titleHtml = currentTitle
    ? `<div class="game-hero-title">${currentTitle.icon} ${currentTitle.name}</div>`
    : '';

  $("#screen").innerHTML = `
    <!-- 顶部 Hero 区域 -->
    <div class="game-hero">
      <div class="game-hero-row">
        <div class="game-hero-cat cat-float"><img src="assets/stickers/cat-piggy.png" alt="存钱罐小猫"></div>
        <div class="game-hero-info">
          ${titleHtml}
          <div class="game-hero-level"><span class="lvl-icon">Lv</span>Lv.${lvlInfo.level} ${lvlInfo.name}</div>
          <div class="game-hero-pts" id="gameCandyNum">${total}<span class="pts-unit">糖币</span></div>
          ${allBuffs.length > 0 ? `<div class="game-hero-buffs">${heroBuffTags}</div>` : ''}
          ${streakHtml}
        </div>
        <div class="game-hero-today">
          <div class="num">+${todayEarned}</div>
          <div class="lbl">今日获得</div>
        </div>
      </div>
      <div class="game-hero-bar">
        <div class="game-hero-bar-fill" style="width:${lvlInfo.isMax ? 100 : lvlProgress.percent}%"></div>
      </div>
      <div class="game-hero-bar-lbl">
        <span>Lv.${lvlInfo.level} ${lvlInfo.name}</span>
        <span>${lvlInfo.isMax ? '已满级' : lvlProgress.current + '/' + lvlProgress.next}</span>
        <span>Lv.50 鸿蒙至尊猫</span>
      </div>
    </div>

    <!-- Tab 切换 -->
    <div class="game-tabs">
      <button class="game-tab ${gameTab==='board'?'active':''}" data-tab="board">${icon("grid", 14)} 总览</button>
      <button class="game-tab ${gameTab==='shop'?'active':''}" data-tab="shop">${icon("star", 14)} 超市</button>
      <button class="game-tab ${gameTab==='collection'?'active':''}" data-tab="collection">${icon("book", 14)} 藏品</button>
    </div>

    <!-- Tab 内容 -->
    <div class="game-tab-content">${tabContent}</div>`;

  // ============== 事件绑定 ==============
  // Tab 切换
  $("#screen").querySelectorAll(".game-tab").forEach(el => el.onclick = () => {
    gameTab = el.dataset.tab;
    renderGame();
  });
  $("#screen").querySelectorAll("[data-tab]").forEach(el => {
    if(!el.classList.contains("game-tab")) {
      el.onclick = () => { gameTab = el.dataset.tab; renderGame(); };
    }
  });

  // 超市分类切换
  $("#screen").querySelectorAll("[data-scat]").forEach(el => {
    el.onclick = () => { shopCatTab = el.dataset.scat; renderGame(); };
  });

  // 藏品子分类切换
  $("#screen").querySelectorAll("[data-ctab]").forEach(el => {
    el.onclick = () => { collectSubTab = el.dataset.ctab; renderGame(); };
  });

  // 糖币看板：任务勾选
  $("#screen").querySelectorAll(".js-gc-chk").forEach(el => el.onclick = () => {
    const t = (data[todoKey] || []).find(x => x.id == el.dataset.id);
    if(!t) return;
    if(!t.done) { t.done = true; if(!t._candySettled) { t._candySettled = true; candy.awardTask(t.title, t.id); } }
    else { t.done = false; }
    persist();
  });

  // 快捷兑换
  $("#screen").querySelectorAll(".js-quick-buy").forEach(el => el.onclick = () => {
    if(!isAdmin) { showCatPopup("仅管理员可兑换喵～", "权限不足", true); return; }
    const it = ALL_SHOP_ITEMS[el.dataset.id];
    if(!it) return;
    const price = it.price || it.cost || 0;
    handleShopBuy(it, price);
  });

  // 超市兑换
  $("#screen").querySelectorAll(".js-shop-buy").forEach(el => el.onclick = () => {
    if(!isAdmin) { showCatPopup("仅管理员可兑换喵～", "权限不足", true); return; }
    const it = ALL_SHOP_ITEMS[el.dataset.id];
    if(!it) return;
    // 成长道具使用动态定价
    const price = LEVEL_ITEMS[it.id] ? getLevelItemPrice(it) : (it.price || it.cost || 0);
    handleShopBuy(it, price);
  });

  // 每日任务：登录打卡
  $("#screen").querySelectorAll(".js-daily-login").forEach(el => el.onclick = () => {
    if(!isAdmin) { showCatPopup("仅管理员可打卡喵～", "权限不足", true); return; }
    if(candy.doLoginCheckin()) {
      persist();
      renderGame();
    }
  });

  // Buff 倒计时刷新
  if(allBuffs.length > 0) {
    if(window.__buffTimer) clearInterval(window.__buffTimer);
    window.__buffTimer = setInterval(() => {
      const t = $("#buffTimer");
      if(t) {
        const buff = allBuffs[0];
        if(buff.permanent) return;
        const ms = buff.expireAt - Date.now();
        if(ms <= 0) { clearInterval(window.__buffTimer); renderGame(); return; }
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor(ms / 1000) % 60;
        t.textContent = h > 0 ? `${h}h ${m}m` : `${m}m ${s}s`;
      } else {
        clearInterval(window.__buffTimer);
      }
    }, 1000);
  }
}

// 处理商品购买
function handleShopBuy(item, price) {
  const isAdmin = auth.isAdmin();
  if(!isAdmin) { showCatPopup("仅管理员可兑换喵～", "权限不足", true); return; }

  // 永久增益限购1次
  if(item.permanent && candy.hasPermanentBuff()) {
    showCatPopup("已拥有永久增益喵～", "限购1次", true);
    return;
  }

  if(candy.total() < price) {
    showCatPopup("糖币不够喵～", "差 " + (price - candy.total()) + " 糖币", true);
    return;
  }
  // 扣糖币
  if(!candy.spend(price, item.name, item.id)) return;

  // 分类处理
  if(BUFF_ITEMS[item.id]) {
    candy.activateBuff(item.id);
    if(item.permanent) {
      showCatPopup("永久增益已激活！" + item.icon, item.multiplier + "x 永久加成", false);
    } else {
      showCatPopup("Buff 已激活！" + item.icon, item.multiplier + "x 糖币", false);
    }
  } else if(TOY_ITEMS[item.id]) {
    candy.addToCollection(item.id);
    showCatPopup("玩具收入藏品！" + item.icon, item.name, false);
  } else if(OUTFIT_ITEMS[item.id]) {
    candy.addToCollection(item.id);
    showCatPopup("装扮收入藏品！" + item.icon, item.name, false);
  } else if(LEVEL_ITEMS[item.id]) {
    // 成长道具：检查限购
    if(!canBuyLevelItem(item.id)) {
      showCatPopup("已达限购上限喵～", `最多使用 ${item.maxUses} 次`, true);
      return;
    }
    const before = candy.catLevel();
    candy.levelUp(item.levelUp);
    // 记录使用次数
    if(!data.__levelItemUses) data.__levelItemUses = {};
    data.__levelItemUses[item.id] = (data.__levelItemUses[item.id] || 0) + 1;
    const after = candy.catLevel();
    if(after > before) {
      showCatPopup("升级啦！", `Lv.${before} → Lv.${after}`, false);
    } else {
      showCatPopup("已满级啦～", "已达最高等级", false);
    }
  } else if(MEMORIAL_ITEMS[item.id]) {
    candy.addToCollection(item.id);
    showCatPopup("纪念藏品 +1！" + item.icon, item.name, false);
  }
  persist();
  renderGame();
}

/* ============================================================
   USER MANAGEMENT PAGE
   ============================================================ */
async function renderUsers() {
  const cur = auth.session;
  const users = await auth.fetchUsers();
  const groups = await auth.fetchGroups();
  const approvedUsers = users.filter(u => !u.apply_status || u.apply_status === "approved");
  const totalApproved = approvedUsers.length;

  // Build group cards
  let groupCards = "";
  if(groups.length === 0) {
    groupCards = `<div class="pl-empty" style="padding:30px;text-align:center">
      <div style="font-size:13px;color:var(--text-secondary)">暂无分组</div>
    </div>`;
  } else {
    groupCards = groups.map(g => {
      const members = users.filter(u => u.group_id === g.id && u.apply_status === "approved");
      const admin = members.find(u => u.role === "admin");
      const family = members.find(u => u.role === "family");
      const isMyGroup = cur.groupId === g.id;

      const memberHtml = [admin, family].filter(Boolean).map(u => {
        const isSelf = u.id === cur.userId;
        const canChangeAvatar = isSelf || (auth.isAdmin() && isMyGroup);
        const userAvatars = data.__userAvatars || {};
        const avatarSrc = userAvatars[u.id];
        const avatarHtml = avatarSrc
          ? `<img src="${esc(avatarSrc)}" alt="${esc(u.username)}">`
          : (u.role === 'admin' ? '管理员' : '猫猫');
        const camHtml = canChangeAvatar
          ? `<span class="avatar-cam">${icon("camera",14)}</span>`
          : '';
        return `
          <div class="group-member">
            <div class="gm-info">
              <div class="gm-avatar js-change-avatar" data-uid="${u.id}" data-name="${esc(u.username)}" ${canChangeAvatar?'':'style="cursor:default"'}>${avatarHtml}${camHtml}</div>
              <div>
                <div class="gm-name">${esc(u.username)}</div>
                <div class="gm-meta">加入于 ${new Date(u.created_at).toLocaleDateString('zh-CN')}</div>
              </div>
            </div>
            <span class="gm-role ${u.role}">${u.role === 'admin' ? '管理员' : '家属'}</span>
            ${isSelf ? '<span class="gm-self">当前</span>' :
              (auth.isAdmin() && isMyGroup && u.role === 'family' ?
                `<span class="gm-del js-del-user" data-id="${u.id}" data-name="${esc(u.username)}">删除</span>` :
                (auth.isAdmin() && !isMyGroup ? '' : ''))}
            ${auth.isAdmin() && u.role === 'admin' && !isSelf ? '' : ''}
          </div>`;
      }).join("");

      const emptySlots = [];
      if(!admin) emptySlots.push({ role: 'admin', label: '管理员空缺' });
      if(!family) emptySlots.push({ role: 'family', label: '家属空缺' });

      const emptyHtml = emptySlots.map(s => `
        <div class="group-member" style="opacity:.4">
          <div class="gm-info">
            <div class="gm-avatar">${s.role === 'admin' ? '管理员' : '猫猫'}</div>
            <div>
              <div class="gm-name" style="color:var(--text-tertiary)">${s.label}</div>
              <div class="gm-meta">虚位以待</div>
            </div>
          </div>
          <span class="gm-role ${s.role}">${s.role === 'admin' ? '管理员' : '家属'}</span>
        </div>`).join("");

      return `
        <div class="group-card" data-gid="${g.id}">
          <div class="gc-head">
            <div class="gc-name">
              ${isMyGroup ? '★' : '·'} <span class="gc-name-text" data-gid="${g.id}">${esc(g.name)}</span>
              ${isMyGroup && auth.isAdmin() ? `<span class="gc-edit-name js-edit-group-name" data-gid="${g.id}" data-name="${esc(g.name)}">${icon("edit",13)}</span>` : ''}
              ${isMyGroup ? '<span class="gc-badge">我的组</span>' : ''}
            </div>
            <div class="gc-count">${members.length}/2 人</div>
          </div>
          <div class="gc-body">
            ${memberHtml}
            ${emptyHtml}
          </div>
        </div>`;
    }).join("");
  }

  // Pending applications (only visible to admin, for their own group)
  let pendingHtml = "";
  if(auth.isAdmin() && cur.groupId) {
    const pendingApps = users.filter(u => u.group_id === cur.groupId && u.apply_status === "pending");
    if(pendingApps.length > 0) {
      pendingHtml = `
        <div class="sec-title">待审批申请 <span style="font-size:11px;font-weight:500;color:var(--candy)">${pendingApps.length} 条</span></div>
        <div class="pending-list">
          <div class="pl-head">
            <div class="pl-title">⏳ 家属加入申请</div>
            <div class="pl-count">${pendingApps.length} 人待审</div>
          </div>
          ${pendingApps.map(u => `
            <div class="app-item">
              <div class="ai-info">
                <div class="ai-name">${esc(u.username)}</div>
                <div class="ai-meta">申请于 ${new Date(u.created_at).toLocaleDateString('zh-CN')}</div>
              </div>
              <div class="ai-actions">
                <span class="ai-btn approve js-approve" data-id="${u.id}" data-name="${esc(u.username)}">同意</span>
                <span class="ai-btn reject js-reject" data-id="${u.id}" data-name="${esc(u.username)}">驳回</span>
              </div>
            </div>`).join("")}
        </div>`;
    }
  }

  $("#screen").innerHTML = `
    <div class="user-bar">
      <div>
        <div class="ub-name">${esc(cur.username)}</div>
        <div class="ub-role">${cur.role === 'admin' ? '管理员' : '家属'} · 已用 ${totalApproved}/${CONFIG.maxUsers} 名额</div>
      </div>
      <div class="ub-actions" style="display:flex;gap:8px;align-items:center">
        <span class="ub-change-pw" id="changePwBtn" style="font-size:12px;color:var(--accent);cursor:pointer;padding:6px 14px;border:1px solid var(--accent-muted);border-radius:10px;white-space:nowrap">修改密码</span>
        <span class="ub-logout" id="logoutBtn">退出登录</span>
      </div>
    </div>
    ${pendingHtml}
    <div class="sec-title">分组列表 <span style="font-size:11px;font-weight:500;color:var(--text-secondary)">${groups.length} 个分组</span></div>
    ${groupCards}`;

  // Logout & change password
  const lb = $("#logoutBtn");
  if(lb) lb.onclick = () => auth.logout();
  const cpw = $("#changePwBtn");
  if(cpw) cpw.onclick = () => openChangePassword();

  // Edit group name (only admin in their own group)
  $("#screen").querySelectorAll(".js-edit-group-name").forEach(el => el.onclick = async () => {
    const gid = +el.dataset.gid;
    const oldName = el.dataset.name;
    const overlay = document.createElement("div"); overlay.className = "overlay";
    overlay.innerHTML = `<div class="modal"><div class="grab"></div>
      <div class="modal-cat"><img src="assets/nav-ci-ke.png" alt=""></div>
      <h2>修改分组名</h2>
      <div class="sub">给你们的分组起个新名字喵～</div>
      <input class="ipt" id="gn-input" value="${esc(oldName)}" maxlength="20" placeholder="输入分组名称" style="margin:12px 0;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;">
      <div class="modal-actions"><button class="btn ghost" id="gn-cancel">取消</button><button class="btn" id="gn-ok" style="background:var(--accent)">保存</button></div></div>`;
    document.body.appendChild(overlay);
    const inp = overlay.querySelector("#gn-input");
    inp.focus(); inp.select();
    const close = () => overlay.remove();
    overlay.onclick = e => { if(e.target === overlay) close(); };
    overlay.querySelector("#gn-cancel").onclick = close;
    overlay.querySelector("#gn-ok").onclick = async () => {
      const newName = inp.value.trim();
      if(!newName) { inp.focus(); return; }
      if(newName === oldName) { close(); return; }
      overlay.querySelector("#gn-ok").textContent = "保存中...";
      overlay.querySelector("#gn-ok").disabled = true;
      try {
        const res = await fetch(CONFIG.sbUrl + "/rest/v1/groups?id=eq." + gid, {
          method: "PATCH",
          headers: {
            "apikey": CONFIG.sbKey,
            "Authorization": "Bearer " + CONFIG.sbKey,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({ name: newName })
        });
        if(!res.ok) throw new Error("update failed");
        close();
        renderUsers();
      } catch(e) {
        alert("修改失败，请重试喵～");
        close();
      }
    };
    inp.onkeydown = e => { if(e.key === "Enter") overlay.querySelector("#gn-ok").click(); };
  });

  // Delete user (only admin can delete, and only family in their own group, or they can delete themselves)
  $("#screen").querySelectorAll(".js-del-user").forEach(el => el.onclick = () => {
    const userId = +el.dataset.id;
    const userName = el.dataset.name;
    const overlay = document.createElement("div"); overlay.className = "overlay";
    overlay.innerHTML = `<div class="modal"><div class="grab"></div>
      <div class="modal-cat"><img src="assets/nav-ci-ke.png" alt=""></div>
      <h2>删除账号</h2>
      <div class="sub">确认删除「${esc(userName)}」？将同步清空该账号全部业务数据，此操作不可恢复喵～</div>
      <div class="modal-actions"><button class="btn ghost" id="du-cancel">取消</button><button class="btn danger" id="du-ok">确认删除</button></div></div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.onclick = e => { if(e.target === overlay) close(); };
    overlay.querySelector("#du-cancel").onclick = close;
    overlay.querySelector("#du-ok").onclick = async () => {
      overlay.querySelector("#du-ok").textContent = "删除中...";

    overlay.onclick = e => { if(e.target === overlay) close(); };
    overlay.querySelector("#ap-cancel").onclick = close;
    overlay.querySelector("#ap-ok").onclick = async () => {
      overlay.querySelector("#ap-ok").textContent = "处理中...";
      overlay.querySelector("#ap-ok").disabled = true;
      const r = await auth.approveApplication(userId);
      if(r.error) { alert(r.error); close(); return; }
      close();
      renderUsers();
    };
